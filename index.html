  // --- Move the explosion bits and let them fade out ---
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life++;
  }
  particles = particles.filter((p) => p.life < p.maxLife);

  // --- Grow the blast rings and drop them once they're full size ---
  for (const r of shockwaves) r.life++;
  shockwaves = shockwaves.filter((r) => r.life < BOMB_RING);

  // --- Lose a base, lose the game ---
  // If ANY base is completely wiped out, it's game over — protect them all!
  // EXCEPT against the boss. Blowing your cover apart is the whole point of
  // its exploding eggs, and ending the run the moment it manages it would be
  // no fun at all. On a boss stage you simply lose the cover, and have to get
  // through the rest of the fight out in the open.
  if (!isBossStage() && bases.some((base) => base.blocks.every((blk) => !blk.alive))) {
    state = "lost";
  }

  // --- Cleared the herd? On to the next (faster) stage! ---
  // Only if you're still alive, of course.
  if (state === "playing" && invaders.every((inv) => !inv.alive)) nextStage();
}

// ---------------------------------------------------------------------
// jumpBolt(): work out where ONE of the ELECTRIC ARC's jumps should be
// drawn. The current doesn't leap out of the ship — it walks through the
// herd, animal to animal, so a jump starts at the nearest animal still
// standing between this one and the beam. If nobody is left in between, it
// comes straight off the beam column instead. `hop` is how far out the
// animal is; `bright` is how hard the current is biting it this frame.
// ---------------------------------------------------------------------
function jumpBolt(inv, hop, bright) {
  let from = null;
  const out = Math.abs(inv.x - player.x);
  for (const o of invaders) {
    if (!o.alive || o === inv) continue;
    if (Math.abs(o.y - inv.y) > 1) continue;                    // same row only
    if ((o.x - player.x) * (inv.x - player.x) < 0) continue;    // same side only
    if (Math.abs(o.x - player.x) >= out) continue;              // must be nearer in
    if (!from || Math.abs(o.x - inv.x) < Math.abs(from.x - inv.x)) from = o;
  }
  return {
    x1: from ? from.x : player.x, y1: from ? from.y : inv.y,
    x2: inv.x, y2: inv.y, hop: hop, bright: bright,
  };
}

// ---------------------------------------------------------------------
// hit(): simple box overlap check. Are two things close enough to
// count as touching? (This is "bounding-box" collision.)
// ---------------------------------------------------------------------
function hit(ax, ay, bx, by, size) {
  return Math.abs(ax - bx) < size / 2 && Math.abs(ay - by) < size / 2;
}

// ---------------------------------------------------------------------
// pickShooter(): choose which animal fires next. Like the arcade game,
// only the FRONT (lowest) animal in a column can shoot — so as you clear
// columns, fewer animals can fire at you. Picks a random column each time.
// ---------------------------------------------------------------------
function pickShooter() {
  const alive = invaders.filter((inv) => inv.alive);
  if (alive.length === 0) return null;
  // Pick a random living animal, then find the lowest one in its column.
  const pick = alive[Math.floor(Math.random() * alive.length)];
  let front = pick;
  for (const inv of alive) {
    if (Math.abs(inv.x - pick.x) < 1 && inv.y > front.y) front = inv;
  }
  return front;
}

// ---------------------------------------------------------------------
// isCarved(): which block spots are CUT OUT to give a base its shape —
// rounded top corners and an arched doorway in the bottom middle.
// ---------------------------------------------------------------------
function isCarved(r, c) {
  const lastRow = BASE_BLOCKS_H - 1;
  const lastCol = BASE_BLOCKS_W - 1;
  const mid = Math.floor(BASE_BLOCKS_W / 2);
  // Round off the two top corners.
  if (r === 0 && (c === 0 || c === lastCol)) return true;
  // Carve an arched doorway up from the bottom middle.
  if (r === lastRow && Math.abs(c - mid) <= 1) return true; // 3 blocks wide at the very bottom
  if (r === lastRow - 1 && c === mid) return true;          // 1 block higher in the centre
  return false;
}

// ---------------------------------------------------------------------
// hitBase(): did a shot/bullet at (x, y) hit a base block? If so, that
// block crumbles away and we return true (so the shot is used up).
// ---------------------------------------------------------------------
function hitBase(x, y, peek) {
  for (const base of bases) {
    for (const blk of base.blocks) {
      if (blk.alive && hit(x, y, blk.x, blk.y, BASE_BLOCK)) {
        // `peek` asks "did it touch cover?" WITHOUT chipping anything —
        // an exploding egg wants to know, but the blast does the damage.
        if (!peek) blk.alive = false;
        return true;
      }
    }
  }
  return false;
}

// ---------------------------------------------------------------------
// eggBlast(): one of the BIG CHICK's eggs goes off. Unlike your own
// BLAST CANNON, this one leaves the animals alone and goes after your
// side of the board: it blows a hole clean through a base, and if you're
// standing inside the blast it costs you a life. Cover works against the
// herd's ordinary shots, but not against these — an egg that lands on
// your shield takes a piece of the shield with it.
// ---------------------------------------------------------------------
function eggBlast(x, y) {
  spawnExplosion(x, y, EGG_BOOM);
  shockwaves.push({ x: x, y: y, life: 0, radius: EGG_RADIUS, color: "#fff0b0" });
  playExplosionSound(true);
  for (const base of bases) {
    for (const blk of base.blocks) {
      if (blk.alive && Math.hypot(blk.x - x, blk.y - y) <= EGG_RADIUS) blk.alive = false;
    }
  }
  // Caught in it? That's a life — the same as being hit head-on.
  if (invuln === 0 && Math.hypot(player.x - x, player.y - y) <= EGG_RADIUS) {
    lives--;
    invuln = SAFE_TIME;
    spawnExplosion(player.x, player.y, 2.5);
    if (lives <= 0) state = "lost";
  }
}

// ---------------------------------------------------------------------
// EXPLOSIONS — when an animal is shot, throw out a little burst of
// coloured bits that fly apart and fade away.
// ---------------------------------------------------------------------
// ---------------------------------------------------------------------
// bombBlast(): a BLAST CANNON shell goes off at (x, y). Every animal
// within BOMB_RADIUS takes damage — full strength right next to the bang
// (inside BOMB_CORE) and half strength out at the edges. So a shell
// downs whatever it lands on and leaves the neighbours winged, and a
// second one finishes the cluster off.
// Your bases are left alone; the shell only goes off on an animal.
// ---------------------------------------------------------------------
function bombBlast(x, y) {
  spawnExplosion(x, y, BOMB_BOOM); // a big one, so you can see the blast
  // A ring that races out to exactly BOMB_RADIUS, so you can SEE how far
  // the blast reached and learn where to aim the next shell.
  shockwaves.push({ x: x, y: y, life: 0 });
  playExplosionSound(true);
  for (const inv of invaders) {
    if (!inv.alive) continue;
    // Measure to the nearest bit of the animal rather than to its middle. For
    // ordinary animals those are the same place, so nothing changes — but on
    // something the size of the BIG CHICK they're 110 pixels apart, and a
    // shell that plainly went off against its side ought to hurt it.
    const spare = (sizeOf(inv) - CELL) / 2;
    const dist = Math.hypot(Math.max(0, Math.abs(inv.x - x) - spare),
                            Math.max(0, Math.abs(inv.y - y) - spare));
    if (dist > BOMB_RADIUS) continue;
    inv.hp -= dist <= BOMB_CORE ? BOMB_DAMAGE : BOMB_DAMAGE / 2;
    // Nothing walks away from a shell half-standing: anything knocked to
    // half health or below is finished off by the shock. So the blast
    // clears its whole radius, rather than leaving wounded animals behind.
    if (inv.hp <= 0.5) {
      inv.alive = false;
      spawnExplosion(inv.x, inv.y, inv.boss ? 5 : 1);
      score += inv.boss ? BOSS_POINTS : 10;
    }
  }
}

const BOOM_COLORS = ["#ffffff", "#ffd34d", "#ff8c1a", "#ff4d4d"];
function spawnExplosion(x, y, scale = 1) {
  const count = Math.round(16 * scale);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (1 + Math.random() * 3.5) * scale;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0,
      maxLife: (18 + Math.random() * 16) * scale,
      color: BOOM_COLORS[Math.floor(Math.random() * BOOM_COLORS.length)],
    });
  }
}


// ---------------------------------------------------------------------
// THE SHOP — the ships you've earned, and the run that earned them.
// A ship unlocks when a SINGLE game scores at least its `need`. So the
// only number that matters is your best-ever run: beat 5,000 once and the
// TWIN BLASTER is yours forever, however badly the next game goes.
// It's remembered in localStorage (same as the high scores), so it's kept
// on THIS computer only.
// ---------------------------------------------------------------------
const BEST_KEY = "ai-best"; // the highest score you've ever managed in one game
const SHIP_KEY = "ai-ship"; // id of the ship you're flying

// Read them back, falling back to a sensible default if nothing is saved
// yet (or if it's somehow broken) so a bad save can never wedge you.
let bestRun = 0;
try { bestRun = Math.max(0, Number(localStorage.getItem(BEST_KEY)) || 0); } catch (e) {}

// Which ships that best run has earned you. Worked out from bestRun rather
// than kept in its own list, so the two can never disagree.
function unlocked(ship) { return bestRun >= ship.need; }

let shipId = "scout";
try {
  const saved = localStorage.getItem(SHIP_KEY);
  const ship = SHIPS.find((s) => s.id === saved);
  if (ship && unlocked(ship)) shipId = ship.id;
} catch (e) {}

function saveShop() {
  try {
    localStorage.setItem(BEST_KEY, String(bestRun));
    localStorage.setItem(SHIP_KEY, shipId);
  } catch (e) { /* private browsing etc. — just don't remember it */ }
}

// The ship you're currently flying.
function currentShip() {
  return SHIPS.find((s) => s.id === shipId) || SHIPS[0];
}

// Fly a ship you've earned. Locked ones simply don't budge, and the choice
// is saved straight away so closing the tab can't lose it.
function equipShip(ship) {
  if (!unlocked(ship)) return; // not earned yet — nothing happens
  if (ship.id === shipId) return;
  shipId = ship.id;
  // If you swapped ships mid-game, put the gun away with the old one —
  // otherwise a SCOUT could pick up a beam the RED LASER left burning.
  beamTimer = 0;
  beamCooldown = 0;
  bolts = [];
  saveShop();
  playShootSound(); // a little chirp to say "you're in this one now"
}

// ---------------------------------------------------------------------
// HIGH SCORES — a "leaderboard" of the best 20 games, kept on THIS
// computer (in the browser's localStorage, the same place the sound
// setting lives). It survives closing the tab, but it's per-device:
// there's no internet server, so it doesn't sync between people.
// Each entry is { name, score, stage }.
// ---------------------------------------------------------------------
const LB_KEY = "ai-scores"; // where the board is saved
const LB_MAX = 20;          // keep only the best 20

// Read the saved board back into an array (sorted best-first). If nothing
// is saved yet, or it's somehow broken, we just start with an empty board.
function loadScores() {
  try {
    const arr = JSON.parse(localStorage.getItem(LB_KEY)) || [];
    return arr.filter((e) => e && typeof e.score === "number");
  } catch (e) { return []; }
}
function saveScores(arr) {
  try { localStorage.setItem(LB_KEY, JSON.stringify(arr)); } catch (e) {}
}

// Does this score earn a place on the board? (Any score > 0 does while
// there are still free spots; after that it must beat the lowest entry.)
function scoreQualifies(s) {
  if (s <= 0) return false;
  const board = loadScores();
  return board.length < LB_MAX || s > board[board.length - 1].score;
}

// Add a finished game to the board, re-sort best-first, and trim to 20.
function recordScore(name, s, st) {
  const board = loadScores();
  board.push({ name: (name || "YOU").slice(0, 12), score: s, stage: st });
  board.sort((a, b) => b.score - a.score);
  board.length = Math.min(board.length, LB_MAX);
  saveScores(board);
}

// --- The "you made the board!" name box (an HTML pop-up, see the CSS) ---
const nameEntryEl = document.getElementById("nameentry");
const nameInputEl = document.getElementById("name");
const saveBtnEl   = document.getElementById("savescore");
const skipBtnEl   = document.getElementById("skipscore");

function showNameEntry() {
  enteringName = true;
  nameEntryEl.style.display = "block";
  // Pre-fill the name you used last time, so regulars can just hit SAVE.
  try { nameInputEl.value = localStorage.getItem("ai-name") || ""; } catch (e) {}
  nameInputEl.focus();
  nameInputEl.select();
}
function hideNameEntry() {
  if (nameEntryEl) nameEntryEl.style.display = "none";
}
function submitName() {
  if (!enteringName) return;
  const name = (nameInputEl.value || "YOU").trim().toUpperCase() || "YOU";
  try { localStorage.setItem("ai-name", name); } catch (e) {}
  recordScore(name, score, stage);
  lastEntry = { name: name, score: score, stage: stage };
  enteringName = false;
  hideNameEntry();
}
// Close the box WITHOUT saving — for when you'd rather not be on the board.
function dismissNameEntry() {
  if (!enteringName) return;
  enteringName = false;
  hideNameEntry();
}
// SAVE button, or Enter while typing, both lock in your name.
saveBtnEl.addEventListener("click", submitName);
// "No thanks" button skips saving and closes the box.
skipBtnEl.addEventListener("click", dismissNameEntry);
nameInputEl.addEventListener("keydown", (e) => {
  // Don't let these keys leak out to the game (e.g. Space restarting).
  e.stopPropagation();
  if (e.key === "Enter") submitName();
  if (e.key === "Escape") dismissNameEntry(); // Esc = "no thanks"
});

// Called once, the moment a game ends: work out whether this run was big
// enough to earn a new ship, remember it if it was your best ever, then —
// if the score is good enough — open the name box. The board itself is
// drawn on the game-over screen.
function onGameOver() {
  beamTimer = 0;            // switch the gun off, so no beam is left hanging
  beamCooldown = 0;         // over the game-over screen
  bolts = [];               // and no lightning left forking over it either
  // Ships this run just earned: ones the run reached but your old best hadn't.
  justUnlocked = SHIPS.filter((s) => s.need > 0 && bestRun < s.need && score >= s.need);
  if (score > bestRun) {
    bestRun = score;
    saveShop();
  }
  if (scoreQualifies(score)) showNameEntry();
}

// ---------------------------------------------------------------------
// drawLeaderboard(): paint the top-20 list centred at x, starting at
// topY. Laid out in two columns of ten. If `highlight` matches an entry
// (the run you just finished), that line is drawn in gold.
// ---------------------------------------------------------------------
function drawLeaderboard(x, topY, highlight) {
  const board = loadScores();
  ctx.textAlign = "center";
  ctx.fillStyle = "#7ef9ff";
  ctx.font = "24px 'Courier New', monospace";
  ctx.fillText("HIGH SCORES", x, topY);

  if (board.length === 0) {
    ctx.fillStyle = "#888";
    ctx.font = "18px 'Courier New', monospace";
    ctx.fillText("No scores yet — be the first!", x, topY + 34);
    return;
  }

  ctx.font = "18px 'Courier New', monospace";
  const lineH = 24;
  const colW = 250;            // width of one column
  const colX = [x - colW / 2, x + colW / 2]; // left & right column centres
  let highlighted = false;     // only gold-light the FIRST match
  for (let i = 0; i < board.length; i++) {
    const e = board[i];
    const col = i < 10 ? 0 : 1;       // first ten left, next ten right
    const rowY = topY + 34 + (i % 10) * lineH;
    const isMe = !highlighted && highlight &&
                 e.name === highlight.name && e.score === highlight.score &&
                 e.stage === highlight.stage;
    if (isMe) highlighted = true;
    ctx.fillStyle = isMe ? "#ffd34d" : "#fff";
    const rank = String(i + 1).padStart(2, " ");
    const nm = e.name.padEnd(12, " ").slice(0, 12);
    const sc = String(e.score).padStart(5, " ");
    ctx.fillText(rank + ". " + nm + " " + sc, colX[col], rowY);
  }
}

// =====================================================================
// =====  SCREEN BUTTONS  — the tappable boxes on the start,  ==========
// =====  game-over and shop screens.                         ==========
// =====================================================================
// screenButtons() rebuilds the list for whatever screen you're looking
// at, and BOTH the painting and the tap test read that one list — so a
// button can never be drawn somewhere you can't actually press. A button
// with no `action` is just a label (like "FLYING THIS") and ignores taps.
const BTN_H = 54;
const BTN_STYLE = {
  normal: { edge: "#7ef9ff", fill: "rgba(126,249,255,0.15)", text: "#ffffff" },
  gold:   { edge: "#ffd34d", fill: "rgba(255,211,77,0.15)",  text: "#ffd34d" },
  quiet:  { edge: "#888888", fill: null,                     text: "#aaaaaa" },
  locked: { edge: "#555555", fill: null,                     text: "#666666" },
};

function button(x, y, w, label, action, style) {
  return { x: x, y: y, w: w, h: BTN_H, label: label, action: action, style: style };
}
// Lay out a row of equal-width buttons, centred across the screen.
function buttonRow(y, w, items) {
  const gap = 24;
  let x = (W - (items.length * w + (items.length - 1) * gap)) / 2;
  return items.map((it) => {
    const b = button(x, y, w, it.label, it.action, it.style);
    x += w + gap;
    return b;
  });
}

function screenButtons() {
  if (enteringName) return []; // the high-score name box owns the screen
  if (state === "start") {
    // Tucked into the gap between the bottom of the leaderboard and the
    // tops of the bases, so it never sits on top of the board or the game.
    return buttonRow(678, 200, [{ label: "SHOP", action: openShop, style: "quiet" }]);
  }
  if (state === "lost") {
    return buttonRow(600, 240, [
      { label: "PLAY AGAIN", action: () => newGame("playing") },
      { label: "SHOP", action: openShop },
    ]);
  }
  if (state === "shop") {
    // One button per ship: fly the ones you've earned, and a dead LOCKED
    // box on the ones you haven't.
    const rows = SHIPS.map((ship, i) => {
      const mine = unlocked(ship);
      const flying = ship.id === shipId;
      const label = flying ? "FLYING THIS" : mine ? "FLY THIS" : "LOCKED";
      const style = flying ? "gold" : mine ? "normal" : "locked";
      // Nothing to do if you're already flying it, or haven't earned it.
      const action = (flying || !mine) ? null : () => equipShip(ship);
      return button(616, shopCardY(i) + (SHOP_CARD_H - BTN_H) / 2, 198, label, action, style);
    });
    // If you stepped in from a game in progress, the only way out is back
    // into it — a "PLAY" that quietly threw your run away would be cruel.
    if (shopCameFrom === "playing") {
      return rows.concat(buttonRow(848, 260, [
        { label: "BACK TO GAME", action: closeShop },
      ]));
    }
    return rows.concat(buttonRow(848, 210, [
      { label: "BACK", action: closeShop, style: "quiet" },
      { label: "PLAY", action: () => newGame("playing") },
    ]));
  }
  return []; // no buttons while you're playing
}

// A rounded rectangle path, used for the buttons and the shop's ship cards.
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawButtons() {
  ctx.lineWidth = 2;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "20px 'Courier New', monospace";
  for (const b of screenButtons()) {
    const s = BTN_STYLE[b.style] || BTN_STYLE.normal;
    roundRectPath(b.x, b.y, b.w, b.h, 8);
    if (s.fill) { ctx.fillStyle = s.fill; ctx.fill(); }
    ctx.strokeStyle = s.edge;
    ctx.stroke();
    ctx.fillStyle = s.text;
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
}

// ---------------------------------------------------------------------
// drawShop(): the ship shop — a screen of its own, with one card per
// ship showing what it looks like, what it does, and what it costs.
// ---------------------------------------------------------------------
// Six cards have to fit between the heading and the buttons at the bottom,
// so they're shorter and closer together than they were with five.
const SHOP_CARD_TOP = 142; // where the first ship card starts
const SHOP_CARD_H   = 108; // how tall each card is
const SHOP_CARD_GAP = 8;   // the space between two cards
function shopCardY(i) { return SHOP_CARD_TOP + i * (SHOP_CARD_H + SHOP_CARD_GAP); }

function drawShop() {
  ctx.fillStyle = "rgba(0,0,0,0.82)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#7ef9ff";
  ctx.font = "42px 'Courier New', monospace";
  ctx.fillText("SHIP SHOP", W / 2, 70);
  ctx.fillStyle = "#ffd34d";
  ctx.font = "26px 'Courier New', monospace";
  ctx.fillText("BEST RUN: " + bestRun, W / 2, 106);
  ctx.fillStyle = "#888";
  ctx.font = "17px 'Courier New', monospace";
  ctx.fillText("Ships are earned by scoring big in ONE game", W / 2, 130);

  for (let i = 0; i < SHIPS.length; i++) {
    const ship = SHIPS[i];
    const y = shopCardY(i);
    const mine = unlocked(ship);
    const flying = ship.id === shipId;

    // The card itself — gold edge for the ship you're flying, a plain edge
    // for the ones you own, and a dim one for what you can't afford yet.
    roundRectPath(50, y, 780, SHOP_CARD_H, 12);
    ctx.fillStyle = flying ? "rgba(255,211,77,0.08)" : "rgba(255,255,255,0.05)";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = flying ? "#ffd34d" : mine ? "#7ef9ff" : "#444";
    ctx.stroke();

    // The row number you can press on a keyboard, then the ship itself.
    ctx.fillStyle = "#666";
    ctx.font = "19px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText(String(i + 1), 76, y + SHOP_CARD_H / 2);
    drawThing(ship.art, 140, y + SHOP_CARD_H / 2, 72,
              typeof ship.art === "string" ? -Math.PI / 4 : 0);

    // Its name, and what it does.
    ctx.textAlign = "left";
    ctx.fillStyle = mine ? "#fff" : "#bbb";
    ctx.font = "23px 'Courier New', monospace";
    ctx.fillText(ship.name, 198, y + 22);
    ctx.fillStyle = "#9aa6b2";
    ctx.font = "16px 'Courier New', monospace";
    for (let l = 0; l < ship.blurb.length; l++) {
      ctx.fillText(ship.blurb[l], 198, y + 44 + l * 18);
    }
    // How you get it — and, if you haven't yet, how close you've come.
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillStyle = flying ? "#ffd34d" : mine ? "#5fd66f" : "#777";
    ctx.fillText(flying ? "★ FLYING THIS ONE"
                 : mine ? (ship.need === 0 ? "✓ ALWAYS YOURS" : "✓ EARNED")
                 : "LOCKED — score " + ship.need + " in one game",
                 198, y + SHOP_CARD_H - 26);
    if (!mine) {
      // A bar creeping toward the score you need, so you can see how far off
      // your best run is rather than just being told "no". It gets the bottom
      // line of the card to itself, clear of the writing above.
      const barW = 250;
      const gone = Math.min(1, bestRun / ship.need);
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.fillRect(198, y + SHOP_CARD_H - 13, barW, 4);
      ctx.fillStyle = "#7ef9ff";
      ctx.fillRect(198, y + SHOP_CARD_H - 13, barW * gone, 4);
      ctx.fillStyle = "#666";
      ctx.font = "13px 'Courier New', monospace";
      ctx.fillText("best so far: " + bestRun, 198 + barW + 10, y + SHOP_CARD_H - 10);
    }
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#888";
  ctx.font = "17px 'Courier New', monospace";
  ctx.fillText("Tap a ship you've earned to fly it (or press 1–" + SHIPS.length + ")" +
               "   •   Esc goes back", W / 2, 922);
}

// ---------------------------------------------------------------------
// LIGHTNING — the ELECTRIC ARC's beam and its jumps are drawn as torn,
// kinked lines instead of straight ones. The kinks are thrown about fresh
// every frame, which is what makes the current look alive.
// ---------------------------------------------------------------------
// jaggedPath(): a list of points from one place to another, kinked at every
// step. The two ends stay put and the middle is thrown about the most, which
// is how a real bolt looks — pinned at both ends, wild in between.
function jaggedPath(x1, y1, x2, y2, step, wobble) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const steps = Math.max(2, Math.round(len / step));
  const nx = -dy / len, ny = dx / len;   // sideways, at a right angle to the line
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const taper = Math.sin(t * Math.PI);  // 0 at the ends, 1 in the middle
    const off = (Math.random() * 2 - 1) * wobble * taper;
    // A kink along the line as well as across it, or every bend lands at the
    // same height and it looks like a zip fastener.
    const slip = (Math.random() - 0.5) * step * 0.5 * taper;
    pts.push([x1 + dx * t + nx * off - ny * slip,
              y1 + dy * t + ny * off + nx * slip]);
  }
  return pts;
}

function strokeBolt(pts, color, width, alpha) {
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}

// The beam itself: three passes over the same torn line — a wide dim glow, the
// beam, then a white-hot core down the middle — and then a handful of branches
// that fork off the main channel and peter out, the way real lightning does.
// All of it is re-drawn from scratch every frame, so the bolt never sits still.
function drawBoltColumn(x, bottomY, gun, flicker) {
  const pts = jaggedPath(x, bottomY, x, 0, 18, 13);
  strokeBolt(pts, gun.color, gun.width * 1.9, 0.24 * flicker);
  strokeBolt(pts, gun.color, gun.width * 0.7, 0.78 * flicker);
  strokeBolt(pts, "#eaffff", 3, flicker);

  // The forks. Each one starts at a bend in the main bolt, strikes off to one
  // side and upward, and is drawn thinner and fainter the further it goes.
  const forks = 4 + Math.floor(Math.random() * 4);
  for (let i = 0; i < forks; i++) {
    const from = pts[1 + Math.floor(Math.random() * (pts.length - 2))];
    const reach = 24 + Math.random() * 66;
    const side = Math.random() < 0.5 ? -1 : 1;
    const fork = jaggedPath(from[0], from[1],
                            from[0] + side * reach,
                            from[1] - reach * (0.2 + Math.random() * 1.1),
                            11, 9);
    const glow = 0.5 + Math.random() * 0.5;
    strokeBolt(fork, gun.color, 7, 0.42 * flicker * glow);
    strokeBolt(fork, "#eaffff", 1.8, 0.7 * flicker * glow);
  }
}

// One link of the chain, from one animal to the next one out. `bright` is that
// link's own flicker, so the chain crackles link by link instead of all pulsing
// together, and `hop` is how far out it is — each hop is drawn thinner and
// fainter than the one before, so you can SEE the current running out of puff
// as it works its way into the herd.
function drawBoltLine(x1, y1, x2, y2, gun, flicker, bright, hop) {
  // A link that's drawn at all is always worth seeing, so `bright` is lifted
  // off the floor here: it still crackles, but it never fades to a thread.
  const glow = flicker * (0.45 + (bright === undefined ? 1 : bright) * 0.55);
  const fade = 1 / (1 + Math.max(0, (hop || 1) - 1) * 0.6);
  const pts = jaggedPath(x1, y1, x2, y2, 9, 13);
  strokeBolt(pts, gun.color, 17 * fade, 0.16 * glow);   // the halo around it
  strokeBolt(pts, gun.color, 8 * fade, 0.50 * glow);    // the bolt
  strokeBolt(pts, "#eaffff", 3.2 * fade, 0.95 * glow);  // the white-hot core
  // A hot spot where it lands, so you can see which animal it has hold of.
  ctx.globalAlpha = 0.6 * glow;
  ctx.fillStyle = "#eaffff";
  ctx.beginPath();
  ctx.arc(x2, y2, 8 * fade, 0, Math.PI * 2);
  ctx.fill();
}

// drawReloadBar(): a little bar under the ship that fills back up as a
// slow gun reloads, so you know exactly when you can fire again.
function drawReloadBar(done, color) {
  const full = CELL;
  const y = player.y + CELL / 2 + 6;
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(player.x - full / 2, y, full, 4);
  ctx.fillStyle = color;
  ctx.fillRect(player.x - full / 2, y, full * done, 4);
}

// ---------------------------------------------------------------------
// drawIcons(): the two little toggles tucked under the score at the
// top-left — sound and pause. Drawn as their own step because the PAUSED
// screen dims everything and then paints them back on top, so the ▶ you
// need in order to un-pause stays bright and tappable.
// ---------------------------------------------------------------------
function drawIcons() {
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.font = "26px serif";
  // Sound: tap it (or press M) to mute/un-mute. Dimmed when sound is off.
  ctx.globalAlpha = soundOn ? 1 : 0.45;
  ctx.fillText(soundOn ? "🔊" : "🔇", SOUND_ICON.x, SOUND_ICON.y + SOUND_ICON.h / 2);
  // Pause: shows ⏸ while the game is running and ▶ while it's paused —
  // i.e. what the button will DO next. Then ⏮, which starts the whole run
  // again from stage 1. Both only appear mid-game, since there's nothing to
  // pause or restart on the start and game-over screens.
  ctx.globalAlpha = 1;
  if (state === "playing") {
    ctx.fillText(paused ? "▶️" : "⏸️", PAUSE_ICON.x, PAUSE_ICON.y + PAUSE_ICON.h / 2);
    ctx.fillText("⏮️", RESTART_ICON.x, RESTART_ICON.y + RESTART_ICON.h / 2);
    ctx.fillText("🛒", SHOP_ICON.x, SHOP_ICON.y + SHOP_ICON.h / 2);
  }
}

// ---------------------------------------------------------------------
// draw(): the "showing" half of the game loop. Paints everything.
// ---------------------------------------------------------------------
function draw() {
  // Wipe the screen clear each frame. We clear to TRANSPARENT (not black)
  // so the moving starfield behind the game shows through.
  ctx.clearRect(0, 0, W, H);

  // The shop is a screen all of its own — no game board behind it. (The
  // 🔊 still comes along, so you can mute while you're browsing.)
  if (state === "shop") {
    drawShop();
    drawIcons();
    ctx.globalAlpha = 1;
    drawButtons();
    return;
  }

  // The HUD: score (left), stage (centre), lives (right) at the top.
  ctx.fillStyle = "#fff";
  ctx.font = "20px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("SCORE: " + score, 12, 28);
  ctx.textAlign = "center";
  ctx.fillText("STAGE " + stage, W / 2, 28);
  ctx.textAlign = "right";
  ctx.fillText("LIVES: " + "❤️".repeat(lives), W - 12, 28);

  // The BIG CHICK's health, so you can see you're getting somewhere. It's a
  // long fight, and without this it would feel like nothing was happening.
  const bossNow = state !== "start" ? theBoss() : null;
  if (bossNow) {
    const barW = 380, barX = (W - barW) / 2, barY = 40, barH = 14;
    const left = Math.max(0, bossNow.hp / BOSS_HP);
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    roundRectPath(barX, barY, barW, barH, 7);
    ctx.fill();
    // Yellow while it's fresh, red once it's nearly done for.
    ctx.fillStyle = left > 0.3 ? "#ffd23d" : "#ff4d4d";
    roundRectPath(barX, barY, Math.max(2, barW * left), barH, 7);
    ctx.fill();
    ctx.fillStyle = "#ffd23d";
    ctx.font = "13px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText("THE BIG CHICK", W / 2, barY + barH + 15);
  }

  // The sound and pause toggles, under the score at the top-left.
  drawIcons();
  ctx.globalAlpha = 1;

  // Draw the animals — but NOT on the start screen, where the herd would
  // show through behind the title and high scores and look cluttered. The
  // start screen has its own tidy row of animals instead.
  if (state !== "start") {
    for (const inv of invaders) {
      if (!inv.alive) continue;
      const size = sizeOf(inv);
      // An animal that's been winged but not downed fades, so you can see it's
      // hurt — the fainter it is, the less of it is left. That matters twice
      // over past the boss, where a full-strength bullet only takes an animal
      // half way down. The boss doesn't fade: it has a health bar of its own
      // up at the top, and it would spend the whole fight half see-through.
      ctx.globalAlpha = inv.boss ? 1 : Math.max(0.4, inv.hp / (inv.maxHp || 1));
      drawThing(inv.animal, inv.x, inv.y, size);
      ctx.globalAlpha = 1;
      // An animal held in a beam glows brighter and brighter until it goes —
      // red under the LASER, electric blue under the ARC — so you can see the
      // beam working, and see it cool off again if you swing away too soon.
      if (inv.heat > 0) {
        const heatGun = currentShip().beam || LASER_BEAM;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.75 * Math.min(1, inv.heat / heatGun.burn);
        ctx.fillStyle = heatGun.jagged ? "#5fd8ff" : "#ff3b3b";
        ctx.fillRect(inv.x - size / 2, inv.y - size / 2, size, size);
        ctx.restore();
      }
    }
  }

  // Draw the bases (only the blocks that are still alive).
  ctx.fillStyle = BASE_COLOR;
  for (const base of bases) {
    for (const blk of base.blocks) {
      if (blk.alive) {
        ctx.fillRect(blk.x - BASE_BLOCK / 2, blk.y - BASE_BLOCK / 2, BASE_BLOCK, BASE_BLOCK);
      }
    }
  }

  // Draw your bullets as glowing vertical streaks (like little lasers).
  ctx.strokeStyle = BULLET_COLOR;
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.shadowColor = BULLET_COLOR;
  ctx.shadowBlur = 8;
  for (const b of bullets) {
    if (b.bomb) continue;                 // shells are drawn as balls, below
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x, b.y + BULLET_LENGTH); // streak trails BELOW as it flies up
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // BLAST CANNON shells are fat glowing balls, so you can tell at a glance
  // that something is about to go bang.
  for (const b of bullets) {
    if (!b.bomb) continue;
    ctx.save();
    ctx.shadowColor = "#ff8c1a";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#ffd23d";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ff8c1a";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw the falling shots — each one is its animal's own thing.
  for (const m of shots) drawThing(m.emoji, m.x, m.y, m.size || 28);

  // The beam: a soft glow with a white-hot core, running from the ship's nose
  // to the top of the screen. It's drawn in "lighter" mode so it ADDS light to
  // whatever it crosses rather than painting over it, and it shimmers a little
  // so it reads as live energy. The RED LASER's is a straight column; the
  // ELECTRIC ARC's is a torn, jagged one with the jumps forking off it.
  const noseY = player.y - CELL / 2;
  const gun = currentShip().beam;
  if (beamTimer > 0 && gun) {
    // The LASER pulses evenly; the ARC gutters at random, like a live wire.
    const flicker = gun.jagged ? 0.7 + Math.random() * 0.3
                               : 0.85 + 0.15 * Math.sin(beamTimer * 0.9);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.shadowColor = gun.color;
    ctx.shadowBlur = 24;
    if (gun.jagged) {
      drawBoltColumn(player.x, noseY, gun, flicker);
    } else {
      ctx.globalAlpha = 0.5 * flicker;
      ctx.fillStyle = "#ff2d2d";
      ctx.fillRect(player.x - gun.width, 0, gun.width * 2, noseY);      // outer glow
      ctx.globalAlpha = 0.85 * flicker;
      ctx.fillStyle = gun.color;
      ctx.fillRect(player.x - gun.width / 2, 0, gun.width, noseY);      // the beam itself
      ctx.globalAlpha = flicker;
      ctx.fillStyle = "#ffe9e9";
      ctx.fillRect(player.x - 3, 0, 6, noseY);                          // white-hot core
    }
    ctx.restore();
  } else if (beamCooldown > 0) {
    drawReloadBar(1 - beamCooldown / (gun ? gun.reload : BEAM_RELOAD),
                  gun ? gun.color : "#ff6b6b");
  } else if (currentShip().fire === "bomb" && gunTimer > 0) {
    // The BLAST CANNON gets the same little bar — half a second is long
    // enough that you want to see the next shell coming.
    drawReloadBar(1 - gunTimer / BOMB_RELOAD, "#ffd23d");
  }

  // Draw the player — whichever ship you've bought and are flying. While
  // safe after a hit, blink it on and off so you can see you're protected.
  const blinking = invuln > 0 && Math.floor(invuln / 6) % 2 === 0;
  // The pixel rockets already point straight up. Only an EMOJI ship needs a
  // -45° spin (🚀 leans up-right), so we rotate just when it's a string.
  const shipArt = currentShip().art;
  const playerRot = (typeof shipArt === "string") ? -Math.PI / 4 : 0;
  if (!blinking) drawThing(shipArt, player.x, player.y, CELL, playerRot);

  // Draw the ELECTRIC ARC's jumps ON TOP of the animals, so you can see
  // which ones the current has hold of. (The beam column itself is drawn
  // further up, behind them, the same as the RED LASER's.) Nearest hops go
  // down first, so the chain reads outward from the beam.
  if (beamTimer > 0 && currentShip().beam && currentShip().beam.jagged) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const gun2 = currentShip().beam;
    const flicker2 = 0.75 + Math.random() * 0.25;
    for (const b of [...bolts].sort((p, q) => p.hop - q.hop)) {
      drawBoltLine(b.x1, b.y1, b.x2, b.y2, gun2, flicker2, b.bright, b.hop);
    }
    ctx.restore();
  }

  // Draw the blast rings — the BLAST CANNON's shells and the BIG CHICK's
  // eggs both leave one. Each sprints out to the edge of its own blast and
  // fades as it goes, so the ring you see is exactly the ground it cleared.
  for (const r of shockwaves) {
    const t = r.life / BOMB_RING;      // 0 → 1 as the ring grows
    const reach = r.radius || BOMB_RADIUS;
    const radius = reach * (1 - (1 - t) * (1 - t)); // quick, then eases out
    // A white-hot flash fills the blast for the first moment...
    if (t < 0.5) {
      ctx.globalAlpha = (1 - t * 2) * 0.55;
      ctx.fillStyle = "#fff3b0";
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
    // ...and the ring races on ahead of it to the edge of the blast.
    ctx.globalAlpha = 1 - t * t;
    ctx.strokeStyle = r.color || "#ffb02e";
    ctx.lineWidth = 14 * (1 - t) + 2;  // thick at the bang, thin at the edge
    ctx.beginPath();
    ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Draw the explosion bits, fading and shrinking as they age.
  for (const p of particles) {
    const fade = 1 - p.life / p.maxLife; // 1 → 0 over the particle's life
    ctx.globalAlpha = fade;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1 + 3 * fade, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // "STAGE N" banner at the start of each wave (fades out, game keeps going).
  // A boss stage gets told about properly — you deserve the warning.
  if (state === "playing" && stageBanner > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, stageBanner / 30); // fade out near the end
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "44px 'Courier New', monospace";
    ctx.fillText("STAGE " + stage, W / 2, H / 2);
    if (isBossStage()) {
      ctx.fillStyle = "#ffd23d";
      ctx.font = "52px 'Courier New', monospace";
      ctx.fillText("THE BIG CHICK!", W / 2, H / 2 + 60);
    }
    ctx.restore();
  }

  // Paused — dim the board (everything is frozen exactly where you left it)
  // and say so, then paint the toggles back on top so the ▶ stays tappable.
  if (state === "playing" && paused) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "52px 'Courier New', monospace";
    ctx.fillText("PAUSED", W / 2, H / 2);
    ctx.fillStyle = "#7ef9ff";
    ctx.font = "22px 'Courier New', monospace";
    ctx.fillText("Tap ▶ or press P to keep playing", W / 2, H / 2 + 48);
    drawIcons();
  }

  // Start screen — shown until the player taps/clicks/presses to begin.
  if (state === "start") {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "52px 'Courier New', monospace";
    ctx.fillText("ANIMAL INVADERS", W / 2, 150);
    // A row of the actual pixel animals (one of each kind), centred.
    const previewGap = 64;
    const previewStart = W / 2 - (ANIMALS.length - 1) * previewGap / 2;
    for (let i = 0; i < ANIMALS.length; i++) {
      drawThing(ANIMALS[i].animal, previewStart + i * previewGap, 225, 48);
    }
    ctx.fillStyle = "#7ef9ff";
    ctx.font = "30px 'Courier New', monospace";
    ctx.fillText("▶  TAP or CLICK to START", W / 2, 290);
    ctx.fillStyle = "#888";
    ctx.font = "18px 'Courier New', monospace";
    ctx.fillText("Move with ← →   •   Shoot with Space", W / 2, 330);
    ctx.fillText("Flying: " + currentShip().name + "   •   best run: " + bestRun, W / 2, 360);
    // Which copy of the game this is — see BUILD, up at the top. Small and
    // grey, because it is only there for the day a phone will not update.
    // The build, and the frames a second this device is really managing. Both
    // are here, on the screen you land on, so that working out "is my phone
    // running the new game, and is it keeping up?" needs nothing tapped and
    // nothing typed into the address bar.
    ctx.fillStyle = "#555";
    ctx.font = "13px 'Courier New', monospace";
    ctx.fillText("build " + BUILD + (fpsRate ? "   ·   " + fpsRate + " fps" : ""),
                 W / 2, 386);
    // The best games so far, right on the start screen.
    drawLeaderboard(W / 2, 410);
  }

  // Game-over screen.
  if (state === "lost") {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "48px 'Courier New', monospace";
    ctx.fillText("GAME OVER", W / 2, 150);
    ctx.font = "22px 'Courier New', monospace";
    ctx.fillText("Reached stage " + stage, W / 2, 190);
    ctx.fillText("Score: " + score, W / 2, 222);
    // Did this run earn you a ship? That's the big news if so; otherwise
    // just show the best run you've ever had to measure yourself against.
    if (justUnlocked.length > 0) {
      ctx.fillStyle = "#ffd34d";
      ctx.font = "22px 'Courier New', monospace";
      ctx.fillText("★ NEW SHIP UNLOCKED: " + justUnlocked.map((s) => s.name).join(" + ") + " ★",
                   W / 2, 256);
    } else {
      ctx.fillStyle = "#888";
      ctx.font = "20px 'Courier New', monospace";
      ctx.fillText("Best run: " + bestRun, W / 2, 254);
    }
    // While the name box is up, that HTML pop-up covers the middle — don't
    // draw the board or the buttons behind it. Once you've saved (or if you
    // didn't make the board), show the leaderboard and where to go next.
    if (!enteringName) {
      drawLeaderboard(W / 2, 290, lastEntry);
      ctx.fillStyle = "#888";
      ctx.textAlign = "center";
      ctx.font = "17px 'Courier New', monospace";
      ctx.fillText("Enter plays again   •   S opens the shop", W / 2, 684);
    }
  }

  // The tappable boxes for whichever screen we just painted. Always last,
  // so nothing can end up drawn over the top of a button.
  drawButtons();
}


// ---------------------------------------------------------------------
// THE GAME LOOP — and why the game keeps its OWN clock.
//
// requestAnimationFrame asks the browser to call loop() again before the next
// screen refresh. How often that is depends entirely on the device: a computer
// usually draws 60 times a second, a new iPad up to 120, and a phone in Low
// Power Mode (or one that has got warm) only 30.
//
// Everything in this game moves by so much A FRAME — your ship goes
// PLAYER_SPEED pixels, a beam burns for BEAM_TIME frames, and so on. So if we
// simply moved everything once per screen refresh, the device's refresh rate
// WOULD BE the game's clock: a phone drawing 30 frames a second would play the
// whole game in slow motion, and a 120Hz iPad would play it at double speed.
//
// Instead the game keeps its own clock. One update() is still worth exactly one
// sixtieth of a second — every number in the game is tuned that way, and none
// of them had to change. What changed is how often update() is called: we look
// at how much real time has gone by since the last frame and run as many
// sixtieths as we owe. A phone drawing 30 frames a second runs two each frame
// and plays at exactly the same speed as a computer.
// ---------------------------------------------------------------------
// One step of game time, and how many of them one frame may make up. Both are
// divided by GAME_SPEED, so turning the game's speed up shortens the step
// rather than changing any of the numbers the game is tuned with — and the
// catch-up allowance grows with it, so the frame rate the game can hold full
// speed down to (about 12 a second) stays the same however fast you set it.
const TICK_MS     = 1000 / 60 / GAME_SPEED;
const MAX_CATCHUP = 5 * GAME_SPEED;
let frameClock = 0;   // the clock reading at the last frame
let tickDebt   = 0;   // game time we owe, in milliseconds
let starDebt   = 0;   // and the same for the stars, which never stop
let lastTicks  = 0;   // how many we ran last frame (for the ?fps readout)

function loop(now) {
  const gap = frameClock ? now - frameClock : 0;
  frameClock = now;

  // Nothing in the GAME moves on the start, shop, paused or game-over screens,
  // so never put time by for them. Otherwise a game paused for a minute would
  // owe a minute of moving and lurch forward the moment you came back.
  tickDebt = (state !== "playing" || paused) ? 0 : tickDebt + gap;

  // One long hitch — a tab left open, a phone that went to sleep — must not
  // try to make up thousands of sixtieths at once, which would freeze the game
  // solid. So we run at most MAX_CATCHUP of them and throw the rest away: past
  // that much we let the game run slow rather than build up a backlog we could
  // never work off.
  let ticks = 0;
  while (tickDebt >= TICK_MS && ticks < MAX_CATCHUP) {
    update();
    // The frame the game ends: deal with it once (save a high score, etc.).
    if (state === "lost" && !gameOverHandled) {
      gameOverHandled = true;
      onGameOver();
    }
    tickDebt -= TICK_MS;
    ticks++;
  }
  if (ticks === MAX_CATCHUP) tickDebt = 0;
  lastTicks = ticks;

  // The stars keep their own time, and they drift on EVERY screen — you watch
  // them go by on the start screen and while you're paused. Same clock, same
  // reason: on a 120Hz iPad, one drift per frame would fly past twice as fast.
  starDebt += gap;
  let starTicks = 0;
  while (starDebt >= TICK_MS && starTicks < MAX_CATCHUP) {
    moveStars();
    starDebt -= TICK_MS;
    starTicks++;
  }
  if (starTicks === MAX_CATCHUP) starDebt = 0;

  // Drawing happens once a frame however many sixtieths we just ran. There is
  // no point painting a picture nobody will see.
  draw();
  drawStars();
  countFrame(now);
  requestAnimationFrame(loop);
}

// ---------------------------------------------------------------------
// countFrame(): the frame-rate readout. TAP THE SCORE while you are playing —
// or add ?fps to the end of the address — and a small line appears under the
// buttons, top left, telling you how many frames a second this device is really
// managing, how many sixtieths of game time each frame is worth, and how long a
// frame takes. Tap the score again to put it away.
//
// It's for checking the game on a phone or a tablet: if it says 30 fps and
// 2.0 ticks, the device is drawing half as often as a computer and the game is
// making that up — which is exactly what it's supposed to do. Nothing shows
// unless you ask for it, so opening the game the normal way is unchanged.
// ---------------------------------------------------------------------
let SHOW_FPS = (function () {
  try { return /(\?|&)fps\b/.test(location.search); } catch (e) { return false; }
})();
let fpsFrames = 0, fpsTicks = 0, fpsSince = 0, fpsShown = "", fpsRate = 0;

// Turn the readout on or off, and start its counting again from nothing so the
// first reading is a true one rather than an average of the wait.
function toggleFpsReadout() {
  SHOW_FPS = !SHOW_FPS;
  fpsFrames = 0;
  fpsTicks = 0;
  fpsSince = 0;
  fpsShown = "";
}

function countFrame(now) {
  // Counted on every frame whether or not the line is showing, because the
  // start screen prints the frame rate beside the build with nothing tapped.
  fpsFrames++;
  fpsTicks += lastTicks;
  if (!fpsSince) fpsSince = now;
  const over = now - fpsSince;
  if (over >= 500) {          // work it out twice a second
    fpsRate = Math.round(fpsFrames * 1000 / over);
    // Kept short so it fits in the gap to the left of the herd.
    fpsShown = fpsRate + "fps · " +
               (fpsTicks / fpsFrames).toFixed(2) + " ticks · " +
               (over / fpsFrames).toFixed(1) + "ms";
    fpsFrames = 0; fpsTicks = 0; fpsSince = now;
  }
  if (!SHOW_FPS) return;
  // Top left, under the sound and pause buttons: clear of the score, clear of
  // the boss's health bar, and — unlike the bottom of the screen — clear of the
  // line of key hints the page prints under the game.
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#7ef9ff";
  ctx.font = "16px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(fpsShown, 12, 96);
}


// =====================================================================
// =====  THE STARFIELD  — the space we fly through.  ==================
// =====================================================================
// This runs on its OWN canvas behind the game. Stars drift slowly
// downward (so it feels like we're flying upward through space), come in
// different sizes and colours, and some gently twinkle on and off.

const STAR_COUNT  = 220;   // how many stars are on screen
const STAR_COLORS = [      // mostly white, with a few coloured ones mixed in
  "#ffffff", "#ffffff", "#ffffff",
  "#bcd2ff", // pale blue
  "#fff4c2", // warm yellow
  "#ffd0e0", // pink
  "#c2fff0", // cyan
  "#ffc9a3", // orange
];

const starCanvas = document.getElementById("stars");
const starCtx = starCanvas.getContext("2d");
let stars = [];

// Match the star canvas to the window size (and redo it if the window
// is resized, so the stars always fill the whole screen).
function resizeStars() {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeStars);
resizeStars();

// One soft glow per colour, painted once when the page opens.
//
// A star is a bright dot with a halo around it, and the plain way to get the
// halo is to ask the browser to blur the dot as it paints. But a blur is slow
// work, and there are 220 stars — so that was 220 blurs in every frame, all of
// them blurring the very same little dot over and over. Instead we blur each
// colour ONE time into a small picture, and then stamp those pictures. It looks
// the same and costs a fraction as much, which is what a phone needs.
const GLOW_ART   = 32;  // how big each pre-painted glow picture is, in pixels
const GLOW_DOT   = 3;   // the star inside it
const GLOW_SPREAD = 9;  // how far its halo reaches
const starGlows = {};
for (const colour of STAR_COLORS) {
  if (starGlows[colour]) continue;   // the list repeats white; bake it once
  const cv = document.createElement("canvas");
  cv.width = GLOW_ART;
  cv.height = GLOW_ART;
  const c = cv.getContext("2d");
  c.fillStyle = colour;
  c.shadowColor = colour;
  c.shadowBlur = GLOW_SPREAD;
  // One fill paints the star AND its halo, which is exactly what the game used
  // to ask for every frame — the same picture, made once instead of 13,200
  // times a second. Filling twice would double the halo and wash the sky out.
  c.beginPath();
  c.arc(GLOW_ART / 2, GLOW_ART / 2, GLOW_DOT, 0, Math.PI * 2);
  c.fill();
  starGlows[colour] = cv;
}

// Make one star. Bigger stars drift a little faster, which makes the
// field feel deep — like nearer stars zipping past farther ones.
function makeStar(anywhere) {
  const size = 0.7 + Math.random() * 2.3; // 0.7 — 3.0 pixels across
  return {
    x: Math.random() * starCanvas.width,
    y: anywhere ? Math.random() * starCanvas.height : -2,
    size: size,
    color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
    speed: 0.12 + size * 0.18,            // slow drift, faster when bigger
    twinkle: Math.random() < 0.4,         // about 4 in 10 stars blink
    phase: Math.random() * Math.PI * 2,   // where in its blink it starts
    twinkleSpeed: 0.02 + Math.random() * 0.05,
  };
}
for (let i = 0; i < STAR_COUNT; i++) stars.push(makeStar(true));

// moveStars(): drift them down the screen. This is called from the game loop's
// own clock, once per sixtieth of a second, so the stars fly past at the same
// speed on a phone as on a computer — the same reason the game itself does.
function moveStars() {
  for (const s of stars) {
    // Drift downward; when a star falls off the bottom, send it back to
    // the top at a new spot so the field never runs out.
    s.y += s.speed;
    if (s.y > starCanvas.height + 2) {
      s.y = -2;
      s.x = Math.random() * starCanvas.width;
    }
    // Twinkling stars fade in and out; the rest stay steady.
    if (s.twinkle) s.phase += s.twinkleSpeed;
  }
}

// drawStars(): paint them. One stamp of a pre-blurred glow per star.
function drawStars() {
  starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  for (const s of stars) {
    starCtx.globalAlpha = s.twinkle
      ? 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.phase))
      : 1;
    const glow = starGlows[s.color];
    const wide = s.size * (GLOW_ART / GLOW_DOT); // scaled to this star's size
    starCtx.drawImage(glow, s.x - wide / 2, s.y - wide / 2, wide, wide);
  }
  starCtx.globalAlpha = 1;
}


// =====================================================================
// =====  START EVERYTHING.  ===========================================
// =====================================================================
// Last of all, because the loop draws the stars as well as the game, and the
// starfield above has to exist before it is asked to paint anything.
setup();
draw();          // paint the start screen straight away, not a frame late
drawStars();
requestAnimationFrame(loop);
</script>
</body>
</html>
