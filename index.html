<!DOCTYPE html>
<!--
  ===================================================================
   ANIMAL INVADERS  🐄🍼
  ===================================================================
  Hi! This is YOUR game. You invented it, and you can change it.

  Everything you'll want to change first lives in the
  "CHANGE THESE TO CUSTOMISE YOUR GAME!" block just below, inside
  the <script> down the page. Look for the big green-comment box.

  To play: just double-click this file to open it in your web browser.
  No installing anything. No internet needed.

  Controls:
    - Move:  Left / Right arrow keys  (or A and D)
    - Shoot: Spacebar
    - Restart after winning/losing: press Enter
  ===================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Animal Invaders</title>
<style>
  /* Simple retro look. Black space background, white pixel-y text. */
  html, body {
    margin: 0;
    height: 100%;
    color: #fff;
    font-family: "Courier New", monospace;
    /* Stops the arrow keys from scrolling the page while you play. */
    overflow: hidden;
  }
  /* Black goes on <html> ONLY. If we put it on <body> too, the body's
     background would paint OVER the star canvas (which sits at z-index -1)
     and hide it. The root background paints furthest back, behind the stars. */
  html { background: #000; }
  /* Centre the game on the screen. */
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  #game {
    /* Fit the game inside the screen on ANY device, keeping its shape.
       91.67vh = 100vh × (880 ÷ 960) — the canvas's width-to-height ratio.
       So on wide screens it fills the height, and on narrow phones it
       shrinks to fit the width instead — never squashed, never cut off.
       Transparent background so the moving stars show through behind it. */
    display: block;
    width: min(100vw, 91.67vh);
    height: auto;
    background: transparent;
    /* The 880px canvas is scaled to fit your screen. By default the browser
       BLURS that scaling; "pixelated" keeps the pixel-art sprites crisp. */
    image-rendering: pixelated;
    image-rendering: crisp-edges; /* fallback name some browsers use */
  }
  /* The starfield sits behind EVERYTHING, filling the whole window. */
  #stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    display: block;
  }
  /* Controls line, pinned to the bottom so it doesn't shrink the game. */
  p {
    color: #888;
    font-size: 14px;
    position: fixed;
    bottom: 6px;
    left: 0;
    right: 0;
    text-align: center;
    margin: 0;
    pointer-events: none;
  }
  /* On-screen buttons for phones/tablets. Hidden on mouse computers;
     shown only on touch screens (where the pointer is "coarse"). */
  #touch { display: none; }
  #touch button {
    position: fixed;
    bottom: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 24px;
    font-family: inherit;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; /* stops scrolling/zooming when you press a button */
  }
  #touch button:active { background: rgba(255, 255, 255, 0.3); }
  /* FIRE on the LEFT, the ◀ ▶ arrows on the RIGHT. */
  #btn-fire  { left: 20px; font-size: 28px; }
  #btn-right { right: 20px; }
  #btn-left  { right: 88px; }
  @media (pointer: coarse) {
    #touch { display: block; }
    p { display: none; } /* keyboard hints don't help on a touch screen */
  }
  /* Name-entry box — pops up over the game ONLY when you earn a spot on the
     high-score board. An HTML <input> is used (instead of drawing on the
     canvas) so it works everywhere: a real keyboard on computers, and the
     pop-up keyboard on phones/tablets. Hidden until you qualify. */
  #nameentry {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #7ef9ff;
    border-radius: 10px;
    padding: 22px 26px;
    text-align: center;
    z-index: 10;
  }
  #nameentry .title { color: #ffd34d; font-size: 22px; margin-bottom: 14px; }
  #nameentry input {
    font-family: inherit;
    font-size: 22px;
    text-align: center;
    text-transform: uppercase;
    width: 220px;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #888;
    background: #111;
    color: #fff;
    outline: none;
  }
  #nameentry button {
    display: block;
    margin: 14px auto 0;
    font-family: inherit;
    font-size: 18px;
    padding: 8px 26px;
    border-radius: 6px;
    border: 1px solid #7ef9ff;
    background: rgba(126, 249, 255, 0.15);
    color: #fff;
    cursor: pointer;
  }
  #nameentry button:active { background: rgba(126, 249, 255, 0.35); }
  /* The "No thanks" dismiss — quieter than SAVE, so it reads as the
     secondary choice. Closes the box without recording a score. */
  #nameentry .skip {
    margin-top: 8px;
    font-size: 14px;
    padding: 6px 18px;
    border-color: #888;
    background: transparent;
    color: #aaa;
  }
  #nameentry .skip:active { background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>
<!-- The space we're flying through. Lives behind the game. -->
<canvas id="stars"></canvas>
<div id="wrap">
  <canvas id="game" width="880" height="960"></canvas>
  <p>Move: ← →  (or A / D) &nbsp;•&nbsp; Shoot: Space &nbsp;•&nbsp; Pause: P &nbsp;•&nbsp; Restart stage: R &nbsp;•&nbsp; Play again: Enter &nbsp;•&nbsp; Shop: S &nbsp;•&nbsp; Sound: M</p>
</div>

<!-- Pops up only when you make the high-score top 20. See the CSS above. -->
<div id="nameentry">
  <div class="title">⭐ NEW HIGH SCORE! ⭐</div>
  <input id="name" maxlength="12" placeholder="YOUR NAME" autocomplete="off" spellcheck="false">
  <button id="savescore">SAVE</button>
  <button id="skipscore" class="skip">No thanks</button>
</div>

<!-- Touch controls — only visible on phones/tablets (see the CSS above). -->
<div id="touch">
  <button id="btn-left" aria-label="Move left">◀</button>
  <button id="btn-right" aria-label="Move right">▶</button>
  <button id="btn-fire" aria-label="Shoot">🔥</button>
</div>

<script>
// =====================================================================
// =====  PIXEL ART  — the little hand-drawn sprites.  =================
// =====================================================================
// Every animal, the rocket, and each falling shot is drawn as "pixel
// art": a small grid where each letter is one fat pixel of colour, and a
// dot (".") is see-through. SPRITE_PAL says what colour each letter is.
// Want to recolour the cow? Change a letter in COW_ART, or tweak a colour
// in SPRITE_PAL. (You can also still use a plain emoji instead of a sprite
// anywhere below — both work.)
const SPRITE_PAL = {
  '.': null,
  'W': '#f2f2f2', 'G': '#9aa6b2', 'K': '#1c1c20', 'R': '#e23b3b',
  'C': '#74e8ff', 'D': '#176a73', 'P': '#ffa6b8', 'N': '#c23a5e',
  'H': '#e8d49a', 'O': '#ff8c1a', 'Y': '#ffd23d', 'B': '#8a5a2c',
  'T': '#c98f5f', 'o': '#ff7fa3', 'm': '#6e4a25', 's': '#d9dde2',
  'r': '#8c1f1f', 'L': '#ffd7d7', // deep red & hot laser-white, for the ships
  'g': '#6fe08a', 'v': '#a86cf0', // green & violet, for two of the ships
};
// spr(): wraps a grid of strings so the game knows "this is a sprite".
function spr(rows) { return { isPixel: true, rows: rows }; }

const ROCKET_ART = spr([
  "......R......", ".....RRR.....", "....RRRRR....", "...RRRRRRR...",
  "...WsssssW...", "..WsssssssW..", "..WsDDDDDsW..", "..WsDCCCDsW..",
  "..WsDCCCDsW..", "..WsDDDDDsW..", "..WsssssssW..", "..WsssssssW..",
  ".RRsssssssRR.", "RRRsssssssRRR", "R..WsssssW..R", "...GGGGGGG...",
  "....OOOOO....", ".....OYO.....",
]);
// The two ships you can buy in the shop. Same 13×18 grid as the rocket
// above, so they all sit the same way on screen.
const TWIN_ROCKET_ART = spr([
  "..Y.......Y..", "..Y.......Y..", "..Y..YYY..Y..", "..YYYYYYYYY..",
  "..YsssssssY..", ".WsssssssssW.", ".WsDDDDDDDsW.", ".WsDCCCCCDsW.",
  ".WsDCCCCCDsW.", ".WsDDDDDDDsW.", ".WsssssssssW.", ".WsssssssssW.",
  "YYsssssssssYY", "YYYsssssssYYY", "Y..WsssssW..Y", "...GGGGGGG...",
  "...OOOOOOO...", "....OYYYO....",
]);
const RAPID_ROCKET_ART = spr([
  "......g......", "......g......", ".....ggg.....", "....ggggg....",
  "...gg...gg...", "..ggWWWWWgg..", "..ggWDDDWgg..", "..ggWDCDWgg..",
  "..ggWDDDWgg..", "..ggWWWWWgg..", "..ggsssssgg..", ".gggsssssggg.",
  "ggg.sssss.ggg", "gg..sssss..gg", "g...WsssW...g", "...GGGGGGG...",
  "....OOOOO....", ".....OYO.....",
]);
const BOMB_ROCKET_ART = spr([
  "....vvvvv....", "...vvvvvvv...", "..vvvvvvvvv..", "..vvOOOOOvv..",
  "..vvOYYYOvv..", "..vvOOOOOvv..", ".vvvWWWWWvvv.", ".vvvWDDDWvvv.",
  ".vvvWDCDWvvv.", ".vvvWDDDWvvv.", ".vvvWWWWWvvv.", ".vvvsssssvvv.",
  "vvv.sssss.vvv", "vv..sssss..vv", "v...WsssW...v", "...GGGGGGG...",
  "....OOOOO....", ".....OYO.....",
]);
const LASER_ROCKET_ART = spr([
  "......L......", ".....LLL.....", "....RLLLR....", "...RRRLRRR...",
  "..RRRRRRRRR..", "..RrWWWWWrR..", "..RrWDDDWrR..", "..RrWDCDWrR..",
  "..RrWDDDWrR..", "..RrWWWWWrR..", "..RrsssssrR..", ".RRrsssssrRR.",
  "RRRrsssssrRRR", "RR.rsssssr.RR", "R...WsssW...R", "...GGGGGGG...",
  "....ORRRO....", ".....RYR.....",
]);
const COW_ART = spr([
  ".HH.......HH.", "HHKH.....HKHH", ".KWWWWWWWWWK.", ".WWKKWWWKKWW.",
  "WWWKKWWWKKWWW", "WWWWWWWWWWWWW", "WWKWWWWWWWKWW", ".WWWWWWWWWWW.",
  "..PPPPPPPPP..", "..PNPPPPPNP..", "..PPPPPPPPP..", "...PPPPPPP...",
  "....PPPPP....",
]);
const CHICKEN_ART = spr([
  "....R.R......", "...RRRRR.....", "..WWWWWWWW...", ".WWWWWWWWWW..",
  ".WWKKWWKKWW..", ".WWKKWWKKWW..", ".WWWWOOWWWW..", ".WWWOOOOWWW..",
  ".WWWWOOWWWW..", ".WWWRRRRWWW..", "..WWRRRRWW...", "...WWWWWW....",
]);
const PIG_ART = spr([
  ".oo.......oo.", "oooo.....oooo", ".ooooooooooo.", "ooooooooooooo",
  "ooKKoooooKKoo", "ooKKoooooKKoo", "oooPPPPPPPooo", "oooPKPPPKPooo",
  "oooPPPPPPPooo", ".ooooooooooo.", "..ooooooooo..", "...ooooooo...",
]);
const MONKEY_ART = spr([
  "...BBBBBBB...", ".BBBBBBBBBBB.", "BBBBBBBBBBBBB", "BBBTTTTTTTBBB",
  "BBTTTTTTTTTBB", "BBTKKTTTKKTBB", "BBTKKTTTKKTBB", "BBTTTTTTTTTBB",
  "BBTTTKTKTTTBB", "BBBTTTTTTTBBB", ".BBTTTTTTTBB.", "..BBBBBBBBB..",
]);
const PENGUIN_ART = spr([
  "...KKKKKKK...", "..KKKKKKKKK..", ".KKKKKKKKKKK.", ".KKWWWWWWWKK.",
  ".KWWKWWWKWWK.", ".KWWWOOOWWWK.", ".KWWWOOOWWWK.", "KKWWWWWWWWWKK",
  "KKWWWWWWWWWKK", "KKKWWWWWWWKKK", ".K.WWWWWWW.K.", "...WWWWWWW...",
  "...OO...OO...",
]);
// The five things the animals throw at you.
const MILK_ART = spr([
  "...WW....", "...WW....", "..WWWW...", ".WWWWWW..", ".WWCCWW..",
  ".WWWWWW..", ".WWWWWW..", ".WWWWWW..", "..WWWW...",
]);
const EGG_ART = spr([
  "...WWW...", "..WWWWW..", ".WWWWWWW.", ".WWWWWWW.", ".WWWWWWW.",
  ".WWWWWWW.", "..WWWWW..", "...WWW...", ".........",
]);
const MUD_ART = spr([
  "....m....", "...mmm...", "..mmmmm..", "...mmm...", "..mmmmm..",
  ".mmmmmmm.", ".mmmmmmm.", "mmmmmmmmm", ".........",
]);
const BANANA_ART = spr([
  "...YYK...", "..YYY....", ".YYY.....", ".YY......", ".YYY.....",
  "..YYY....", "...YYK...", ".........", ".........",
]);
const ICE_ART = spr([
  ".CCCCCCC.", "CCCCCCCCC", "CCWWCCCCC", "CCWCCCCCC", "CCCCCCCCC",
  "CCCCCCCCC", "CCCCCCCCC", ".CCCCCCC.", ".........",
]);

// =====================================================================
// =====  CHANGE THESE TO CUSTOMISE YOUR GAME!  ========================
// =====================================================================
//
// These are the things that are the most fun to change. Try swapping
// the sprites (or use an emoji like "🐸"!) for different ones, or change
// the numbers, then save the file and re-open it to see what happens!

// The animals that invade, and what each one shoots. The herd is built
// from a RANDOM mix of these, so every game looks different! Each pair is
// a pixel-art sprite from up above — swap in your own, or an emoji string.
const ANIMALS = [
  { animal: COW_ART,     shot: MILK_ART   }, // cow shoots milk
  { animal: CHICKEN_ART, shot: EGG_ART    }, // chicken shoots eggs
  { animal: PIG_ART,     shot: MUD_ART    }, // pig shoots mud
  { animal: MONKEY_ART,  shot: BANANA_ART }, // monkey shoots bananas
  { animal: PENGUIN_ART, shot: ICE_ART    }, // penguin shoots ice
];
const PLAYER     = ROCKET_ART;   // your starting ship (or an emoji)
const BULLET_COLOR  = "#7ef9ff"; // colour of YOUR laser streaks — try "#ff5", "#f6f"
const BULLET_LENGTH = 22;  // how long your shots look (bigger = longer streaks)

// --- The shop: ships you EARN by scoring big ---
// Each ship needs a score of `need` in ONE game — not added up over lots of
// games, all in a single run. Manage it once and the ship is yours for good:
// visit the SHOP after a game to fly it. Make `need` smaller if you'd like to
// reach the good ships sooner!
// How often each gun can shoot, in frames (60 frames = one second), and
// how far the BLAST CANNON's explosion reaches.
const RAPID_EVERY = 12;  // between RAPID FIRE shots (12 = five a second)
const BOMB_RELOAD = 30;  // between BLAST CANNON shells (30 = half a second)
const BOMB_RADIUS = 95;  // how far the blast reaches, in pixels
const BOMB_CORE   = 44;  // inside this it's full strength; past it, half
const BOMB_BOOM   = 3.4; // how big the bang LOOKS (bigger = more flying bits)
const BOMB_RING   = 20;  // frames the shockwave ring takes to reach full size

// `damage` is how much of an animal one bullet takes off. Animals have 1
// health, so damage 1 downs them in a single hit and 0.5 takes two.
const SHIPS = [
  {
    id: "scout", name: "SCOUT", art: PLAYER, need: 0, fire: "single", damage: 1, reload: 0,
    blurb: ["The trusty rocket you start with.", "One shot at a time."],
  },
  {
    id: "rapid", name: "RAPID FIRE", art: RAPID_ROCKET_ART, need: 2500, fire: "single",
    damage: 0.5, reload: RAPID_EVERY, auto: true, // `auto` = keeps firing while held
    blurb: ["HOLD to pour out five shots a second,", "but each one hits only half as hard."],
  },
  {
    id: "twin", name: "TWIN BLASTER", art: TWIN_ROCKET_ART, need: 5000, fire: "twin", damage: 1, reload: 0,
    blurb: ["Two cannons, two bullets a shot —", "clear the herd twice as fast."],
  },
  {
    id: "bomb", name: "BLAST CANNON", art: BOMB_ROCKET_ART, need: 7500, fire: "bomb",
    damage: 1, reload: BOMB_RELOAD,
    blurb: ["A shell that BLOWS UP where it lands,", "wiping out all nearby. Reloads 0.5s."],
  },
  {
    id: "laser", name: "RED LASER", art: LASER_ROCKET_ART, need: 10000, fire: "laser", damage: 1, reload: 0,
    blurb: ["A beam that smashes clean through", "them all. Burns 3s, reloads 1s."],
  },
];
const BEAM_TIME    = 180;  // frames the red beam burns for (180 = 3 seconds)
const BEAM_RELOAD  = 60;   // frames it reloads for afterwards (60 = 1 second)
const BEAM_WIDTH   = 18;   // how wide the beam's bright core is, in pixels
const BEAM_BURN    = 16;   // frames an animal must be held in the beam before it melts
const BEAM_DRAG    = 0.65; // how much of your usual speed you steer at while firing

// --- The numbers you'll reach for first ---
const ROWS        = 4;     // how many rows of animals
const COLS        = 8;     // how many animals in each row
const INVADER_SPEED = 0.6; // how fast the herd slides sideways (bigger = faster)
const MAX_SHOTS     = 3;   // most shots falling at ONCE (the real Space Invaders only allows 3!)
const SHOT_RELOAD   = 45;  // frames to wait between shots (smaller = they shoot more often)
const SHOT_ANGLE    = 1.2; // how far sideways a stray (un-aimed) shot drifts
const AIM_CHANCE    = 0.5; // chance (0–1) a shot is AIMED at you — bigger = sharper shooters
const AIM_MAX       = 2.5; // how sharply an aimed shot can angle toward you
const PLAYER_SPEED  = 4;   // how fast your ship moves (bigger = faster)
const PLAYER_BULLET_SPEED = 5; // how fast your shots fly up
const SHOT_SPEED    = 2; // how fast the animals' shots fall down
const STARTING_LIVES = 3;  // how many tries you get
const SAFE_TIME     = 90;  // frames you flash & can't be hit after losing a life

// --- Stages: clear the herd without dying and a new, faster wave begins ---
const STAGE_SPEEDUP = 0.12; // each stage everything gets this much faster (0.12 = 12%)
const STAGE_BONUS   = 100;  // bonus points for clearing a stage
const BANNER_TIME   = 100;  // frames the big "STAGE N" banner shows for

// --- The bases (shields) you can hide behind ---
const BASE_COUNT   = 3;    // how many bases there are
const BASE_COLOR   = "#5fd66f"; // their colour — try "#7ec8ff" or "#ffd34d"
const BASE_BLOCKS_W = 9;   // how many little blocks wide each base is
const BASE_BLOCKS_H = 5;   // how many little blocks tall each base is
const BASE_BLOCK   = 12;   // size of one little block, in pixels

// --- Want to use your OWN drawing instead of an emoji? ---
// Easy! It takes one line.
//   1. Make a picture in a sprite tool (like Sprite AI or OpenArt) and
//      save the PNG next to this file. A "sprites" folder is fine too,
//      e.g. save it as  sprites/cow.png
//   2. Swap an emoji above for a loadImage(...), e.g. change the cow to:
//        { animal: loadImage("sprites/cow.png"), shot: "🍼" },
//      or change your ship to:
//        const PLAYER = loadImage("sprites/ship.png");
//
// That's it — the game knows how to draw both emoji and pictures.
//
// =====================================================================
// =====  (You can stop reading here if you like! The rest is the  =====
// =====   game engine. Peek if you're curious how it all works.)  =====
// =====================================================================


// ---------------------------------------------------------------------
// loadImage(): the tiny helper that lets a PNG stand in for an emoji.
// It hands back an <img> straight away; the picture fills in once the
// file has loaded. If the file is missing the game just keeps going.
// ---------------------------------------------------------------------
function loadImage(src) {
  const img = new Image();
  img.src = src;
  img.isSprite = true; // a little flag so we know "this is a picture"
  return img;
}

// Grab the canvas (our drawing surface) and its 2D pen ("ctx").
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

// How big things are drawn, in pixels.
const CELL = 40;          // the size of one animal / the player
const FONT = CELL + "px serif"; // emoji are just text, so we pick a font size

// ---------------------------------------------------------------------
// drawThing(): draws either an emoji (a string) OR a loaded picture,
// centred at (x, y). This is the magic that makes the one-line PNG
// swap above "just work" — every drawing goes through here.
// ---------------------------------------------------------------------
function drawThing(thing, x, y, size, rotate) {
  size = size || CELL;
  // Optionally spin the drawing around its centre (used to point the
  // rocket straight up — the 🚀 emoji leans to the upper-right by default).
  if (rotate) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotate);
    ctx.translate(-x, -y);
  }
  if (thing && thing.isPixel) {
    // It's pixel art: a grid of letters. Draw each letter as one fat,
    // crisp square. We fit the grid into a size×size box and centre it.
    // Block sizes are rounded to whole pixels so the art stays sharp.
    const rows = thing.rows;
    const gh = rows.length;
    const gw = rows[0].length;
    const ps = Math.max(1, Math.round(size / Math.max(gw, gh))); // pixel block size
    const startX = Math.round(x - (gw * ps) / 2);
    const startY = Math.round(y - (gh * ps) / 2);
    for (let r = 0; r < gh; r++) {
      const line = rows[r];
      for (let c = 0; c < gw; c++) {
        const col = SPRITE_PAL[line[c]];
        if (!col) continue; // "." = see-through, skip it
        ctx.fillStyle = col;
        ctx.fillRect(startX + c * ps, startY + r * ps, ps, ps);
      }
    }
  } else if (typeof thing === "string") {
    // It's an emoji / text. Draw it centred.
    ctx.font = size + "px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(thing, x, y);
  } else if (thing && thing.isSprite && thing.complete && thing.naturalWidth) {
    // It's a picture that has finished loading. Draw it centred.
    ctx.drawImage(thing, x - size / 2, y - size / 2, size, size);
  } else {
    // A picture that isn't ready yet — draw a placeholder box so you
    // can still see and play. It pops in once the PNG loads.
    ctx.fillStyle = "#555";
    ctx.fillRect(x - size / 2, y - size / 2, size, size);
  }
  if (rotate) ctx.restore();
}


// ---------------------------------------------------------------------
// GAME STATE  — all the moving parts live in plain variables.
// ---------------------------------------------------------------------
let player;        // {x, y}
let invaders;      // array of {x, y, alive, animal, shot}
let bullets;       // YOUR shots going up:   array of {x, y, dmg}
let shots;         // animal shots coming down: array of {x, y, emoji}
let bases;         // the shields: array of { blocks: [{x, y, alive}] }
let particles;     // explosion bits: array of {x, y, vx, vy, life, maxLife, color}
let shockwaves;    // BLAST CANNON blast rings: array of {x, y, life}
let invaderDir;    // +1 moving right, -1 moving left
let score;
let lives;
let state;         // "start" (waiting), "playing", "lost", or "shop"
let paused;        // true while the game is frozen by the ⏸ button (or P)
let beamTimer;     // frames left of the RED LASER's beam (0 = not firing)
let beamCooldown;  // frames left before the beam can be fired again
let gunTimer;      // frames until this ship's gun has finished reloading
let invuln;        // frames left of "just got hit, can't be hit again yet"
let stage;         // which wave you're on (1, 2, 3, ...) — everything speeds up
let stageBanner;   // frames left to show the "STAGE N" banner
let stageStartScore; // the score and lives you had when this stage began —
let stageStartLives; // what the ⏮ restart button winds you back to
let gameOverHandled; // did we already deal with this game over (save score etc.)?
let enteringName;  // true while the "new high score!" name box is open
let lastEntry;     // the run you just saved, so we can highlight it gold
let justUnlocked = []; // ships the run you just finished earned, to shout about

// Remember which keys are currently held down.
const keys = {};

// shotTimer counts down between animal shots, so they come in a steady
// trickle instead of all at once.
let shotTimer = 0;

// ---------------------------------------------------------------------
// buildLevel(): lay out a fresh wave of animals and brand-new bases, and
// clear anything left flying around. Used at the start of every stage.
// ---------------------------------------------------------------------
function buildLevel() {
  // Build the grid of animals, centred across the screen.
  invaders = [];
  const gapX = 70;     // space between animals across
  const gapY = 60;     // space between rows
  const startX = (W - (COLS - 1) * gapX) / 2; // centre the grid horizontally
  const startY = 80;   // top of the grid
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      // Pick a random animal for this spot, so the herd is a mixed bunch.
      const kind = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
      invaders.push({
        x: startX + col * gapX,
        y: startY + row * gapY,
        alive: true,
        animal: kind.animal, // which emoji to draw
        shot: kind.shot,     // what it throws at you
        heat: 0,             // how long it's been held in the RED LASER's beam
        hp: 1,               // health: most bullets take off 1, so one hit downs it
      });
    }
  }

  // Build the bases (shields) you can hide behind. Each base is a little
  // grid of blocks; shots eat away one block at a time, so they slowly
  // crumble — from both the animals' shots AND your own bullets. You get
  // fresh bases at the start of each stage.
  bases = [];
  const baseW = BASE_BLOCKS_W * BASE_BLOCK;
  const baseGap = (W - BASE_COUNT * baseW) / (BASE_COUNT + 1); // even spacing
  const baseY = player.y - 150; // sit above the player, with room to duck
  for (let i = 0; i < BASE_COUNT; i++) {
    const bx = baseGap + i * (baseW + baseGap);
    const blocks = [];
    for (let r = 0; r < BASE_BLOCKS_H; r++) {
      for (let c = 0; c < BASE_BLOCKS_W; c++) {
        if (isCarved(r, c)) continue; // shaped: leave carved-out spots empty
        blocks.push({
          x: bx + c * BASE_BLOCK + BASE_BLOCK / 2,
          y: baseY + r * BASE_BLOCK + BASE_BLOCK / 2,
          alive: true,
        });
      }
    }
    bases.push({ blocks });
  }

  // Re-centre the player and clear the air.
  player.x = W / 2;
  bullets = [];
  shots = [];
  particles = [];
  shockwaves = [];
  invaderDir = 1;
  shotTimer = 0;
  invuln = 0;
  beamTimer = 0;      // a fresh wave means a cooled-off, fully loaded gun
  beamCooldown = 0;
  gunTimer = 0;
  stageBanner = BANNER_TIME;
  // Remember where you stood as this wave began, so the ⏮ button can put
  // you back exactly here.
  stageStartScore = score;
  stageStartLives = lives;
}

// ---------------------------------------------------------------------
// newGame(): reset the score/lives/stage and lay out a fresh board.
// startState is "start" (wait on the start screen) or "playing" (go now).
// ---------------------------------------------------------------------
function newGame(startState) {
  player = { x: W / 2, y: H - CELL - 20 };
  score = 0;
  lives = STARTING_LIVES;
  stage = 1;
  state = startState;
  paused = false;
  gameOverHandled = false;
  enteringName = false;
  lastEntry = null;
  hideNameEntry();
  buildLevel();
}

// setup(): the very first screen. Build the board but WAIT — the game
// doesn't move until the player taps/clicks/presses to begin.
function setup() {
  newGame("start");
}

// begin(): leave the start screen and actually start playing.
function begin() {
  if (state !== "start") return;
  state = "playing";
  stageBanner = BANNER_TIME; // flash "STAGE 1" as we kick off
}

// startOrRestart(): what a tap / click / Enter does when you're NOT mid-game
// — begin from the start screen, or play again after game over.
function startOrRestart() {
  if (state === "start") begin();
  else if (state === "lost" || state === "shop") newGame("playing");
}

// ---------------------------------------------------------------------
// openShop() / closeShop(): pop into the ship shop and back out again.
// You can get there from the start screen, from the game-over screen once
// you've dealt with the name box, or straight out of a game in progress
// with the 🛒 button. shopCameFrom remembers which screen sent you, so
// BACK returns you to the right one.
//   Opening it mid-game freezes everything (update() only runs while the
// state is "playing") and pauses you, so you come back to the PAUSED
// screen and choose when to dive back in rather than being dropped
// straight into the middle of a wave.
// ---------------------------------------------------------------------
let shopCameFrom = "start";
function openShop() {
  if (state !== "start" && state !== "lost" && state !== "playing") return;
  if (enteringName) return; // deal with the high-score box first
  if (state === "playing") paused = true;
  shopCameFrom = state;
  state = "shop";
}
function closeShop() {
  if (state !== "shop") return;
  state = shopCameFrom;
}

// ---------------------------------------------------------------------
// restartStage(): put the current wave back exactly as it began — a full
// herd, fresh bases, and the score and lives you had when the stage
// started. You keep your stage number (and the speed that comes with it);
// only what you did THIS stage is rewound. Winding the score back too is
// what stops it being a way to farm points off a half-cleared wave.
// ---------------------------------------------------------------------
function restartStage() {
  if (state !== "playing") return;
  score = stageStartScore;
  lives = stageStartLives;
  buildLevel(); // re-lays the wave, and re-takes the same snapshot
}

// togglePause(): freeze / un-freeze a game in progress. Everything stops
// moving (update() bails out) but the screen keeps being drawn, so you see
// the board exactly as you left it under a "PAUSED" sign. Only means
// anything mid-game — there's nothing to pause on the start/game-over screens.
function togglePause() {
  if (state !== "playing") return;
  paused = !paused;
}

// Look away and the game waits for you. Switching to another tab, another
// app, or minimising the window pauses a game in progress, so you never come
// back to find the herd landed while you were gone. It only ever pauses,
// never un-pauses: you come back to the PAUSED screen and start again when
// your hands are ready.
//   visibilitychange covers switching tabs and minimising; the window's blur
// covers clicking away to another app while the tab is still on screen.
// We also forget any held-down keys, because the keyup happens off-page and
// we'd never hear it — otherwise you'd resume already drifting sideways.
function pauseOnLeave() {
  for (const k in keys) keys[k] = false;
  if (state === "playing") paused = true;
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseOnLeave();
});
window.addEventListener("blur", pauseOnLeave);

// ---------------------------------------------------------------------
// nextStage(): you cleared the herd! Keep your score and lives, bump the
// stage (which speeds everything up), and lay out a fresh, faster wave.
// ---------------------------------------------------------------------
function nextStage() {
  score += STAGE_BONUS * stage; // reward for clearing the wave
  stage++;
  buildLevel();
}

// ---------------------------------------------------------------------
// KEYBOARD — note when keys go down and up.
// ---------------------------------------------------------------------
document.addEventListener("keydown", (e) => {
  // While the high-score name box is open, let the typing go to it and
  // ignore all game controls (so Space doesn't restart mid-name, etc.).
  if (enteringName) return;
  keys[e.key] = true;
  // M mutes / un-mutes the sound at any time.
  if (e.key === "m" || e.key === "M") { toggleSound(); return; }
  // P (or Escape) pauses / un-pauses a game in progress — and backs you
  // out of the shop, where there's nothing to pause.
  if (e.key === "p" || e.key === "P" || e.key === "Escape") {
    if (state === "shop") closeShop(); else togglePause();
    return;
  }
  // R starts the stage you're on again, from the top.
  if (e.key === "r" || e.key === "R") { restartStage(); return; }
  // S opens the shop from the start or game-over screen (and shuts it again).
  if (e.key === "s" || e.key === "S") {
    if (state === "shop") closeShop(); else openShop();
    return;
  }
  // In the shop, 1 / 2 / 3 fly the ship on that row, if you've earned it.
  // (The same thing the row's button does when tapped.)
  if (state === "shop" && e.key >= "1" && e.key <= String(SHIPS.length)) {
    equipShip(SHIPS[Number(e.key) - 1]);
    return;
  }
  // On the start / game-over / shop screens, Enter/Space begins (or restarts).
  if (state !== "playing" && (e.key === "Enter" || e.key === " " || e.key === "Spacebar")) {
    startOrRestart();
    e.preventDefault();
    return;
  }
  // Shoot on a fresh press of Space — one shot per press. We ignore
  // e.repeat (the machine-gun events the OS sends while a key is HELD),
  // so holding Space does nothing; you must tap it for each shot.
  if ((e.key === " " || e.key === "Spacebar") && !e.repeat) playerFire();
  // Stop space/arrows from scrolling the page.
  if ([" ", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
    e.preventDefault();
  }
});
document.addEventListener("keyup", (e) => {
  keys[e.key] = false;
});

// ---------------------------------------------------------------------
// TOUCH CONTROLS — wire the on-screen buttons (phones/tablets) to the
// same controls the keyboard uses. We use "pointer" events so they work
// for a finger or a mouse. Holding ◀ / ▶ moves; each tap of FIRE shoots.
// ---------------------------------------------------------------------
// A short "pew" laser sound made on the fly with the Web Audio API — no
// sound files needed. A quick downward-sweeping square-wave blip that
// fades out fast. The audio "context" is created on the first shot (browsers
// only allow sound to start after the player interacts with the page).
let audioCtx = null;

// Sound starts ON. Tap the 🔊 button (top-left) or press M to mute; the
// choice is remembered for next time. Every sound checks this first.
let soundOn = true;
try { soundOn = localStorage.getItem("ai-sound") !== "off"; } catch (e) {}
function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem("ai-sound", soundOn ? "on" : "off"); } catch (e) {}
  if (soundOn) playShootSound(); // a tiny chirp so you know sound is back on
}

// `light` gives a shorter, quieter, higher pew — used by the RAPID FIRE
// ship, whose steady stream would be a racket at full volume.
function playShootSound(light) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const dur = light ? 0.05 : 0.12;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(light ? 1250 : 880, t);        // start high...
    osc.frequency.exponentialRampToValueAtTime(light ? 620 : 220, t + dur); // ...sweep down
    gain.gain.setValueAtTime(light ? 0.05 : 0.15, t);           // gentle volume
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);     // quick fade
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) { /* if audio isn't available, just stay silent */ }
}

// A short "boom" made with the Web Audio API — a burst of filtered white
// noise that fades out, for when you blow up an animal. No sound files needed.
function playExplosionSound(big = false) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    // A "big" boom (player hit) is longer and louder than a regular one, but
    // both are deep, sub-bass rumbles. The sound is two layers stacked:
    //   1) a low SINE sweep — the deep "body" you feel in your chest
    //   2) heavily low-passed NOISE — the gritty "rumble" texture on top
    const dur = big ? 1.8 : 1.4;

    // Master gain for the whole boom, with a fast attack and a long fade so it
    // rumbles out rather than popping off abruptly.
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(big ? 1.0 : 0.9, t + 0.03); // quick swell in
    master.gain.exponentialRampToValueAtTime(0.0001, t + dur);           // long rumble out
    master.connect(audioCtx.destination);

    // A slow LFO wobbles the volume up and down — that pulsing tremor is what
    // makes the boom read as a "rumble" instead of a smooth steady tone.
    const lfo = audioCtx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.setValueAtTime(big ? 14 : 18, t);   // a few wobbles per second
    const lfoDepth = audioCtx.createGain();
    lfoDepth.gain.setValueAtTime(0.5, t);             // how deep the wobble cuts
    lfo.connect(lfoDepth).connect(master.gain);
    lfo.start(t);
    lfo.stop(t + dur);

    // --- Layer 1: deep sine sub-bass sweep (the "boom") ---
    const sub = audioCtx.createOscillator();
    sub.type = "sine";
    sub.frequency.setValueAtTime(big ? 70 : 85, t);  // already very low...
    sub.frequency.exponentialRampToValueAtTime(big ? 16 : 20, t + dur); // ...sinks into deep sub rumble
    const subGain = audioCtx.createGain();
    subGain.gain.setValueAtTime(1.0, t);
    sub.connect(subGain).connect(master);
    sub.start(t);
    sub.stop(t + dur);

    // --- Layer 2: low-passed noise (the gritty "rumble") ---
    const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    // Keep the cutoff very low so almost no hiss survives — just low rumble.
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(big ? 200 : 170, t);
    filter.frequency.exponentialRampToValueAtTime(big ? 35 : 40, t + dur);
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.7, t);
    noise.connect(filter).connect(noiseGain).connect(master);
    noise.start(t);
    noise.stop(t + dur);
  } catch (e) { /* if audio isn't available, just stay silent */ }
}

// The RED LASER's voice: a short, gritty zap. Played once loudly as the
// beam lights up, then quietly over and over while it burns — which is why
// the beam crackles as it fires, and falls silent the moment you pause
// (the ticks are counted out by update(), and update() freezes too).
function playLaserSound(start) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const dur = start ? 0.3 : 0.1;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";                              // buzzy, not pure — it's a laser
    osc.frequency.setValueAtTime(start ? 1200 : 520, t);
    osc.frequency.exponentialRampToValueAtTime(start ? 180 : 380, t + dur);
    gain.gain.setValueAtTime(start ? 0.18 : 0.05, t);   // the crackle stays well under the zap
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) { /* if audio isn't available, just stay silent */ }
}

// shootBullets(): put this ship's shot in the air — two bullets for the
// TWIN BLASTER, one for everybody else, each carrying the ship's damage.
// Called both by a press and by the RAPID FIRE stream, so a bullet is
// always built the same way.
function shootBullets() {
  const ship = currentShip();
  const nose = player.y - CELL / 2;
  if (ship.fire === "twin") {
    bullets.push({ x: player.x - 11, y: nose, dmg: ship.damage });
    bullets.push({ x: player.x + 11, y: nose, dmg: ship.damage });
  } else {
    // `bomb` marks a BLAST CANNON shell — it blows up where it lands
    // instead of just poking the one animal it touched.
    bullets.push({ x: player.x, y: nose, dmg: ship.damage, bomb: ship.fire === "bomb" });
  }
  gunTimer = ship.reload;                 // this gun's own reload time
  playShootSound(!!ship.auto);            // a held stream gets a lighter, quicker pew
}

// ---------------------------------------------------------------------
// playerFire(): what happens when you PRESS fire, whichever ship you're
// flying. Both the Space bar and the on-screen FIRE button come through
// here, so the two can never drift apart.
//   SCOUT        — one bullet, as always.
//   RAPID FIRE   — one light bullet now; hold the button and update()
//                  keeps the stream going at five a second.
//   TWIN BLASTER — two bullets side by side.
//   RED LASER    — lights up the beam (see update()), if it's reloaded.
// ---------------------------------------------------------------------
function playerFire() {
  if (state !== "playing" || paused) return;
  const ship = currentShip();
  if (ship.fire === "laser") {
    // One press burns the beam for BEAM_TIME; you can't fire again until
    // it's finished burning AND finished reloading.
    if (beamTimer === 0 && beamCooldown === 0) {
      beamTimer = BEAM_TIME;
      playLaserSound(true);
    }
    return;
  }
  // A gun that's still reloading simply doesn't go off — hammering the key
  // can't beat a ship's fire rate.
  if (gunTimer > 0) return;
  shootBullets();
}

function fireShot() {
  // The on-screen FIRE button. Starting the game and restarting are handled
  // by the "tap anywhere" listener below.
  playerFire();
}

// A move button holds a direction down while you're pressing it.
function holdButton(id, key) {
  const el = document.getElementById(id);
  const press   = (e) => { e.preventDefault(); keys[key] = true; };
  const release = (e) => { e.preventDefault(); keys[key] = false; };
  el.addEventListener("pointerdown", press);
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
  el.addEventListener("pointerleave", release);
}
holdButton("btn-left", "ArrowLeft");
holdButton("btn-right", "ArrowRight");
// FIRE both shoots on the tap AND stays "held", so the RAPID FIRE ship
// streams while your finger is down, exactly like holding the Space bar.
holdButton("btn-fire", " ");
document.getElementById("btn-fire").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  fireShot();
});

// Where the two little toggles sit on the canvas (in game pixels), side by
// side under the score, and a helper to turn a screen tap into game pixels
// (the canvas is scaled to fit the screen).
const SOUND_ICON   = { x: 12,  y: 42, w: 36, h: 32 };
const PAUSE_ICON   = { x: 56,  y: 42, w: 36, h: 32 };
const RESTART_ICON = { x: 100, y: 42, w: 36, h: 32 };
const SHOP_ICON    = { x: 144, y: 42, w: 36, h: 32 };
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
function hitIcon(p, icon) {
  return p.x >= icon.x && p.x <= icon.x + icon.w &&
         p.y >= icon.y && p.y <= icon.y + icon.h;
}
// Tapping an icon or an on-screen button does that one thing — and must NOT
// also start the game, so a hit stops the tap from reaching the "tap
// anywhere to start" listener below.
canvas.addEventListener("pointerdown", (e) => {
  const p = canvasPoint(e);
  if (hitIcon(p, SOUND_ICON)) {
    e.stopPropagation();
    toggleSound();
    return;
  }
  if (state === "playing" && hitIcon(p, PAUSE_ICON)) {
    e.stopPropagation();
    togglePause();
    return;
  }
  if (state === "playing" && hitIcon(p, RESTART_ICON)) {
    e.stopPropagation();
    restartStage();
    return;
  }
  if (state === "playing" && hitIcon(p, SHOP_ICON)) {
    e.stopPropagation();
    openShop();
    return;
  }
  // The buttons on the start / game-over / shop screens.
  for (const b of screenButtons()) {
    if (b.action && hitIcon(p, b)) {
      e.stopPropagation();
      b.action();
      return;
    }
  }
});

// Tap or click ANYWHERE to start from the start screen (or to play again
// after game over). Ignored while you're playing — and in the shop, where
// browsing shouldn't fling you into a game; that screen has its own buttons.
document.addEventListener("pointerdown", () => {
  if (enteringName) return; // don't restart while typing your name
  if (state === "shop") return;
  if (state !== "playing") startOrRestart();
});


// ---------------------------------------------------------------------
// update(): the "thinking" half of the game loop. Runs ~60 times a
// second. It moves everything and checks for collisions.
// ---------------------------------------------------------------------
function update() {
  if (state !== "playing") return; // frozen on the game-over screen
  if (paused) return;              // ...and frozen while paused

  // Each stage speeds the animals up a little. speedScale is 1 on stage 1,
  // 1.12 on stage 2, and so on. shotSpeed is how fast their shots fall now.
  const speedScale = 1 + (stage - 1) * STAGE_SPEEDUP;
  const shotSpeed = SHOT_SPEED * speedScale;
  if (stageBanner > 0) stageBanner--; // count down the "STAGE N" banner

  // --- Move the player ---
  // Firing the RED LASER is heavy work: while the beam is lit you steer
  // slowly, so you can't simply sweep it across the whole herd in one go.
  const moveSpeed = PLAYER_SPEED * (beamTimer > 0 ? BEAM_DRAG : 1);
  if (keys["ArrowLeft"] || keys["a"] || keys["A"])  player.x -= moveSpeed;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += moveSpeed;
  // Keep the player inside the screen.
  player.x = Math.max(CELL / 2, Math.min(W - CELL / 2, player.x));

  // --- Shooting ---
  // Most ships fire once per press (see the keydown handler above). The
  // RAPID FIRE ship instead pours out a stream for as long as you hold the
  // button down, one bullet every RAPID_EVERY frames.
  if (gunTimer > 0) gunTimer--;
  if (currentShip().auto && keys[" "] && gunTimer === 0) shootBullets();

  // --- Move YOUR bullets up; drop ones that fly off the top ---
  for (const b of bullets) b.y -= PLAYER_BULLET_SPEED;
  bullets = bullets.filter((b) => b.y > -20);

  // --- Move the herd ---
  // The fewer animals are left, the faster they go (classic tension!).
  const aliveCount = invaders.filter((inv) => inv.alive).length;
  const totalCount = ROWS * COLS;
  // Speed grows from 1x up to about 4x as the herd is wiped out.
  const speedMult = 1 + (1 - aliveCount / totalCount) * 3;
  const step = INVADER_SPEED * speedMult * speedScale;

  // Move them sideways. If any hits an edge, the whole herd drops and
  // reverses direction.
  let hitEdge = false;
  for (const inv of invaders) {
    if (!inv.alive) continue;
    inv.x += step * invaderDir;
    if (inv.x > W - CELL / 2 || inv.x < CELL / 2) hitEdge = true;
  }
  if (hitEdge) {
    invaderDir *= -1;
    for (const inv of invaders) {
      if (inv.alive) inv.y += 20; // drop down a row
      // If the animals reach the bottom, it's game over.
      if (inv.alive && inv.y > player.y - CELL) state = "lost";
    }
  }

  // --- Animals shoot ---
  // This works like the REAL Space Invaders: only a few shots fall at
  // once (MAX_SHOTS), and they come on a timer instead of all at the same
  // time. Only the FRONT animal in a column (the lowest one) can shoot,
  // and each animal throws its OWN thing (milk, eggs, mud, bananas, ice).
  if (shotTimer > 0) shotTimer--;
  if (shotTimer === 0 && shots.length < MAX_SHOTS) {
    const shooter = pickShooter();
    if (shooter) {
      const startY = shooter.y + CELL / 2;
      let vx;
      if (Math.random() < AIM_CHANCE) {
        // AIMED shot: work out the sideways drift needed to land where the
        // player is right now (how far across ÷ how long it takes to fall),
        // then cap it so the shot can't fly almost sideways.
        const fallTime = Math.max(1, (player.y - startY) / shotSpeed);
        vx = (player.x - shooter.x) / fallTime;
        vx = Math.max(-AIM_MAX, Math.min(AIM_MAX, vx));
      } else {
        // Stray shot: straight down, or a slight random angle.
        vx = Math.random() < 0.5 ? 0 : (Math.random() * 2 - 1) * SHOT_ANGLE;
      }
      shots.push({ x: shooter.x, y: startY, emoji: shooter.shot, vx: vx });
      // Reload a bit faster as the herd thins out — and faster each stage.
      shotTimer = Math.round(SHOT_RELOAD / speedScale * (0.4 + 0.6 * aliveCount / totalCount));
    }
  }
  // Move shots down (and sideways for angled ones); drop ones that leave the screen.
  for (const m of shots) {
    m.y += shotSpeed;
    m.x += m.vx;
  }
  shots = shots.filter((m) => m.y < H + 20 && m.x > -20 && m.x < W + 20);

  // --- COLLISIONS happen here ---

  // --- The RED LASER's beam ---
  // While it burns, the beam is a column of light from the ship's nose
  // straight up and off the top of the screen, and it keeps going instead
  // of stopping at the first thing it touches — so it works on a whole
  // column of animals at once.
  //   Animals don't pop the instant it touches them, though: they have to
  // be HELD in the beam for BEAM_BURN frames before they melt, and they
  // cool off again the moment you swing away. Together with the slow steering
  // above, that's what stops one burn wiping out the entire wave — you have
  // to pick your column and stay on it.
  //   Their falling shots are flimsier and burn up on contact, and your own
  // bases are untouched: the beam passes right over your cover, so the most
  // powerful gun in the game can't make you lose by wrecking a shield.
  const beamOn = beamTimer > 0;
  const reach = (CELL + BEAM_WIDTH) / 2;
  const inBeam = (x, y) => Math.abs(x - player.x) < reach && y < player.y;
  let melted = 0;
  for (const inv of invaders) {
    if (!inv.alive) continue;
    if (beamOn && inBeam(inv.x, inv.y)) {
      inv.heat++;
      if (inv.heat >= BEAM_BURN) {
        inv.alive = false;
        spawnExplosion(inv.x, inv.y);
        score += 10;
        melted++;
      }
    } else if (inv.heat > 0) {
      inv.heat--; // out of the beam — cool back down
    }
  }
  // ONE boom for the whole column, however many animals went up together —
  // a handful of overlapping explosions would just be noise.
  if (melted > 0) playExplosionSound();
  if (beamOn) {
    beamTimer--;
    if (beamTimer % 6 === 0) playLaserSound(false); // the crackle as it burns
    shots = shots.filter((m) => !inBeam(m.x, m.y)); // their shots burn up
    if (beamTimer === 0) beamCooldown = BEAM_RELOAD; // burnt out — now reload
  } else if (beamCooldown > 0) {
    beamCooldown--;
  }

  // Your bullets hitting animals. A bullet takes its ship's `dmg` off the
  // animal's health — a full-strength one downs it outright, while the RAPID
  // FIRE ship's lighter bullets need two hits. A hit that isn't fatal throws
  // off a little spark, so you can see it landed.
  for (const b of bullets) {
    for (const inv of invaders) {
      if (inv.alive && hit(b.x, b.y, inv.x, inv.y, CELL)) {
        // A BLAST CANNON shell doesn't poke one animal — it goes off, and
        // the bang does all the damage to everything standing near it.
        if (b.bomb) {
          bombBlast(b.x, b.y);
          b.y = -999;
          break;                    // one bang per shell
        }
        inv.hp -= b.dmg;
        b.y = -999;                 // send bullet off-screen so it's cleaned up
        if (inv.hp <= 0) {
          inv.alive = false;          // animal destroyed
          spawnExplosion(inv.x, inv.y); // BOOM!
          playExplosionSound();         // ...and the BOOM is heard
          score += 10;                  // points!
        } else {
          spawnExplosion(b.x, inv.y + CELL / 4, 0.3); // winged it — just a spark
        }
      }
    }
    // Your bullets also chip away at the bases (don't shoot your own cover!).
    if (b.y > -20 && hitBase(b.x, b.y)) b.y = -999;
  }
  bullets = bullets.filter((b) => b.y > -20);

  // Animal shots crumbling the bases (your cover slowly wears down).
  for (const m of shots) {
    if (hitBase(m.x, m.y)) m.y = H + 999;
  }

  // Count down the "safe" flashing time after being hit.
  if (invuln > 0) invuln--;

  // Shots hitting the player. While you're flashing (invuln) you're safe,
  // so one splash can't drain several lives at once.
  for (const m of shots) {
    if (invuln === 0 && hit(m.x, m.y, player.x, player.y, CELL)) {
      m.y = H + 999;       // remove this shot
      lives--;             // lose a life
      invuln = SAFE_TIME;  // brief flashing safety so you can recover
      spawnExplosion(player.x, player.y, 2.5); // a BIG blast where you got hit
      playExplosionSound(true);                // ...and a big boom to match
      if (lives <= 0) state = "lost";
    }
  }
  shots = shots.filter((m) => m.y < H + 20);

  // --- Move the explosion bits and let them fade out ---
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life++;
  }
  particles = particles.filter((p) => p.life < p.maxLife);

  // --- Grow the blast rings and drop them once they're full size ---
  for (const r of shockwaves) r.life++;
  shockwaves = shockwaves.filter((r) => r.life < BOMB_RING);

  // --- Lose a base, lose the game ---
  // If ANY base is completely wiped out, it's game over — protect them all!
  if (bases.some((base) => base.blocks.every((blk) => !blk.alive))) state = "lost";

  // --- Cleared the herd? On to the next (faster) stage! ---
  // Only if you're still alive, of course.
  if (state === "playing" && invaders.every((inv) => !inv.alive)) nextStage();
}

// ---------------------------------------------------------------------
// hit(): simple box overlap check. Are two things close enough to
// count as touching? (This is "bounding-box" collision.)
// ---------------------------------------------------------------------
function hit(ax, ay, bx, by, size) {
  return Math.abs(ax - bx) < size / 2 && Math.abs(ay - by) < size / 2;
}

// ---------------------------------------------------------------------
// pickShooter(): choose which animal fires next. Like the arcade game,
// only the FRONT (lowest) animal in a column can shoot — so as you clear
// columns, fewer animals can fire at you. Picks a random column each time.
// ---------------------------------------------------------------------
function pickShooter() {
  const alive = invaders.filter((inv) => inv.alive);
  if (alive.length === 0) return null;
  // Pick a random living animal, then find the lowest one in its column.
  const pick = alive[Math.floor(Math.random() * alive.length)];
  let front = pick;
  for (const inv of alive) {
    if (Math.abs(inv.x - pick.x) < 1 && inv.y > front.y) front = inv;
  }
  return front;
}

// ---------------------------------------------------------------------
// isCarved(): which block spots are CUT OUT to give a base its shape —
// rounded top corners and an arched doorway in the bottom middle.
// ---------------------------------------------------------------------
function isCarved(r, c) {
  const lastRow = BASE_BLOCKS_H - 1;
  const lastCol = BASE_BLOCKS_W - 1;
  const mid = Math.floor(BASE_BLOCKS_W / 2);
  // Round off the two top corners.
  if (r === 0 && (c === 0 || c === lastCol)) return true;
  // Carve an arched doorway up from the bottom middle.
  if (r === lastRow && Math.abs(c - mid) <= 1) return true; // 3 blocks wide at the very bottom
  if (r === lastRow - 1 && c === mid) return true;          // 1 block higher in the centre
  return false;
}

// ---------------------------------------------------------------------
// hitBase(): did a shot/bullet at (x, y) hit a base block? If so, that
// block crumbles away and we return true (so the shot is used up).
// ---------------------------------------------------------------------
function hitBase(x, y) {
  for (const base of bases) {
    for (const blk of base.blocks) {
      if (blk.alive && hit(x, y, blk.x, blk.y, BASE_BLOCK)) {
        blk.alive = false; // chip away this block
        return true;
      }
    }
  }
  return false;
}

// ---------------------------------------------------------------------
// EXPLOSIONS — when an animal is shot, throw out a little burst of
// coloured bits that fly apart and fade away.
// ---------------------------------------------------------------------
// ---------------------------------------------------------------------
// bombBlast(): a BLAST CANNON shell goes off at (x, y). Every animal
// within BOMB_RADIUS takes damage — full strength right next to the bang
// (inside BOMB_CORE) and half strength out at the edges. So a shell
// downs whatever it lands on and leaves the neighbours winged, and a
// second one finishes the cluster off.
// Your bases are left alone; the shell only goes off on an animal.
// ---------------------------------------------------------------------
function bombBlast(x, y) {
  spawnExplosion(x, y, BOMB_BOOM); // a big one, so you can see the blast
  // A ring that races out to exactly BOMB_RADIUS, so you can SEE how far
  // the blast reached and learn where to aim the next shell.
  shockwaves.push({ x: x, y: y, life: 0 });
  playExplosionSound(true);
  for (const inv of invaders) {
    if (!inv.alive) continue;
    const dist = Math.hypot(inv.x - x, inv.y - y);
    if (dist > BOMB_RADIUS) continue;
    inv.hp -= dist <= BOMB_CORE ? 1 : 0.5;
    // Nothing walks away from a shell half-standing: anything knocked to
    // half health or below is finished off by the shock. So the blast
    // clears its whole radius, rather than leaving wounded animals behind.
    if (inv.hp <= 0.5) {
      inv.alive = false;
      spawnExplosion(inv.x, inv.y);
      score += 10;
    }
  }
}

const BOOM_COLORS = ["#ffffff", "#ffd34d", "#ff8c1a", "#ff4d4d"];
function spawnExplosion(x, y, scale = 1) {
  const count = Math.round(16 * scale);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (1 + Math.random() * 3.5) * scale;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0,
      maxLife: (18 + Math.random() * 16) * scale,
      color: BOOM_COLORS[Math.floor(Math.random() * BOOM_COLORS.length)],
    });
  }
}


// ---------------------------------------------------------------------
// THE SHOP — the ships you've earned, and the run that earned them.
// A ship unlocks when a SINGLE game scores at least its `need`. So the
// only number that matters is your best-ever run: beat 5,000 once and the
// TWIN BLASTER is yours forever, however badly the next game goes.
// It's remembered in localStorage (same as the high scores), so it's kept
// on THIS computer only.
// ---------------------------------------------------------------------
const BEST_KEY = "ai-best"; // the highest score you've ever managed in one game
const SHIP_KEY = "ai-ship"; // id of the ship you're flying

// Read them back, falling back to a sensible default if nothing is saved
// yet (or if it's somehow broken) so a bad save can never wedge you.
let bestRun = 0;
try { bestRun = Math.max(0, Number(localStorage.getItem(BEST_KEY)) || 0); } catch (e) {}

// Which ships that best run has earned you. Worked out from bestRun rather
// than kept in its own list, so the two can never disagree.
function unlocked(ship) { return bestRun >= ship.need; }

let shipId = "scout";
try {
  const saved = localStorage.getItem(SHIP_KEY);
  const ship = SHIPS.find((s) => s.id === saved);
  if (ship && unlocked(ship)) shipId = ship.id;
} catch (e) {}

function saveShop() {
  try {
    localStorage.setItem(BEST_KEY, String(bestRun));
    localStorage.setItem(SHIP_KEY, shipId);
  } catch (e) { /* private browsing etc. — just don't remember it */ }
}

// The ship you're currently flying.
function currentShip() {
  return SHIPS.find((s) => s.id === shipId) || SHIPS[0];
}

// Fly a ship you've earned. Locked ones simply don't budge, and the choice
// is saved straight away so closing the tab can't lose it.
function equipShip(ship) {
  if (!unlocked(ship)) return; // not earned yet — nothing happens
  if (ship.id === shipId) return;
  shipId = ship.id;
  // If you swapped ships mid-game, put the gun away with the old one —
  // otherwise a SCOUT could pick up a beam the RED LASER left burning.
  beamTimer = 0;
  beamCooldown = 0;
  saveShop();
  playShootSound(); // a little chirp to say "you're in this one now"
}

// ---------------------------------------------------------------------
// HIGH SCORES — a "leaderboard" of the best 20 games, kept on THIS
// computer (in the browser's localStorage, the same place the sound
// setting lives). It survives closing the tab, but it's per-device:
// there's no internet server, so it doesn't sync between people.
// Each entry is { name, score, stage }.
// ---------------------------------------------------------------------
const LB_KEY = "ai-scores"; // where the board is saved
const LB_MAX = 20;          // keep only the best 20

// Read the saved board back into an array (sorted best-first). If nothing
// is saved yet, or it's somehow broken, we just start with an empty board.
function loadScores() {
  try {
    const arr = JSON.parse(localStorage.getItem(LB_KEY)) || [];
    return arr.filter((e) => e && typeof e.score === "number");
  } catch (e) { return []; }
}
function saveScores(arr) {
  try { localStorage.setItem(LB_KEY, JSON.stringify(arr)); } catch (e) {}
}

// Does this score earn a place on the board? (Any score > 0 does while
// there are still free spots; after that it must beat the lowest entry.)
function scoreQualifies(s) {
  if (s <= 0) return false;
  const board = loadScores();
  return board.length < LB_MAX || s > board[board.length - 1].score;
}

// Add a finished game to the board, re-sort best-first, and trim to 20.
function recordScore(name, s, st) {
  const board = loadScores();
  board.push({ name: (name || "YOU").slice(0, 12), score: s, stage: st });
  board.sort((a, b) => b.score - a.score);
  board.length = Math.min(board.length, LB_MAX);
  saveScores(board);
}

// --- The "you made the board!" name box (an HTML pop-up, see the CSS) ---
const nameEntryEl = document.getElementById("nameentry");
const nameInputEl = document.getElementById("name");
const saveBtnEl   = document.getElementById("savescore");
const skipBtnEl   = document.getElementById("skipscore");

function showNameEntry() {
  enteringName = true;
  nameEntryEl.style.display = "block";
  // Pre-fill the name you used last time, so regulars can just hit SAVE.
  try { nameInputEl.value = localStorage.getItem("ai-name") || ""; } catch (e) {}
  nameInputEl.focus();
  nameInputEl.select();
}
function hideNameEntry() {
  if (nameEntryEl) nameEntryEl.style.display = "none";
}
function submitName() {
  if (!enteringName) return;
  const name = (nameInputEl.value || "YOU").trim().toUpperCase() || "YOU";
  try { localStorage.setItem("ai-name", name); } catch (e) {}
  recordScore(name, score, stage);
  lastEntry = { name: name, score: score, stage: stage };
  enteringName = false;
  hideNameEntry();
}
// Close the box WITHOUT saving — for when you'd rather not be on the board.
function dismissNameEntry() {
  if (!enteringName) return;
  enteringName = false;
  hideNameEntry();
}
// SAVE button, or Enter while typing, both lock in your name.
saveBtnEl.addEventListener("click", submitName);
// "No thanks" button skips saving and closes the box.
skipBtnEl.addEventListener("click", dismissNameEntry);
nameInputEl.addEventListener("keydown", (e) => {
  // Don't let these keys leak out to the game (e.g. Space restarting).
  e.stopPropagation();
  if (e.key === "Enter") submitName();
  if (e.key === "Escape") dismissNameEntry(); // Esc = "no thanks"
});

// Called once, the moment a game ends: work out whether this run was big
// enough to earn a new ship, remember it if it was your best ever, then —
// if the score is good enough — open the name box. The board itself is
// drawn on the game-over screen.
function onGameOver() {
  beamTimer = 0;            // switch the gun off, so no beam is left hanging
  beamCooldown = 0;         // over the game-over screen
  // Ships this run just earned: ones the run reached but your old best hadn't.
  justUnlocked = SHIPS.filter((s) => s.need > 0 && bestRun < s.need && score >= s.need);
  if (score > bestRun) {
    bestRun = score;
    saveShop();
  }
  if (scoreQualifies(score)) showNameEntry();
}

// ---------------------------------------------------------------------
// drawLeaderboard(): paint the top-20 list centred at x, starting at
// topY. Laid out in two columns of ten. If `highlight` matches an entry
// (the run you just finished), that line is drawn in gold.
// ---------------------------------------------------------------------
function drawLeaderboard(x, topY, highlight) {
  const board = loadScores();
  ctx.textAlign = "center";
  ctx.fillStyle = "#7ef9ff";
  ctx.font = "24px 'Courier New', monospace";
  ctx.fillText("HIGH SCORES", x, topY);

  if (board.length === 0) {
    ctx.fillStyle = "#888";
    ctx.font = "18px 'Courier New', monospace";
    ctx.fillText("No scores yet — be the first!", x, topY + 34);
    return;
  }

  ctx.font = "18px 'Courier New', monospace";
  const lineH = 24;
  const colW = 250;            // width of one column
  const colX = [x - colW / 2, x + colW / 2]; // left & right column centres
  let highlighted = false;     // only gold-light the FIRST match
  for (let i = 0; i < board.length; i++) {
    const e = board[i];
    const col = i < 10 ? 0 : 1;       // first ten left, next ten right
    const rowY = topY + 34 + (i % 10) * lineH;
    const isMe = !highlighted && highlight &&
                 e.name === highlight.name && e.score === highlight.score &&
                 e.stage === highlight.stage;
    if (isMe) highlighted = true;
    ctx.fillStyle = isMe ? "#ffd34d" : "#fff";
    const rank = String(i + 1).padStart(2, " ");
    const nm = e.name.padEnd(12, " ").slice(0, 12);
    const sc = String(e.score).padStart(5, " ");
    ctx.fillText(rank + ". " + nm + " " + sc, colX[col], rowY);
  }
}

// =====================================================================
// =====  SCREEN BUTTONS  — the tappable boxes on the start,  ==========
// =====  game-over and shop screens.                         ==========
// =====================================================================
// screenButtons() rebuilds the list for whatever screen you're looking
// at, and BOTH the painting and the tap test read that one list — so a
// button can never be drawn somewhere you can't actually press. A button
// with no `action` is just a label (like "FLYING THIS") and ignores taps.
const BTN_H = 54;
const BTN_STYLE = {
  normal: { edge: "#7ef9ff", fill: "rgba(126,249,255,0.15)", text: "#ffffff" },
  gold:   { edge: "#ffd34d", fill: "rgba(255,211,77,0.15)",  text: "#ffd34d" },
  quiet:  { edge: "#888888", fill: null,                     text: "#aaaaaa" },
  locked: { edge: "#555555", fill: null,                     text: "#666666" },
};

function button(x, y, w, label, action, style) {
  return { x: x, y: y, w: w, h: BTN_H, label: label, action: action, style: style };
}
// Lay out a row of equal-width buttons, centred across the screen.
function buttonRow(y, w, items) {
  const gap = 24;
  let x = (W - (items.length * w + (items.length - 1) * gap)) / 2;
  return items.map((it) => {
    const b = button(x, y, w, it.label, it.action, it.style);
    x += w + gap;
    return b;
  });
}

function screenButtons() {
  if (enteringName) return []; // the high-score name box owns the screen
  if (state === "start") {
    // Tucked into the gap between the bottom of the leaderboard and the
    // tops of the bases, so it never sits on top of the board or the game.
    return buttonRow(678, 200, [{ label: "SHOP", action: openShop, style: "quiet" }]);
  }
  if (state === "lost") {
    return buttonRow(600, 240, [
      { label: "PLAY AGAIN", action: () => newGame("playing") },
      { label: "SHOP", action: openShop },
    ]);
  }
  if (state === "shop") {
    // One button per ship: fly the ones you've earned, and a dead LOCKED
    // box on the ones you haven't.
    const rows = SHIPS.map((ship, i) => {
      const mine = unlocked(ship);
      const flying = ship.id === shipId;
      const label = flying ? "FLYING THIS" : mine ? "FLY THIS" : "LOCKED";
      const style = flying ? "gold" : mine ? "normal" : "locked";
      // Nothing to do if you're already flying it, or haven't earned it.
      const action = (flying || !mine) ? null : () => equipShip(ship);
      return button(616, shopCardY(i) + (SHOP_CARD_H - BTN_H) / 2, 198, label, action, style);
    });
    // If you stepped in from a game in progress, the only way out is back
    // into it — a "PLAY" that quietly threw your run away would be cruel.
    if (shopCameFrom === "playing") {
      return rows.concat(buttonRow(848, 260, [
        { label: "BACK TO GAME", action: closeShop },
      ]));
    }
    return rows.concat(buttonRow(848, 210, [
      { label: "BACK", action: closeShop, style: "quiet" },
      { label: "PLAY", action: () => newGame("playing") },
    ]));
  }
  return []; // no buttons while you're playing
}

// A rounded rectangle path, used for the buttons and the shop's ship cards.
function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawButtons() {
  ctx.lineWidth = 2;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "20px 'Courier New', monospace";
  for (const b of screenButtons()) {
    const s = BTN_STYLE[b.style] || BTN_STYLE.normal;
    roundRectPath(b.x, b.y, b.w, b.h, 8);
    if (s.fill) { ctx.fillStyle = s.fill; ctx.fill(); }
    ctx.strokeStyle = s.edge;
    ctx.stroke();
    ctx.fillStyle = s.text;
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
}

// ---------------------------------------------------------------------
// drawShop(): the ship shop — a screen of its own, with one card per
// ship showing what it looks like, what it does, and what it costs.
// ---------------------------------------------------------------------
const SHOP_CARD_TOP = 146; // where the first ship card starts
const SHOP_CARD_H   = 126; // how tall each card is
const SHOP_CARD_GAP = 10;  // the space between two cards
function shopCardY(i) { return SHOP_CARD_TOP + i * (SHOP_CARD_H + SHOP_CARD_GAP); }

function drawShop() {
  ctx.fillStyle = "rgba(0,0,0,0.82)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#7ef9ff";
  ctx.font = "42px 'Courier New', monospace";
  ctx.fillText("SHIP SHOP", W / 2, 70);
  ctx.fillStyle = "#ffd34d";
  ctx.font = "26px 'Courier New', monospace";
  ctx.fillText("BEST RUN: " + bestRun, W / 2, 106);
  ctx.fillStyle = "#888";
  ctx.font = "17px 'Courier New', monospace";
  ctx.fillText("Ships are earned by scoring big in ONE game", W / 2, 130);

  for (let i = 0; i < SHIPS.length; i++) {
    const ship = SHIPS[i];
    const y = shopCardY(i);
    const mine = unlocked(ship);
    const flying = ship.id === shipId;

    // The card itself — gold edge for the ship you're flying, a plain edge
    // for the ones you own, and a dim one for what you can't afford yet.
    roundRectPath(50, y, 780, SHOP_CARD_H, 12);
    ctx.fillStyle = flying ? "rgba(255,211,77,0.08)" : "rgba(255,255,255,0.05)";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = flying ? "#ffd34d" : mine ? "#7ef9ff" : "#444";
    ctx.stroke();

    // The row number you can press on a keyboard, then the ship itself.
    ctx.fillStyle = "#666";
    ctx.font = "19px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText(String(i + 1), 76, y + SHOP_CARD_H / 2);
    drawThing(ship.art, 140, y + SHOP_CARD_H / 2, 80,
              typeof ship.art === "string" ? -Math.PI / 4 : 0);

    // Its name, and what it does.
    ctx.textAlign = "left";
    ctx.fillStyle = mine ? "#fff" : "#bbb";
    ctx.font = "24px 'Courier New', monospace";
    ctx.fillText(ship.name, 198, y + 30);
    ctx.fillStyle = "#9aa6b2";
    ctx.font = "16px 'Courier New', monospace";
    for (let l = 0; l < ship.blurb.length; l++) {
      ctx.fillText(ship.blurb[l], 198, y + 58 + l * 22);
    }
    // How you get it — and, if you haven't yet, how close you've come.
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillStyle = flying ? "#ffd34d" : mine ? "#5fd66f" : "#777";
    ctx.fillText(flying ? "★ FLYING THIS ONE"
                 : mine ? (ship.need === 0 ? "✓ ALWAYS YOURS" : "✓ EARNED")
                 : "LOCKED — score " + ship.need + " in one game",
                 198, y + SHOP_CARD_H - 27);
    if (!mine) {
      // A bar creeping toward the score you need, so you can see how far off
      // your best run is rather than just being told "no".
      const barW = 250;
      const gone = Math.min(1, bestRun / ship.need);
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      ctx.fillRect(198, y + SHOP_CARD_H - 11, barW, 4);
      ctx.fillStyle = "#7ef9ff";
      ctx.fillRect(198, y + SHOP_CARD_H - 11, barW * gone, 4);
      ctx.fillStyle = "#666";
      ctx.font = "13px 'Courier New', monospace";
      ctx.fillText("best so far: " + bestRun, 198 + barW + 10, y + SHOP_CARD_H - 8);
    }
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#888";
  ctx.font = "17px 'Courier New', monospace";
  ctx.fillText("Tap a ship you've earned to fly it (or press 1–" + SHIPS.length + ")" +
               "   •   Esc goes back", W / 2, 922);
}

// drawReloadBar(): a little bar under the ship that fills back up as a
// slow gun reloads, so you know exactly when you can fire again.
function drawReloadBar(done, color) {
  const full = CELL;
  const y = player.y + CELL / 2 + 6;
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(player.x - full / 2, y, full, 4);
  ctx.fillStyle = color;
  ctx.fillRect(player.x - full / 2, y, full * done, 4);
}

// ---------------------------------------------------------------------
// drawIcons(): the two little toggles tucked under the score at the
// top-left — sound and pause. Drawn as their own step because the PAUSED
// screen dims everything and then paints them back on top, so the ▶ you
// need in order to un-pause stays bright and tappable.
// ---------------------------------------------------------------------
function drawIcons() {
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.font = "26px serif";
  // Sound: tap it (or press M) to mute/un-mute. Dimmed when sound is off.
  ctx.globalAlpha = soundOn ? 1 : 0.45;
  ctx.fillText(soundOn ? "🔊" : "🔇", SOUND_ICON.x, SOUND_ICON.y + SOUND_ICON.h / 2);
  // Pause: shows ⏸ while the game is running and ▶ while it's paused —
  // i.e. what the button will DO next. Then ⏮, which starts the stage you're
  // on again. Both only appear mid-game, since there's nothing to pause or
  // restart on the start and game-over screens.
  ctx.globalAlpha = 1;
  if (state === "playing") {
    ctx.fillText(paused ? "▶️" : "⏸️", PAUSE_ICON.x, PAUSE_ICON.y + PAUSE_ICON.h / 2);
    ctx.fillText("⏮️", RESTART_ICON.x, RESTART_ICON.y + RESTART_ICON.h / 2);
    ctx.fillText("🛒", SHOP_ICON.x, SHOP_ICON.y + SHOP_ICON.h / 2);
  }
}

// ---------------------------------------------------------------------
// draw(): the "showing" half of the game loop. Paints everything.
// ---------------------------------------------------------------------
function draw() {
  // Wipe the screen clear each frame. We clear to TRANSPARENT (not black)
  // so the moving starfield behind the game shows through.
  ctx.clearRect(0, 0, W, H);

  // The shop is a screen all of its own — no game board behind it. (The
  // 🔊 still comes along, so you can mute while you're browsing.)
  if (state === "shop") {
    drawShop();
    drawIcons();
    ctx.globalAlpha = 1;
    drawButtons();
    return;
  }

  // The HUD: score (left), stage (centre), lives (right) at the top.
  ctx.fillStyle = "#fff";
  ctx.font = "20px 'Courier New', monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("SCORE: " + score, 12, 28);
  ctx.textAlign = "center";
  ctx.fillText("STAGE " + stage, W / 2, 28);
  ctx.textAlign = "right";
  ctx.fillText("LIVES: " + "❤️".repeat(lives), W - 12, 28);

  // The sound and pause toggles, under the score at the top-left.
  drawIcons();
  ctx.globalAlpha = 1;

  // Draw the animals — but NOT on the start screen, where the herd would
  // show through behind the title and high scores and look cluttered. The
  // start screen has its own tidy row of animals instead.
  if (state !== "start") {
    for (const inv of invaders) {
      if (!inv.alive) continue;
      // An animal that's been winged but not downed (the RAPID FIRE ship's
      // half-strength bullets take two) fades, so you can see it's hurt.
      ctx.globalAlpha = inv.hp < 1 ? 0.5 : 1;
      drawThing(inv.animal, inv.x, inv.y);
      ctx.globalAlpha = 1;
      // An animal being held in the RED LASER's beam glows redder and redder
      // until it melts — so you can see the beam working, and see it cool off
      // again if you swing away too soon.
      if (inv.heat > 0) {
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.75 * (inv.heat / BEAM_BURN);
        ctx.fillStyle = "#ff3b3b";
        ctx.fillRect(inv.x - CELL / 2, inv.y - CELL / 2, CELL, CELL);
        ctx.restore();
      }
    }
  }

  // Draw the bases (only the blocks that are still alive).
  ctx.fillStyle = BASE_COLOR;
  for (const base of bases) {
    for (const blk of base.blocks) {
      if (blk.alive) {
        ctx.fillRect(blk.x - BASE_BLOCK / 2, blk.y - BASE_BLOCK / 2, BASE_BLOCK, BASE_BLOCK);
      }
    }
  }

  // Draw your bullets as glowing vertical streaks (like little lasers).
  ctx.strokeStyle = BULLET_COLOR;
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.shadowColor = BULLET_COLOR;
  ctx.shadowBlur = 8;
  for (const b of bullets) {
    if (b.bomb) continue;                 // shells are drawn as balls, below
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x, b.y + BULLET_LENGTH); // streak trails BELOW as it flies up
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  // BLAST CANNON shells are fat glowing balls, so you can tell at a glance
  // that something is about to go bang.
  for (const b of bullets) {
    if (!b.bomb) continue;
    ctx.save();
    ctx.shadowColor = "#ff8c1a";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "#ffd23d";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ff8c1a";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Draw the falling shots — each one is its animal's own thing.
  for (const m of shots) drawThing(m.emoji, m.x, m.y, 28);

  // The RED LASER's beam: a soft red glow with a white-hot core, running
  // from the ship's nose to the top of the screen. It's drawn in "lighter"
  // mode so it ADDS light to whatever it crosses rather than painting over
  // it, and it shimmers a little so it reads as live energy.
  const noseY = player.y - CELL / 2;
  if (beamTimer > 0) {
    const flicker = 0.85 + 0.15 * Math.sin(beamTimer * 0.9);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.shadowColor = "#ff2d2d";
    ctx.shadowBlur = 24;
    ctx.globalAlpha = 0.5 * flicker;
    ctx.fillStyle = "#ff2d2d";
    ctx.fillRect(player.x - BEAM_WIDTH, 0, BEAM_WIDTH * 2, noseY);      // outer glow
    ctx.globalAlpha = 0.85 * flicker;
    ctx.fillStyle = "#ff6b6b";
    ctx.fillRect(player.x - BEAM_WIDTH / 2, 0, BEAM_WIDTH, noseY);      // the beam itself
    ctx.globalAlpha = flicker;
    ctx.fillStyle = "#ffe9e9";
    ctx.fillRect(player.x - 3, 0, 6, noseY);                            // white-hot core
    ctx.restore();
  } else if (beamCooldown > 0) {
    drawReloadBar(1 - beamCooldown / BEAM_RELOAD, "#ff6b6b");
  } else if (currentShip().fire === "bomb" && gunTimer > 0) {
    // The BLAST CANNON gets the same little bar — half a second is long
    // enough that you want to see the next shell coming.
    drawReloadBar(1 - gunTimer / BOMB_RELOAD, "#ffd23d");
  }
