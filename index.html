<!DOCTYPE html>
<!--
  ===================================================================
   ANIMAL INVADERS  🐄🍼
  ===================================================================
  Hi! This is YOUR game. You invented it, and you can change it.

  Everything you'll want to change first lives in the
  "CHANGE THESE TO CUSTOMISE YOUR GAME!" block just below, inside
  the <script> down the page. Look for the big green-comment box.

  To play: just double-click this file to open it in your web browser.
  No installing anything. No internet needed.

  Controls:
    - Move:  Left / Right arrow keys  (or A and D)
    - Shoot: Spacebar
    - Restart after winning/losing: press Enter
  ===================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- Add the game to an iPad or iPhone Home Screen and these make it open as a
     game rather than a web page: no address bar, no toolbar. That matters for
     more than tidiness — Safari's bar eats about a tenth of the height, and
     the game is as big as the height allows, so losing the bar makes
     everything on screen about a tenth bigger. The status bar is left black
     and opaque (not "black-translucent") so the clock never sits on top of
     your score. Ignored completely when the game is opened as a normal tab. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Animal Invaders">
<meta name="theme-color" content="#000000">
<title>Animal Invaders</title>
<style>
  /* Simple retro look. Black space background, white pixel-y text. */
  html, body {
    margin: 0;
    height: 100%;
    color: #fff;
    font-family: "Courier New", monospace;
    /* Stops the arrow keys from scrolling the page while you play. */
    overflow: hidden;
  }
  /* Black goes on <html> ONLY. If we put it on <body> too, the body's
     background would paint OVER the star canvas (which sits at z-index -1)
     and hide it. The root background paints furthest back, behind the stars. */
  html { background: #000; }
  /* Centre the game on the screen. */
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Centre the game in the space you can SEE — same reason as the dvh on
       #game below. On an iPhone or iPad, 100% here is the taller page with
       Safari's bar hidden, which pushes the game down out of view. */
    height: 100%;
    height: 100dvh;
  }
  #game {
    /* Fit the game inside the screen on ANY device, keeping its shape.

       We let the BROWSER do the fitting. A <canvas> already knows it is
       880 by 960, so giving it a largest width and a largest height and
       leaving both sizes on "auto" makes the browser shrink it until it
       fits inside both — keeping its shape exactly, the way a photo fits
       in a frame. Never squashed, never cut off.

       This used to be worked out by hand, as min(100vw, 91.67vh), and it
       cut the top off the game on an iPad. 91.67vh is 100vh × (880 ÷ 960),
       so the game came out EXACTLY 100vh tall on any screen wider than it
       is tall — not a pixel to spare. And on an iPhone or an iPad, 100vh
       is not what you can see: it is how tall the page would be if
       Safari's address bar were hidden. With the bar showing, the game was
       taller than the space for it, and the score along the top was cut
       off the screen. "dvh" is the honest one — d for dynamic — and it
       means the height you can actually see right now. Plain vh is left in
       first for older browsers, which ignore the dvh line below it.

       Transparent background so the moving stars show through behind it. */
    display: block;
    /* Work the width out from the height, and let the height be all of the
       screen you can see. Written as a min() of the two so whichever runs out
       first decides: on a wide screen the height does, and on a narrow phone
       the width does. 11/12 is 880/960 exactly — the shape of the board.

       It has to be done this way round rather than with max-width/max-height,
       because a canvas has a natural size (880 by 960) and those only ever
       shrink it to fit — never grow it. On a big screen that left the game
       stuck at 880 across with the rest of the screen empty.

       The 2px is the whole safety margin. A fit with NOTHING spare is what cut
       the score off the top of the iPad before: this arithmetic lands on
       exactly the height of the screen, and a fraction of a pixel of rounding
       is enough to tip it over the edge and have it clipped. */
    width: min(100vw, calc((100vh - 2px) * 11 / 12));
    width: min(100vw, calc((100dvh - 2px) * 11 / 12));
    height: auto;
    background: transparent;
    /* The 880px canvas is scaled to fit your screen. By default the browser
       BLURS that scaling; "pixelated" keeps the pixel-art sprites crisp. */
    image-rendering: pixelated;
    image-rendering: crisp-edges; /* fallback name some browsers use */
  }
  /* The starfield sits behind EVERYTHING, filling the whole window. */
  #stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    display: block;
  }
  /* Controls line, pinned to the bottom so it doesn't shrink the game. */
  p {
    color: #888;
    font-size: 14px;
    position: fixed;
    bottom: 6px;
    left: 0;
    right: 0;
    text-align: center;
    margin: 0;
    pointer-events: none;
  }
  /* On-screen buttons for phones/tablets. Hidden on mouse computers;
     shown only on touch screens (where the pointer is "coarse"). */
  #touch { display: none; }
  #touch button {
    position: fixed;
    bottom: 20px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 24px;
    font-family: inherit;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none; /* stops scrolling/zooming when you press a button */
  }
  #touch button:active { background: rgba(255, 255, 255, 0.3); }
  /* FIRE on the LEFT, the ◀ ▶ arrows on the RIGHT. */
  #btn-fire  { left: 20px; font-size: 28px; }
  #btn-right { right: 20px; }
  #btn-left  { right: 88px; }
  @media (pointer: coarse) {
    #touch { display: block; }
    p { display: none; } /* keyboard hints don't help on a touch screen */
  }
  /* Name-entry box — pops up over the game ONLY when you earn a spot on the
     high-score board. An HTML <input> is used (instead of drawing on the
     canvas) so it works everywhere: a real keyboard on computers, and the
     pop-up keyboard on phones/tablets. Hidden until you qualify. */
  #nameentry {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #7ef9ff;
    border-radius: 10px;
    padding: 22px 26px;
    text-align: center;
    z-index: 10;
  }
  #nameentry .title { color: #ffd34d; font-size: 22px; margin-bottom: 14px; }
  #nameentry input {
    font-family: inherit;
    font-size: 22px;
    text-align: center;
    text-transform: uppercase;
    width: 220px;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #888;
    background: #111;
    color: #fff;
    outline: none;
  }
  #nameentry button {
    display: block;
    margin: 14px auto 0;
    font-family: inherit;
    font-size: 18px;
    padding: 8px 26px;
    border-radius: 6px;
    border: 1px solid #7ef9ff;
    background: rgba(126, 249, 255, 0.15);
    color: #fff;
    cursor: pointer;
  }
  #nameentry button:active { background: rgba(126, 249, 255, 0.35); }
  /* The "No thanks" dismiss — quieter than SAVE, so it reads as the
     secondary choice. Closes the box without recording a score. */
  #nameentry .skip {
    margin-top: 8px;
    font-size: 14px;
    padding: 6px 18px;
    border-color: #888;
    background: transparent;
    color: #aaa;
  }
  #nameentry .skip:active { background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>
<!-- The space we're flying through. Lives behind the game. -->
<canvas id="stars"></canvas>
<div id="wrap">
  <canvas id="game" width="880" height="960"></canvas>
  <p>Move: ← →  (or A / D) &nbsp;•&nbsp; Shoot: Space &nbsp;•&nbsp; Pause: P &nbsp;•&nbsp; Start over: R &nbsp;•&nbsp; Play again: Enter &nbsp;•&nbsp; Shop: S &nbsp;•&nbsp; Sound: M &nbsp;•&nbsp; Full screen: F</p>
</div>

<!-- Pops up only when you make the high-score top 20. See the CSS above. -->
<div id="nameentry">
  <div class="title">⭐ NEW HIGH SCORE! ⭐</div>
  <input id="name" maxlength="12" placeholder="YOUR NAME" autocomplete="off" spellcheck="false">
  <button id="savescore">SAVE</button>
  <button id="skipscore" class="skip">No thanks</button>
</div>

<!-- Touch controls — only visible on phones/tablets (see the CSS above). -->
<div id="touch">
  <button id="btn-left" aria-label="Move left">◀</button>
  <button id="btn-right" aria-label="Move right">▶</button>
  <button id="btn-fire" aria-label="Shoot">🔥</button>
</div>

<script>
// =====================================================================
// =====  PIXEL ART  — the little hand-drawn sprites.  =================
// =====================================================================
// Every animal, the rocket, and each falling shot is drawn as "pixel
// art": a small grid where each letter is one fat pixel of colour, and a
// dot (".") is see-through. SPRITE_PAL says what colour each letter is.
// Want to recolour the cow? Change a letter in COW_ART, or tweak a colour
// in SPRITE_PAL. (You can also still use a plain emoji instead of a sprite
// anywhere below — both work.)
const SPRITE_PAL = {
  '.': null,
  'W': '#f2f2f2', 'G': '#9aa6b2', 'K': '#1c1c20', 'R': '#e23b3b',
  'C': '#74e8ff', 'D': '#176a73', 'P': '#ffa6b8', 'N': '#c23a5e',
  'H': '#e8d49a', 'O': '#ff8c1a', 'Y': '#ffd23d', 'B': '#8a5a2c',
  'T': '#c98f5f', 'o': '#ff7fa3', 'm': '#6e4a25', 's': '#d9dde2',
  'r': '#8c1f1f', 'L': '#ffd7d7', // deep red & hot laser-white, for the ships
  'g': '#6fe08a', 'v': '#a86cf0', // green & violet, for two of the ships
  'e': '#2ea8ff',                 // electric blue, for the ELECTRIC ARC
  'f': '#ffec99', 'a': '#e0a51e', // pale fluff & deep yellow, for the BIG CHICK
};
// spr(): wraps a grid of strings so the game knows "this is a sprite".
function spr(rows) { return { isPixel: true, rows: rows }; }

const ROCKET_ART = spr([
  "......R......", ".....RRR.....", "....RRRRR....", "...RRRRRRR...",
  "...WsssssW...", "..WsssssssW..", "..WsDDDDDsW..", "..WsDCCCDsW..",
  "..WsDCCCDsW..", "..WsDDDDDsW..", "..WsssssssW..", "..WsssssssW..",
  ".RRsssssssRR.", "RRRsssssssRRR", "R..WsssssW..R", "...GGGGGGG...",
  "....OOOOO....", ".....OYO.....",
]);
// The two ships you can buy in the shop. Same 13×18 grid as the rocket
// above, so they all sit the same way on screen.
const TWIN_ROCKET_ART = spr([
  "..Y.......Y..", "..Y.......Y..", "..Y..YYY..Y..", "..YYYYYYYYY..",
  "..YsssssssY..", ".WsssssssssW.", ".WsDDDDDDDsW.", ".WsDCCCCCDsW.",
  ".WsDCCCCCDsW.", ".WsDDDDDDDsW.", ".WsssssssssW.", ".WsssssssssW.",
  "YYsssssssssYY", "YYYsssssssYYY", "Y..WsssssW..Y", "...GGGGGGG...",
  "...OOOOOOO...", "....OYYYO....",
]);
const RAPID_ROCKET_ART = spr([
  "......g......", "......g......", ".....ggg.....", "....ggggg....",
  "...gg...gg...", "..ggWWWWWgg..", "..ggWDDDWgg..", "..ggWDCDWgg..",
  "..ggWDDDWgg..", "..ggWWWWWgg..", "..ggsssssgg..", ".gggsssssggg.",
  "ggg.sssss.ggg", "gg..sssss..gg", "g...WsssW...g", "...GGGGGGG...",
  "....OOOOO....", ".....OYO.....",
]);
const BOMB_ROCKET_ART = spr([
  "....vvvvv....", "...vvvvvvv...", "..vvvvvvvvv..", "..vvOOOOOvv..",
  "..vvOYYYOvv..", "..vvOOOOOvv..", ".vvvWWWWWvvv.", ".vvvWDDDWvvv.",
  ".vvvWDCDWvvv.", ".vvvWDDDWvvv.", ".vvvWWWWWvvv.", ".vvvsssssvvv.",
  "vvv.sssss.vvv", "vv..sssss..vv", "v...WsssW...v", "...GGGGGGG...",
  "....OOOOO....", ".....OYO.....",
]);
const LASER_ROCKET_ART = spr([
  "......L......", ".....LLL.....", "....RLLLR....", "...RRRLRRR...",
  "..RRRRRRRRR..", "..RrWWWWWrR..", "..RrWDDDWrR..", "..RrWDCDWrR..",
  "..RrWDDDWrR..", "..RrWWWWWrR..", "..RrsssssrR..", ".RRrsssssrRR.",
  "RRRrsssssrRRR", "RR.rsssssr.RR", "R...WsssW...R", "...GGGGGGG...",
  "....ORRRO....", ".....RYR.....",
]);
const VOLT_ROCKET_ART = spr([
  "......Y......", ".....YCY.....", "....YCCCY....", "...eeCCCee...",
  "..eeCCCCCee..", "..eeWWWWWee..", "..eeWDDDWee..", "..eeWDCDWee..",
  "..eeWDDDWee..", "..eeWWWWWee..", "..eesssssee..", ".eeessssseee.",
  "eee.sssss.eee", "ee..sssss..ee", "e...WsssW...e", "...GGGGGGG...",
  "....CCCCC....", ".....CYC.....",
]);
const COW_ART = spr([
  ".HH.......HH.", "HHKH.....HKHH", ".KWWWWWWWWWK.", ".WWKKWWWKKWW.",
  "WWWKKWWWKKWWW", "WWWWWWWWWWWWW", "WWKWWWWWWWKWW", ".WWWWWWWWWWW.",
  "..PPPPPPPPP..", "..PNPPPPPNP..", "..PPPPPPPPP..", "...PPPPPPP...",
  "....PPPPP....",
]);
const CHICKEN_ART = spr([
  "....R.R......", "...RRRRR.....", "..WWWWWWWW...", ".WWWWWWWWWW..",
  ".WWKKWWKKWW..", ".WWKKWWKKWW..", ".WWWWOOWWWW..", ".WWWOOOOWWW..",
  ".WWWWOOWWWW..", ".WWWRRRRWWW..", "..WWRRRRWW...", "...WWWWWW....",
]);
const PIG_ART = spr([
  ".oo.......oo.", "oooo.....oooo", ".ooooooooooo.", "ooooooooooooo",
  "ooKKoooooKKoo", "ooKKoooooKKoo", "oooPPPPPPPooo", "oooPKPPPKPooo",
  "oooPPPPPPPooo", ".ooooooooooo.", "..ooooooooo..", "...ooooooo...",
]);
const MONKEY_ART = spr([
  "...BBBBBBB...", ".BBBBBBBBBBB.", "BBBBBBBBBBBBB", "BBBTTTTTTTBBB",
  "BBTTTTTTTTTBB", "BBTKKTTTKKTBB", "BBTKKTTTKKTBB", "BBTTTTTTTTTBB",
  "BBTTTKTKTTTBB", "BBBTTTTTTTBBB", ".BBTTTTTTTBB.", "..BBBBBBBBB..",
]);
const PENGUIN_ART = spr([
  "...KKKKKKK...", "..KKKKKKKKK..", ".KKKKKKKKKKK.", ".KKWWWWWWWKK.",
  ".KWWKWWWKWWK.", ".KWWWOOOWWWK.", ".KWWWOOOWWWK.", "KKWWWWWWWWWKK",
  "KKWWWWWWWWWKK", "KKKWWWWWWWKKK", ".K.WWWWWWW.K.", "...WWWWWWW...",
  "...OO...OO...",
]);
// THE BIG CHICK — the boss. Just a baby, but the size of a house: a fluffy
// round chick still wearing the top of its egg as a hat. It's drawn on a much
// bigger grid than the other animals because it's drawn much bigger, so it
// has room for proper eyes and a beak instead of a few fat blocks.
const BIG_CHICK_ART = spr([
  ".......WWWWWWWW.......",   // the top of its egg, still stuck on its head,
  "......WWWWWWWWWW......",
  "......W.WW.WW.WW......",   // ...cracked along the bottom where it hatched
  ".......ffffffff.......",   // fluff peeking out from under it
  ".....ffffffffffff.....",
  "....ffffffffffffff....",
  "...YYYYYYYYYYYYYYYY...",
  "..YYYYYYYYYYYYYYYYYY..",
  "..YYYKKKYYYYYYKKKYYY..",   // two enormous eyes
  "..YYYKWKYYYYYYKWKYYY..",
  ".YYYYKKKYYYYYYKKKYYYY.",
  ".YYYYYYYYOOOOYYYYYYYY.",   // and a beak
  ".YYYYYYYYOOOOYYYYYYYY.",
  "..YYYYYYYYOOYYYYYYYY..",
  "..YYaaaYYYYYYYYaaaYY..",   // stubby little wings it can't fly with
  "..YYaaaaYYYYYYaaaaYY..",
  "...YYaaaYYYYYYaaaYY...",
  "....YYYYYYYYYYYYYY....",
  "......OO......OO......",   // and two skinny legs
  ".....OOOO....OOOO.....",
]);
// The eggs it throws. Bigger than a chicken's, and already cracking.
const BOSS_EGG_ART = spr([
  "....WWW....", "..WWWWWWW..", ".WWWWWWWWW.", ".WWWWRWWWW.",
  "WWWWRRRWWWW", "WWWWWRWWWWW", "WWWWRRRWWWW", "WWWWWRWWWWW",
  ".WWWWRWWWW.", ".WWWWWWWWW.", "..WWWWWWW..", "...WWWWW...",
  "....WWW....",
]);

// The five things the animals throw at you.
const MILK_ART = spr([
  "...WW....", "...WW....", "..WWWW...", ".WWWWWW..", ".WWCCWW..",
  ".WWWWWW..", ".WWWWWW..", ".WWWWWW..", "..WWWW...",
]);
const EGG_ART = spr([
  "...WWW...", "..WWWWW..", ".WWWWWWW.", ".WWWWWWW.", ".WWWWWWW.",
  ".WWWWWWW.", "..WWWWW..", "...WWW...", ".........",
]);
const MUD_ART = spr([
  "....m....", "...mmm...", "..mmmmm..", "...mmm...", "..mmmmm..",
  ".mmmmmmm.", ".mmmmmmm.", "mmmmmmmmm", ".........",
]);
const BANANA_ART = spr([
  "...YYK...", "..YYY....", ".YYY.....", ".YY......", ".YYY.....",
  "..YYY....", "...YYK...", ".........", ".........",
]);
const ICE_ART = spr([
  ".CCCCCCC.", "CCCCCCCCC", "CCWWCCCCC", "CCWCCCCCC", "CCCCCCCCC",
  "CCCCCCCCC", "CCCCCCCCC", ".CCCCCCC.", ".........",
]);

// =====================================================================
// =====  CHANGE THESE TO CUSTOMISE YOUR GAME!  ========================
// =====================================================================
//
// These are the things that are the most fun to change. Try swapping
// the sprites (or use an emoji like "🐸"!) for different ones, or change
// the numbers, then save the file and re-open it to see what happens!

// The animals that invade, and what each one shoots. The herd is built
// from a RANDOM mix of these, so every game looks different! Each pair is
// a pixel-art sprite from up above — swap in your own, or an emoji string.
const ANIMALS = [
  { animal: COW_ART,     shot: MILK_ART   }, // cow shoots milk
  { animal: CHICKEN_ART, shot: EGG_ART    }, // chicken shoots eggs
  { animal: PIG_ART,     shot: MUD_ART    }, // pig shoots mud
  { animal: MONKEY_ART,  shot: BANANA_ART }, // monkey shoots bananas
  { animal: PENGUIN_ART, shot: ICE_ART    }, // penguin shoots ice
];
const PLAYER     = ROCKET_ART;   // your starting ship (or an emoji)

// HOW FAST THE WHOLE GAME PLAYS. 1 is the speed it was designed at; 2 plays it
// at double speed, 0.5 at half. Try 3 if you're feeling brave.
//
// This is one number for the pace of EVERYTHING — the herd, your ship, the
// bullets, how quickly guns reload, how long a beam burns. That is exactly why
// it is safe to change: it speeds up the whole game together, so nothing gets
// easier or harder RELATIVE to anything else. Only the clock moves.
//
// (2 is here because for a long time the game ran at double speed on a 120Hz
// screen by accident — one step per screen refresh — and that turned out to be
// the pace everybody liked. Now every device plays at it.)
const GAME_SPEED = 2;

// Every gun in the game is timed in steps, and the shop tells you what that is
// in seconds. These two work the seconds out from the steps, so that turning
// GAME_SPEED up can never leave the shop telling you a beam burns for three
// seconds when it burns for one and a half.
function secs(steps) {
  const t = steps / 60 / GAME_SPEED;
  return (t < 1 ? t.toFixed(2).replace(/0+$/, "").replace(/\.$/, "") : +t.toFixed(1)) + "s";
}
function aSecond(everySteps) {
  return Math.round(60 * GAME_SPEED / everySteps);
}
const BULLET_COLOR  = "#7ef9ff"; // colour of YOUR laser streaks — try "#ff5", "#f6f"
const BULLET_LENGTH = 22;  // how long your shots look (bigger = longer streaks)

// --- The shop: ships you EARN by scoring big ---
// Each ship needs a score of `need` in ONE game — not added up over lots of
// games, all in a single run. Manage it once and the ship is yours for good:
// visit the SHOP after a game to fly it. Make `need` smaller if you'd like to
// reach the good ships sooner!
// How often each gun can shoot, in frames (60 frames = one second), and
// how far the BLAST CANNON's explosion reaches.
const RAPID_EVERY = 12;  // between RAPID FIRE shots (12 = five a second at GAME_SPEED 1)
const BOMB_RELOAD = 30;  // between BLAST CANNON shells (30 = half a second at GAME_SPEED 1)
const BOMB_RADIUS = 95;  // how far the blast reaches, in pixels
const BOMB_CORE   = 44;  // inside this it's full strength; past it, half
const BOMB_BOOM   = 3.4; // how big the bang LOOKS (bigger = more flying bits)
// What one shell takes off. An ordinary animal has 1 health, so anything from
// 1 up downs it outright and this number never showed — it only starts to
// matter against something with real health, like the BIG CHICK boss.
const BOMB_DAMAGE = 3;
const BOMB_RING   = 20;  // frames the shockwave ring takes to reach full size

// --- The two beam guns ---
// A beam ship holds one button down and pours out a beam for `time` frames,
// then reloads for `reload`. Animals don't pop the moment it touches them:
// they have to be HELD in it for `burn` frames, and they cool off again as
// soon as you swing away. `drag` is how slowly you steer while it's lit, and
// `arc` is how far the current jumps sideways to animals beside the beam
// (0 = it doesn't jump at all).
const BEAM_TIME    = 180;  // steps the red beam burns for (180 = 3s at GAME_SPEED 1)
const BEAM_RELOAD  = 60;   // frames it reloads for afterwards (60 = 1 second)
const BEAM_WIDTH   = 18;   // how wide the beam's bright core is, in pixels
const BEAM_BURN    = 16;   // frames an animal must be held in the beam before it melts
const BEAM_DRAG    = 0.65; // how much of your usual speed you steer at while firing
const LASER_BEAM = {
  time: BEAM_TIME, reload: BEAM_RELOAD, width: BEAM_WIDTH,
  burn: BEAM_BURN, drag: BEAM_DRAG, arc: 0,
  color: "#ff4d4d", glow: "rgba(255,60,60,0.28)",
};
// The ELECTRIC ARC burns longer, and its current WALKS out sideways through
// the herd instead of stopping at the beam. `arc` is one hop, `hops` is how
// many hops it can make, and each hop keeps only `jump` of the punch the hop
// before it had — so the animals beside the beam take half, the ones past
// them a quarter, and the ones past THOSE an eighth. Three hops is as far as
// it goes: an eighth still finishes an animal inside one burn, but a fourth
// hop would be too weak to finish anything, so it would be all show and no
// bite. That fall-off is what stops one burn taking the whole wave. This is
// also the heaviest gun in the game to steer.
const BOLT_TIME    = 300;  // steps the electric beam burns for (300 = 5s at GAME_SPEED 1)
const BOLT_RELOAD  = 60;   // frames it reloads for afterwards (60 = 1 second)
const BOLT_ARC     = 76;   // how far the current jumps in one hop, in pixels
const BOLT_JUMP    = 0.5;  // how much of the last hop's punch the next one keeps
const BOLT_HOPS    = 3;    // how many animals out from the beam it can walk
const VOLT_BEAM = {
  time: BOLT_TIME, reload: BOLT_RELOAD, width: BEAM_WIDTH,
  burn: 26, drag: 0.55, arc: BOLT_ARC, jump: BOLT_JUMP, hops: BOLT_HOPS,
  color: "#7ef9ff", glow: "rgba(126,249,255,0.26)", jagged: true,
};

// `damage` is how much of an animal one bullet takes off. Animals have 1
// health to begin with, so damage 1 downs them in a single hit and 0.5 takes
// two — and past stage TOUGH_AFTER they have 2, so it's two hits and four.
const SHIPS = [

// --- The numbers you'll reach for first ---
const ROWS        = 4;     // how many rows of animals
const COLS        = 8;     // how many animals in each row
const INVADER_SPEED = 0.6; // how fast the herd slides sideways (bigger = faster)
const MAX_SHOTS     = 3;   // most shots falling at ONCE (the real Space Invaders only allows 3!)
const SHOT_RELOAD   = 45;  // frames to wait between shots (smaller = they shoot more often)
const SHOT_ANGLE    = 1.2; // how far sideways a stray (un-aimed) shot drifts
const AIM_CHANCE    = 0.5; // chance (0–1) a shot is AIMED at you — bigger = sharper shooters
const AIM_MAX       = 2.5; // how sharply an aimed shot can angle toward you
const PLAYER_SPEED  = 4;   // how fast your ship moves (bigger = faster)
const PLAYER_BULLET_SPEED = 5; // how fast your shots fly up
const SHOT_SPEED    = 2; // how fast the animals' shots fall down
const STARTING_LIVES = 3;  // how many tries you get
const SAFE_TIME     = 90;  // frames you flash & can't be hit after losing a life

// --- Stages: clear the herd without dying and a new, faster wave begins ---
const STAGE_SPEEDUP = 0.12; // each stage everything gets this much faster (0.12 = 12%)
const STAGE_BONUS   = 100;  // bonus points for clearing a stage
const BANNER_TIME   = 100;  // frames the big "STAGE N" banner shows for

// --- Tougher animals once you're past the boss ---
// Beat the BIG CHICK and the herd comes back HARDIER. From stage 16 on, every
// ordinary animal has twice the health, so most guns need two hits where one
// used to do. (The boss keeps its own BOSS_HP either way.)
const TOUGH_AFTER = 15; // stages ABOVE this one get the tougher herd
const TOUGH_HP    = 2;  // how much health those animals have (1 is normal)

// --- THE BIG CHICK: the boss ---
// Every BOSS_EVERY stages there's no herd at all. Instead one ginormous baby
// chicken comes down on its own, and it takes BOSS_HP hits to see off — where
// an ordinary animal takes one. It sweeps side to side, gets angrier and
// faster the more you hurt it, and lays clutches of EGGS THAT EXPLODE: an egg
// that lands blows a hole in whatever it lands on, so you can't just hide.
const BOSS_EVERY   = 15;  // the boss turns up on stage 15, 30, 45...
const BOSS_HP      = 45;  // how many hits it takes (an ordinary animal takes 1)
const BOSS_SIZE    = 260; // how big it is drawn, in pixels — the player is 40
const BOSS_TOP     = 190; // how far down the screen it starts
const BOSS_SPEED   = 0.9; // how fast it sweeps to begin with
const BOSS_RAGE    = 1.6; // how much FASTER it sweeps once nearly beaten
const BOSS_DROP    = 5;   // how far it comes down each time it turns around
const BOSS_POINTS  = 500; // what beating it is worth
const BOSS_CLUTCH  = 3;   // how many eggs it lays at once
const BOSS_RELOAD  = 110; // frames between clutches (smaller = more eggs)
const EGG_RADIUS   = 60;  // how far an exploding egg's blast reaches, in pixels
const EGG_BOOM     = 2.6; // how big the bang LOOKS

// --- The bases (shields) you can hide behind ---
const BASE_COUNT   = 3;    // how many bases there are
const BASE_COLOR   = "#5fd66f"; // their colour — try "#7ec8ff" or "#ffd34d"
const BASE_BLOCKS_W = 9;   // how many little blocks wide each base is
const BASE_BLOCKS_H = 5;   // how many little blocks tall each base is
const BASE_BLOCK   = 12;   // size of one little block, in pixels

// --- Want to use your OWN drawing instead of an emoji? ---
// Easy! It takes one line.
//   1. Make a picture in a sprite tool (like Sprite AI or OpenArt) and
//      save the PNG next to this file. A "sprites" folder is fine too,
//      e.g. save it as  sprites/cow.png
//   2. Swap an emoji above for a loadImage(...), e.g. change the cow to:
//        { animal: loadImage("sprites/cow.png"), shot: "🍼" },
//      or change your ship to:
//        const PLAYER = loadImage("sprites/ship.png");
//
// That's it — the game knows how to draw both emoji and pictures.
//
// =====================================================================
// =====  (You can stop reading here if you like! The rest is the  =====
// =====   game engine. Peek if you're curious how it all works.)  =====
// =====================================================================


// ---------------------------------------------------------------------
// loadImage(): the tiny helper that lets a PNG stand in for an emoji.
// It hands back an <img> straight away; the picture fills in once the
// file has loaded. If the file is missing the game just keeps going.
// ---------------------------------------------------------------------
function loadImage(src) {
  const img = new Image();
  img.src = src;
  img.isSprite = true; // a little flag so we know "this is a picture"
  return img;
}

// Grab the canvas (our drawing surface) and its 2D pen ("ctx").
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

// ---------------------------------------------------------------------
// BUILD: which copy of the game this is. It is printed in small grey text
// at the foot of the start screen.
//
// The game is shared as a link, and a phone can hold on to an old copy of a
// web page for a long time — so "I changed it but nothing changed on my
// iPad" is nearly always the iPad still running yesterday's game. This line
// settles it in one look: if the start screen does not show the build you
// expect, the device has an old copy and nothing you changed is running.
//
// Bump it whenever you change something you need to see on another device.
// ---------------------------------------------------------------------
const BUILD = "2026-08-22 fullscreen";

// How big things are drawn, in pixels.
const CELL = 40;          // the size of one animal / the player
const FONT = CELL + "px serif"; // emoji are just text, so we pick a font size

// ---------------------------------------------------------------------
// bakedSprite(): pixel art, painted ONCE onto a little picture of its own.
//
// A sprite is a grid of letters, and the plain way to draw it is one small
// square per letter. That is 123 squares for one cow — and with a full herd,
// the bases and your ship, the game was asking the browser to paint more than
// 4000 squares in every single frame. A computer takes that in its stride, but
// a phone or a tablet does not: each one of those is a separate instruction to
// the browser, and on a phone the instructions cost more than the paint.
//
// So we paint each sprite one time onto its own small off-screen canvas and
// then STAMP that, which is one instruction instead of 123. The picture is
// exactly the same, to the pixel: the squares land in the same places, and a
// stamp at whole-pixel positions copies them across untouched.
//
// Each sprite is only ever drawn at a few sizes (the herd at 40, the shots at
// 28, the boss at 260, and so on), so we keep one baked picture per size on
// the sprite itself and make it the first time it is asked for.
// ---------------------------------------------------------------------
function bakedSprite(thing, ps) {
  const baked = thing.baked || (thing.baked = {});
  if (baked[ps]) return baked[ps];
  const rows = thing.rows;
  const gh = rows.length;
  const gw = rows[0].length;
  const cv = document.createElement("canvas");
  cv.width = gw * ps;
  cv.height = gh * ps;
  const c = cv.getContext("2d");
  for (let r = 0; r < gh; r++) {
    const line = rows[r];
    for (let col = 0; col < gw; col++) {
      const paint = SPRITE_PAL[line[col]];
      if (!paint) continue; // "." = see-through, skip it
      c.fillStyle = paint;
      c.fillRect(col * ps, r * ps, ps, ps);
    }
  }
  return (baked[ps] = cv);
}

// ---------------------------------------------------------------------
// drawThing(): draws either an emoji (a string) OR a loaded picture,
// centred at (x, y). This is the magic that makes the one-line PNG
// swap above "just work" — every drawing goes through here.
// ---------------------------------------------------------------------
function drawThing(thing, x, y, size, rotate) {
  size = size || CELL;
  // Optionally spin the drawing around its centre (used to point the
  // rocket straight up — the 🚀 emoji leans to the upper-right by default).
  if (rotate) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotate);
    ctx.translate(-x, -y);
  }
  if (thing && thing.isPixel) {
    // It's pixel art: a grid of letters, each letter one fat, crisp square.
    // We fit the grid into a size×size box and centre it, with the block size
    // rounded to whole pixels so the art stays sharp. The squares themselves
    // were painted once by bakedSprite() up above, so all that is left here is
    // to stamp that picture down — and we round where it lands, because a stamp
    // on a whole pixel is copied across exactly, and one on a half pixel is
    // smudged across two.
    const rows = thing.rows;
    const ps = Math.max(1, Math.round(size / Math.max(rows[0].length, rows.length)));
    const baked = bakedSprite(thing, ps);
    // Nothing in the game spins pixel art — only an emoji ship needs turning —
    // but if you ever do, this tells the browser not to smooth the picture as it
    // turns it, which keeps the blocks much sharper (about a third as many soft,
    // smudged edge pixels). Straight, unspun art is copied across pixel for
    // pixel either way. The rotate branch above has already done ctx.save(),
    // so this gets put back for us.
    if (rotate) ctx.imageSmoothingEnabled = false;
    ctx.drawImage(baked, Math.round(x - baked.width / 2),
                         Math.round(y - baked.height / 2));
  } else if (typeof thing === "string") {
    // It's an emoji / text. Draw it centred.
    ctx.font = size + "px serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(thing, x, y);
  } else if (thing && thing.isSprite && thing.complete && thing.naturalWidth) {
    // It's a picture that has finished loading. Draw it centred.
    ctx.drawImage(thing, x - size / 2, y - size / 2, size, size);
  } else {
    // A picture that isn't ready yet — draw a placeholder box so you
    // can still see and play. It pops in once the PNG loads.
    ctx.fillStyle = "#555";
    ctx.fillRect(x - size / 2, y - size / 2, size, size);
  }
  if (rotate) ctx.restore();
}


// ---------------------------------------------------------------------
// GAME STATE  — all the moving parts live in plain variables.
// ---------------------------------------------------------------------
let player;        // {x, y}
let invaders;      // array of {x, y, alive, animal, shot}
let bullets;       // YOUR shots going up:   array of {x, y, dmg}
let shots;         // animal shots coming down: array of {x, y, emoji}
let bases;         // the shields: array of { blocks: [{x, y, alive}] }
let particles;     // explosion bits: array of {x, y, vx, vy, life, maxLife, color}
let shockwaves;    // BLAST CANNON blast rings: array of {x, y, life}
let bolts;         // ELECTRIC ARC jumps drawn this frame: array of {x1,y1,x2,y2}
let invaderDir;    // +1 moving right, -1 moving left
let score;
let lives;
let state;         // "start" (waiting), "playing", "lost", or "shop"
let paused;        // true while the game is frozen by the ⏸ button (or P)
let beamTimer;     // frames left of the RED LASER's beam (0 = not firing)
let beamCooldown;  // frames left before the beam can be fired again
let gunTimer;      // frames until this ship's gun has finished reloading
let invuln;        // frames left of "just got hit, can't be hit again yet"
let stage;         // which wave you're on (1, 2, 3, ...) — everything speeds up
let stageBanner;   // frames left to show the "STAGE N" banner
let gameOverHandled; // did we already deal with this game over (save score etc.)?
let enteringName;  // true while the "new high score!" name box is open
let lastEntry;     // the run you just saved, so we can highlight it gold
let justUnlocked = []; // ships the run you just finished earned, to shout about

// Remember which keys are currently held down.
const keys = {};

// shotTimer counts down between animal shots, so they come in a steady
// trickle instead of all at once.
let shotTimer = 0;

// ---------------------------------------------------------------------
// buildLevel(): lay out a fresh wave of animals and brand-new bases, and
// clear anything left flying around. Used at the start of every stage.
// ---------------------------------------------------------------------
// Is this a boss stage? And if there's a BIG CHICK on the board, which one is
// it? Almost everything else in the game treats it as just another animal.
function isBossStage() { return stage % BOSS_EVERY === 0; }
function theBoss() { return invaders.find((inv) => inv.alive && inv.boss); }
// How much health an ordinary animal has on this stage. Once you're past the
// first boss they're twice as hard to put down.
function herdHp() { return stage > TOUGH_AFTER ? TOUGH_HP : 1; }
// How wide across a thing is. Everything is one CELL except the boss.
function sizeOf(inv) { return inv.size || CELL; }

function buildLevel() {
  invaders = [];
  if (isBossStage()) {
    // No herd this time — just the BIG CHICK, on its own, in the middle.
    // It's an ordinary invader in every way the rest of the game cares about;
    // it's simply enormous (`size`), tough (`hp`), and its eggs go off.
    invaders.push({
      x: W / 2,
      y: BOSS_TOP,
      alive: true,
      animal: BIG_CHICK_ART,
      shot: BOSS_EGG_ART,
      heat: 0,
      hp: BOSS_HP,
      maxHp: BOSS_HP,
      size: BOSS_SIZE,     // everything else is CELL (40) across
      boss: true,
    });
  } else {
    // Build the grid of animals, centred across the screen.
    const gapX = 70;     // space between animals across
    const gapY = 60;     // space between rows
    const startX = (W - (COLS - 1) * gapX) / 2; // centre the grid horizontally
    const startY = 80;   // top of the grid
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        // Pick a random animal for this spot, so the herd is a mixed bunch.
        const kind = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
        invaders.push({
          x: startX + col * gapX,
          y: startY + row * gapY,
          alive: true,
          animal: kind.animal, // which emoji to draw
          shot: kind.shot,     // what it throws at you
          heat: 0,             // how long it's been held in the RED LASER's beam
          // Health. Most bullets take off 1, so one hit downs an animal — but
          // past stage TOUGH_AFTER they have twice that and take two.
          hp: herdHp(),
          maxHp: herdHp(),     // what it started with, so we can show it fading
        });
      }
    }
  }

  // Build the bases (shields) you can hide behind. Each base is a little
  // grid of blocks; shots eat away one block at a time, so they slowly
  // crumble — from both the animals' shots AND your own bullets. You get
  // fresh bases at the start of each stage.
  bases = [];
  const baseW = BASE_BLOCKS_W * BASE_BLOCK;
  const baseGap = (W - BASE_COUNT * baseW) / (BASE_COUNT + 1); // even spacing
  const baseY = player.y - 150; // sit above the player, with room to duck
  for (let i = 0; i < BASE_COUNT; i++) {
    const bx = baseGap + i * (baseW + baseGap);
    const blocks = [];
    for (let r = 0; r < BASE_BLOCKS_H; r++) {
      for (let c = 0; c < BASE_BLOCKS_W; c++) {
        if (isCarved(r, c)) continue; // shaped: leave carved-out spots empty
        blocks.push({
          x: bx + c * BASE_BLOCK + BASE_BLOCK / 2,
          y: baseY + r * BASE_BLOCK + BASE_BLOCK / 2,
          alive: true,
        });
      }
    }
    bases.push({ blocks });
  }

  // Re-centre the player and clear the air.
  player.x = W / 2;
  bullets = [];
  shots = [];
  particles = [];
  shockwaves = [];
  bolts = [];
  invaderDir = 1;
  shotTimer = 0;
  invuln = 0;
  beamTimer = 0;      // a fresh wave means a cooled-off, fully loaded gun
  beamCooldown = 0;
  gunTimer = 0;
  stageBanner = BANNER_TIME;
}

// ---------------------------------------------------------------------
// newGame(): reset the score/lives/stage and lay out a fresh board.
// startState is "start" (wait on the start screen) or "playing" (go now).
// ---------------------------------------------------------------------
function newGame(startState) {
  player = { x: W / 2, y: H - CELL - 20 };
  score = 0;
  lives = STARTING_LIVES;
  stage = 1;
  state = startState;
  paused = false;
  gameOverHandled = false;
  enteringName = false;
  lastEntry = null;
  hideNameEntry();
  buildLevel();
  // A fresh game is never paused, so space comes back on. Without this, a run
  // you paused (or backed out of into the shop) and then restarted would come
  // back silent: nothing else would ever tell the drone to fade in again.
  updateSpace();
}

// setup(): the very first screen. Build the board but WAIT — the game
// doesn't move until the player taps/clicks/presses to begin.
function setup() {
  newGame("start");
}

// begin(): leave the start screen and actually start playing.
function begin() {
  if (state !== "start") return;
  state = "playing";
  stageBanner = BANNER_TIME; // flash "STAGE 1" as we kick off
  // Bring up the space drone. This is the first press of the game, and a
  // browser won't let a page make a sound until you've touched it — so this
  // is the earliest moment we're allowed to start it.
  updateSpace();
}

// startOrRestart(): what a tap / click / Enter does when you're NOT mid-game
// — begin from the start screen, or play again after game over.
function startOrRestart() {
  if (state === "start") begin();
  else if (state === "lost" || state === "shop") newGame("playing");
}

// ---------------------------------------------------------------------
// openShop() / closeShop(): pop into the ship shop and back out again.
// You can get there from the start screen, from the game-over screen once
// you've dealt with the name box, or straight out of a game in progress
// with the 🛒 button. shopCameFrom remembers which screen sent you, so
// BACK returns you to the right one.
//   Opening it mid-game freezes everything (update() only runs while the
// state is "playing") and pauses you, so you come back to the PAUSED
// screen and choose when to dive back in rather than being dropped
// straight into the middle of a wave.
// ---------------------------------------------------------------------
let shopCameFrom = "start";
function openShop() {
  if (state !== "start" && state !== "lost" && state !== "playing") return;
  if (enteringName) return; // deal with the high-score box first
  if (state === "playing") paused = true;
  shopCameFrom = state;
  state = "shop";
  updateSpace(); // browsing ships is quiet if you came in from a live game
}
function closeShop() {
  if (state !== "shop") return;
  state = shopCameFrom;
  updateSpace();
}

// ---------------------------------------------------------------------
// restartGame(): start the whole run again from the beginning — stage 1,
// no score, all your lives back, a fresh board. It is the "I have had
// enough of this run, let me begin again" button, not a way to retry one
// wave: the stage number goes back to 1 along with everything else, and
// the speed the herd had built up over the stages goes with it.
//
// The one thing it does NOT throw away is a ship you earned along the way.
// Ships are unlocked by the best score you have ever reached in a single
// run, so a run worth remembering is banked before the score is wiped —
// otherwise pressing this at 16,000 points would quietly cost you the
// ELECTRIC ARC you had just earned. It leaves the high-score board alone,
// though: that is for runs you played out to the end.
// ---------------------------------------------------------------------
function restartGame() {
  if (state !== "playing") return;
  if (score > bestRun) {
    bestRun = score;
    saveShop();
  }
  newGame("playing"); // stage 1, score 0, full lives, fresh board, un-paused
}

// toggleFullScreen(): fill the whole screen, or go back to a window. The
// browser only allows this from a key press or a tap, which is why it hangs off
// the F key rather than happening on its own. Safari wants its own spelling of
// both calls, and if the browser will not do it at all we just carry on in a
// window — there is nothing to tell the player, and nothing to break.
function toggleFullScreen() {
  try {
    const el = document.documentElement;
    const isFull = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFull) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  } catch (e) { /* not allowed here — stay in the window */ }
}

// togglePause(): freeze / un-freeze a game in progress. Everything stops
// moving (update() bails out) but the screen keeps being drawn, so you see
// the board exactly as you left it under a "PAUSED" sign. Only means
// anything mid-game — there's nothing to pause on the start/game-over screens.
function togglePause() {
  if (state !== "playing") return;
  paused = !paused;
  updateSpace(); // the drone fades away with everything else, and comes back
}

// Look away and the game waits for you. Switching to another tab, another
// app, or minimising the window pauses a game in progress, so you never come
// back to find the herd landed while you were gone. It only ever pauses,
// never un-pauses: you come back to the PAUSED screen and start again when
// your hands are ready.
//   visibilitychange covers switching tabs and minimising; the window's blur
// covers clicking away to another app while the tab is still on screen.
// We also forget any held-down keys, because the keyup happens off-page and
// we'd never hear it — otherwise you'd resume already drifting sideways.
function pauseOnLeave() {
  for (const k in keys) keys[k] = false;
  if (state === "playing") paused = true;
  updateSpace(); // and it goes quiet while you're away, rather than droning on
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseOnLeave();
});
window.addEventListener("blur", pauseOnLeave);

// ---------------------------------------------------------------------
// nextStage(): you cleared the herd! Keep your score and lives, bump the
// stage (which speeds everything up), and lay out a fresh, faster wave.
// ---------------------------------------------------------------------
function nextStage() {
  score += STAGE_BONUS * stage; // reward for clearing the wave
  stage++;
  // Whatever was still in the air belonged to the wave you just beat. This
  // matters most after the boss: being blown up by the last egg of a chicken
  // you've already beaten would be a rotten way to lose a life.
  shots = [];
  buildLevel();
}

// ---------------------------------------------------------------------
// KEYBOARD — note when keys go down and up.
// ---------------------------------------------------------------------
document.addEventListener("keydown", (e) => {
  // While the high-score name box is open, let the typing go to it and
  // ignore all game controls (so Space doesn't restart mid-name, etc.).
  if (enteringName) return;
  keys[e.key] = true;
  // M mutes / un-mutes the sound at any time.
  if (e.key === "m" || e.key === "M") { toggleSound(); return; }
  // P (or Escape) pauses / un-pauses a game in progress — and backs you
  // out of the shop, where there's nothing to pause.
  if (e.key === "p" || e.key === "P" || e.key === "Escape") {
    if (state === "shop") closeShop(); else togglePause();
    return;
  }
  // R starts the whole run again, from stage 1.
  if (e.key === "r" || e.key === "R") { restartGame(); return; }
  // F fills the screen. On a computer this is where the size is: the game is
  // drawn as big as the height allows, and the browser's own tabs, address bar
  // and bookmarks can easily eat a third of it. Full screen hands all of it
  // back. (A phone has no F key, and on an iPad you add the game to the Home
  // Screen instead — see the meta tags at the top of the file.)
  if (e.key === "f" || e.key === "F") { toggleFullScreen(); return; }
  // S opens the shop from the start or game-over screen (and shuts it again).
  if (e.key === "s" || e.key === "S") {
    if (state === "shop") closeShop(); else openShop();
    return;
  }
  // In the shop, 1 / 2 / 3 fly the ship on that row, if you've earned it.
  // (The same thing the row's button does when tapped.)
  if (state === "shop" && e.key >= "1" && e.key <= String(SHIPS.length)) {
    equipShip(SHIPS[Number(e.key) - 1]);
    return;
  }
  // On the start / game-over / shop screens, Enter/Space begins (or restarts).
  if (state !== "playing" && (e.key === "Enter" || e.key === " " || e.key === "Spacebar")) {
    startOrRestart();
    e.preventDefault();
    return;
  }
  // Shoot on a fresh press of Space — one shot per press. We ignore
  // e.repeat (the machine-gun events the OS sends while a key is HELD),
  // so holding Space does nothing; you must tap it for each shot.
  if ((e.key === " " || e.key === "Spacebar") && !e.repeat) playerFire();
  // Stop space/arrows from scrolling the page.
  if ([" ", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
    e.preventDefault();
  }
});
document.addEventListener("keyup", (e) => {
  keys[e.key] = false;
});

// ---------------------------------------------------------------------
// TOUCH CONTROLS — wire the on-screen buttons (phones/tablets) to the
// same controls the keyboard uses. We use "pointer" events so they work
// for a finger or a mouse. Holding ◀ / ▶ moves; each tap of FIRE shoots.
// ---------------------------------------------------------------------
// A short "pew" laser sound made on the fly with the Web Audio API — no
// sound files needed. A quick downward-sweeping square-wave blip that
// fades out fast. The audio "context" is created on the first shot (browsers
// only allow sound to start after the player interacts with the page).
let audioCtx = null;

// Sound starts ON. Tap the 🔊 button (top-left) or press M to mute; the
// choice is remembered for next time. Every sound checks this first.
let soundOn = true;
try { soundOn = localStorage.getItem("ai-sound") !== "off"; } catch (e) {}
function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem("ai-sound", soundOn ? "on" : "off"); } catch (e) {}
  if (soundOn) playShootSound(); // a tiny chirp so you know sound is back on
  updateSpace();                 // and space itself fades in or out with it
}

// `light` gives a shorter, quieter, higher pew — used by the RAPID FIRE
// ship, whose steady stream would be a racket at full volume.
function playShootSound(light) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const dur = light ? 0.05 : 0.12;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(light ? 1250 : 880, t);        // start high...
    osc.frequency.exponentialRampToValueAtTime(light ? 620 : 220, t + dur); // ...sweep down
    gain.gain.setValueAtTime(light ? 0.05 : 0.15, t);           // gentle volume
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);     // quick fade
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) { /* if audio isn't available, just stay silent */ }
}

// A short "boom" made with the Web Audio API — a burst of filtered white
// noise that fades out, for when you blow up an animal. No sound files needed.
function playExplosionSound(big = false) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    // A "big" boom (player hit) is longer and louder than a regular one, but
    // both are deep, sub-bass rumbles. The sound is two layers stacked:
    //   1) a low SINE sweep — the deep "body" you feel in your chest
    //   2) heavily low-passed NOISE — the gritty "rumble" texture on top
    const dur = big ? 1.8 : 1.4;

    // Master gain for the whole boom, with a fast attack and a long fade so it
    // rumbles out rather than popping off abruptly.
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(big ? 1.0 : 0.9, t + 0.03); // quick swell in
    master.gain.exponentialRampToValueAtTime(0.0001, t + dur);           // long rumble out
    master.connect(audioCtx.destination);

    // A slow LFO wobbles the volume up and down — that pulsing tremor is what
    // makes the boom read as a "rumble" instead of a smooth steady tone.
    const lfo = audioCtx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.setValueAtTime(big ? 14 : 18, t);   // a few wobbles per second
    const lfoDepth = audioCtx.createGain();
    lfoDepth.gain.setValueAtTime(0.5, t);             // how deep the wobble cuts
    lfo.connect(lfoDepth).connect(master.gain);
    lfo.start(t);
    lfo.stop(t + dur);

    // --- Layer 1: deep sine sub-bass sweep (the "boom") ---
    const sub = audioCtx.createOscillator();
    sub.type = "sine";
    sub.frequency.setValueAtTime(big ? 70 : 85, t);  // already very low...
    sub.frequency.exponentialRampToValueAtTime(big ? 16 : 20, t + dur); // ...sinks into deep sub rumble
    const subGain = audioCtx.createGain();
    subGain.gain.setValueAtTime(1.0, t);
    sub.connect(subGain).connect(master);
    sub.start(t);
    sub.stop(t + dur);

    // --- Layer 2: low-passed noise (the gritty "rumble") ---
    const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    // Keep the cutoff very low so almost no hiss survives — just low rumble.
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(big ? 200 : 170, t);
    filter.frequency.exponentialRampToValueAtTime(big ? 35 : 40, t + dur);
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.7, t);
    noise.connect(filter).connect(noiseGain).connect(master);
    noise.start(t);
    noise.stop(t + dur);
  } catch (e) { /* if audio isn't available, just stay silent */ }
}

// The voice of both beam guns: a short, gritty zap. Played once loudly as the
// beam lights up, then quietly over and over while it burns — which is why
// the beam crackles as it fires, and falls silent the moment you pause
// (the ticks are counted out by update(), and update() freezes too).
// `electric` gives the ELECTRIC ARC its own harsher, higher voice, so you can
// hear which gun you're holding without looking.
function playLaserSound(start, electric) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const dur = start ? 0.3 : 0.1;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    // Square is harsher than sawtooth — that's the crackle of the ARC.
    osc.type = electric ? "square" : "sawtooth";
    const top = electric ? (start ? 1800 : 900) : (start ? 1200 : 520);
    const low = electric ? (start ? 260 : 600) : (start ? 180 : 380);
    osc.frequency.setValueAtTime(top, t);
    osc.frequency.exponentialRampToValueAtTime(low, t + dur);
    // A square wave is louder for the same number, so hold the ARC down a bit.
    const loud = electric ? 0.13 : 0.18;
    const quiet = electric ? 0.035 : 0.05;
    gain.gain.setValueAtTime(start ? loud : quiet, t); // the crackle stays well under the zap
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) { /* if audio isn't available, just stay silent */ }
}

// ---------------------------------------------------------------------
// THE SOUND OF SPACE — a quiet drone that plays under everything else,
// so the game doesn't sit in silence between the bangs.
//   It's three things at once: two very low notes a fraction of a beat
// apart, which drift in and out of step with each other and make the
// sound feel vast rather than flat; a third note higher up to stop the
// bottom end turning to mud; and a slow wash of filtered noise drifting
// over the top, like solar wind.
//   It's built ONCE and then left running forever. Only the volume moves.
// Starting and stopping oscillators over and over would click, and the
// drone has to be able to fade away and come back without a seam.
// ---------------------------------------------------------------------
const SPACE_LEVEL = 0.2;  // how far under everything else the drone sits
const SPACE_FADE  = 1.5;  // seconds it takes to fade in or out
let spaceGain = null;     // the drone's volume knob, once it's been built

// How loud the drone should be right this moment. One place decides, so
// muting, pausing and clicking away from the tab can't disagree.
function spaceLevel() {
  return !soundOn || paused ? 0 : SPACE_LEVEL;
}

function buildSpace() {
  if (spaceGain) return;                 // already built — never build it twice
  const t = audioCtx.currentTime;
  spaceGain = audioCtx.createGain();
  spaceGain.gain.setValueAtTime(0.0001, t);
  spaceGain.connect(audioCtx.destination);

  // The notes. 55 and 55.3 are close enough to beat slowly against each
  // other — that slow throb is the whole trick.
  //   The same pair is stacked an OCTAVE up, at 110, because a laptop or a
  // phone simply cannot push air at 55 vibrations a second: their little
  // speakers give up somewhere around 150, so a drone built only out of the
  // deep notes is silent on most machines however loud you make it. The
  // octave carries the same beat up to where every speaker can reach it.
  // 165 is a fifth higher again, quiet, to stop the bottom end turning to mud.
  [[55, 0.42], [55.3, 0.42], [110, 0.3], [110.6, 0.3], [165, 0.14]].forEach(([hz, vol]) => {
    const osc = audioCtx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(hz, t);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t);
    osc.connect(g).connect(spaceGain);
    osc.start(t);
  });

  // The solar wind: four seconds of noise looped forever, pushed through
  // a filter that opens and closes on a twenty-second breath. Because the
  // filter moves and the noise doesn't, the loop never sounds like a loop.
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 4, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  noise.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = "lowpass";
  // The wash sits well up into the range a small speaker can manage — down
  // at 300 it was as inaudible as the deep notes were. High enough to hear,
  // low enough that it's a wash and not a hiss.
  filter.frequency.setValueAtTime(620, t);
  const breath = audioCtx.createOscillator();
  breath.type = "sine";
  breath.frequency.setValueAtTime(0.05, t);   // one slow breath every 20 seconds
  const breathDepth = audioCtx.createGain();
  breathDepth.gain.setValueAtTime(420, t);    // how far the filter swings
  breath.connect(breathDepth).connect(filter.frequency);
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.3, t);
  noise.connect(filter).connect(noiseGain).connect(spaceGain);
  noise.start(t);
  breath.start(t);
}

// Bring the drone up to where it ought to be, building it the first time.
// Everything that could change the answer calls this: starting a game,
// muting, pausing, and clicking away from the tab.
function updateSpace() {
  try {
    if (!soundOn && !spaceGain) return;  // muted and never started — nothing to do
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.resume) audioCtx.resume();
    buildSpace();
    const t = audioCtx.currentTime;
    const to = Math.max(0.0001, spaceLevel());
    // Ramp from wherever it is NOW, so a fade that's still running gets
    // picked up mid-way instead of jumping.
    spaceGain.gain.cancelScheduledValues(t);
    spaceGain.gain.setValueAtTime(Math.max(0.0001, spaceGain.gain.value), t);
    spaceGain.gain.exponentialRampToValueAtTime(to, t + SPACE_FADE);
  } catch (e) { /* if audio isn't available, just stay silent */ }
}

// shootBullets(): put this ship's shot in the air — two bullets for the
// TWIN BLASTER, one for everybody else, each carrying the ship's damage.
// Called both by a press and by the RAPID FIRE stream, so a bullet is
// always built the same way.
function shootBullets() {
  const ship = currentShip();
  const nose = player.y - CELL / 2;
  if (ship.fire === "twin") {
    bullets.push({ x: player.x - 11, y: nose, dmg: ship.damage });
    bullets.push({ x: player.x + 11, y: nose, dmg: ship.damage });
  } else {
    // `bomb` marks a BLAST CANNON shell — it blows up where it lands
    // instead of just poking the one animal it touched.
    bullets.push({ x: player.x, y: nose, dmg: ship.damage, bomb: ship.fire === "bomb" });
  }
  gunTimer = ship.reload;                 // this gun's own reload time
  playShootSound(!!ship.auto);            // a held stream gets a lighter, quicker pew
}

// ---------------------------------------------------------------------
// playerFire(): what happens when you PRESS fire, whichever ship you're
// flying. Both the Space bar and the on-screen FIRE button come through
// here, so the two can never drift apart.
//   SCOUT        — one bullet, as always.
//   RAPID FIRE   — one light bullet now; hold the button and update()
//                  keeps the stream going at five a second.
//   TWIN BLASTER — two bullets side by side.
//   RED LASER    — lights up the beam (see update()), if it's reloaded.
//   ELECTRIC ARC — the same, but a longer burn and the current jumps.
// ---------------------------------------------------------------------
function playerFire() {
  if (state !== "playing" || paused) return;
  const ship = currentShip();
  if (ship.beam) {
    // One press burns the beam for its whole `time`; you can't fire again
    // until it's finished burning AND finished reloading.
    if (beamTimer === 0 && beamCooldown === 0) {
      beamTimer = ship.beam.time;
      playLaserSound(true, !!ship.beam.jagged);
    }
    return;
  }
  // A gun that's still reloading simply doesn't go off — hammering the key
  // can't beat a ship's fire rate.
  if (gunTimer > 0) return;
  shootBullets();
}

function fireShot() {
  // The on-screen FIRE button. Starting the game and restarting are handled
  // by the "tap anywhere" listener below.
  playerFire();
}

// A move button holds a direction down while you're pressing it.
function holdButton(id, key) {
  const el = document.getElementById(id);
  const press   = (e) => { e.preventDefault(); keys[key] = true; };
  const release = (e) => { e.preventDefault(); keys[key] = false; };
  el.addEventListener("pointerdown", press);
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
  el.addEventListener("pointerleave", release);
}
holdButton("btn-left", "ArrowLeft");
holdButton("btn-right", "ArrowRight");
// FIRE both shoots on the tap AND stays "held", so the RAPID FIRE ship
// streams while your finger is down, exactly like holding the Space bar.
holdButton("btn-fire", " ");
document.getElementById("btn-fire").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  fireShot();
});

// Where the two little toggles sit on the canvas (in game pixels), side by
// side under the score, and a helper to turn a screen tap into game pixels
// (the canvas is scaled to fit the screen).
// And the SCORE text itself is a hidden switch for the frame-rate readout —
// see countFrame() further down. A phone is where you need that reading, and a
// phone is exactly where you cannot easily add ?fps to the address, so one tap
// on the score turns it on. It sits above the row of buttons, and tapping it
// does nothing else, so there is nothing to collide with.
const SCORE_TAP    = { x: 0,   y: 6,  w: 210, h: 30 };
const SOUND_ICON   = { x: 12,  y: 42, w: 36, h: 32 };
const PAUSE_ICON   = { x: 56,  y: 42, w: 36, h: 32 };
const RESTART_ICON = { x: 100, y: 42, w: 36, h: 32 };
const SHOP_ICON    = { x: 144, y: 42, w: 36, h: 32 };
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
function hitIcon(p, icon) {
  return p.x >= icon.x && p.x <= icon.x + icon.w &&
         p.y >= icon.y && p.y <= icon.y + icon.h;
}
// Tapping an icon or an on-screen button does that one thing — and must NOT
// also start the game, so a hit stops the tap from reaching the "tap
// anywhere to start" listener below.
canvas.addEventListener("pointerdown", (e) => {
  const p = canvasPoint(e);
  if (hitIcon(p, SOUND_ICON)) {
    e.stopPropagation();
    toggleSound();
    return;
  }
  if (state === "playing" && hitIcon(p, SCORE_TAP)) {
    e.stopPropagation();
    toggleFpsReadout();
    return;
  }
  if (state === "playing" && hitIcon(p, PAUSE_ICON)) {
    e.stopPropagation();
    togglePause();
    return;
  }
  if (state === "playing" && hitIcon(p, RESTART_ICON)) {
    e.stopPropagation();
    restartGame();
    return;
  }
  if (state === "playing" && hitIcon(p, SHOP_ICON)) {
    e.stopPropagation();
    openShop();
    return;
  }
  // The buttons on the start / game-over / shop screens.
  for (const b of screenButtons()) {
    if (b.action && hitIcon(p, b)) {
      e.stopPropagation();
      b.action();
      return;
    }
  }
});

// Tap or click ANYWHERE to start from the start screen (or to play again
// after game over). Ignored while you're playing — and in the shop, where
// browsing shouldn't fling you into a game; that screen has its own buttons.
document.addEventListener("pointerdown", () => {
  if (enteringName) return; // don't restart while typing your name
  if (state === "shop") return;
  if (state !== "playing") startOrRestart();
});


// ---------------------------------------------------------------------
// update(): the "thinking" half of the game loop. Runs ~60 times a
// second. It moves everything and checks for collisions.
// ---------------------------------------------------------------------
function update() {
  if (state !== "playing") return; // frozen on the game-over screen
  if (paused) return;              // ...and frozen while paused

  // Each stage speeds the animals up a little. speedScale is 1 on stage 1,
  // 1.12 on stage 2, and so on. shotSpeed is how fast their shots fall now.
  const speedScale = 1 + (stage - 1) * STAGE_SPEEDUP;
  const shotSpeed = SHOT_SPEED * speedScale;
  if (stageBanner > 0) stageBanner--; // count down the "STAGE N" banner

  // --- Move the player ---
  // Firing a beam is heavy work: while one is lit you steer slowly, so you
  // can't simply sweep it across the whole herd in one go. The ELECTRIC ARC
  // is the heaviest of the lot.
  const lit = beamTimer > 0 && currentShip().beam;
  const moveSpeed = PLAYER_SPEED * (lit ? currentShip().beam.drag : 1);
  if (keys["ArrowLeft"] || keys["a"] || keys["A"])  player.x -= moveSpeed;
  if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += moveSpeed;
  // Keep the player inside the screen.
  player.x = Math.max(CELL / 2, Math.min(W - CELL / 2, player.x));

  // --- Shooting ---
  // Most ships fire once per press (see the keydown handler above). The
  // RAPID FIRE ship instead pours out a stream for as long as you hold the
  // button down, one bullet every RAPID_EVERY frames.
  if (gunTimer > 0) gunTimer--;
  if (currentShip().auto && keys[" "] && gunTimer === 0) shootBullets();

  // --- Move YOUR bullets up; drop ones that fly off the top ---
  for (const b of bullets) b.y -= PLAYER_BULLET_SPEED;
  bullets = bullets.filter((b) => b.y > -20);

  // --- Move the herd (or the boss) ---
  const aliveCount = invaders.filter((inv) => inv.alive).length;
  const totalCount = ROWS * COLS;
  const boss = theBoss();
  let step;
  if (boss) {
    // The BIG CHICK sweeps on its own. It gets ANGRIER the more you hurt it:
    // by the time it's nearly beaten it's charging back and forth.
    const hurt = 1 - boss.hp / BOSS_HP;
    step = BOSS_SPEED * (1 + hurt * BOSS_RAGE) * speedScale;
  } else {
    // The fewer animals are left, the faster they go (classic tension!).
    // Speed grows from 1x up to about 4x as the herd is wiped out.
    const speedMult = 1 + (1 - aliveCount / totalCount) * 3;
    step = INVADER_SPEED * speedMult * speedScale;
  }

  // Move them sideways. If any hits an edge, the whole herd drops and
  // reverses direction. The boss is far too wide to use CELL here, so we
  // measure each one by its own size.
  let hitEdge = false;
  for (const inv of invaders) {
    if (!inv.alive) continue;
    inv.x += step * invaderDir;
    const half = sizeOf(inv) / 2;
    if (inv.x > W - half || inv.x < half) hitEdge = true;
  }
  if (hitEdge) {
    invaderDir *= -1;
    for (const inv of invaders) {
      if (!inv.alive) continue;
      // A row's drop for the herd; the boss only sags a little, or it would
      // be on top of you before you'd got through its health.
      inv.y += inv.boss ? BOSS_DROP : 20;
      // If the animals reach the bottom, it's game over.
      if (inv.y + sizeOf(inv) / 2 > player.y - CELL / 2) state = "lost";
    }
  }

  // --- The boss lays a clutch of exploding eggs ---
  // The BIG CHICK doesn't shoot one thing at a time like the herd does. It
  // lays a whole CLUTCH at once, spread out across its width, with the middle
  // one aimed at you — so there's a gap to run to, but you have to pick it.
  if (boss) {
    if (shotTimer > 0) shotTimer--;
    if (shotTimer === 0) {
      const startY = boss.y + sizeOf(boss) / 2;
      const fallTime = Math.max(1, (player.y - startY) / shotSpeed);
      for (let i = 0; i < BOSS_CLUTCH; i++) {
        // Spread the clutch out under its belly, and lean each egg a
        // different way. The middle egg of an odd clutch goes for you.
        const spread = BOSS_CLUTCH === 1 ? 0 : (i / (BOSS_CLUTCH - 1)) * 2 - 1;
        const aimed = i === (BOSS_CLUTCH - 1) / 2;
        // The outside eggs lean out by a different amount every clutch. Without
        // that the boss lays exactly the same pattern every time and the fight
        // becomes one memorised dance — and a pattern you happen to be caught
        // on the wrong side of traps you every time it comes round.
        let vx = aimed ? (player.x - boss.x) / fallTime
                       : spread * SHOT_ANGLE * (0.5 + Math.random());
        vx = Math.max(-AIM_MAX, Math.min(AIM_MAX, vx));
        shots.push({
          x: boss.x + spread * sizeOf(boss) * 0.3,
          y: startY, emoji: boss.shot, vx: vx,
          size: 34, explodes: true,   // an egg that goes off where it lands
        });
      }
      // Its reload is NOT sped up by the stage the way the herd's is. The
      // boss only ever turns up on stage 15 or later, where that multiplier
      // is already nearly 3× — it would be laying eggs faster than they fall.
      shotTimer = BOSS_RELOAD;
    }
  }

  // --- Animals shoot ---
  // This works like the REAL Space Invaders: only a few shots fall at
  // once (MAX_SHOTS), and they come on a timer instead of all at the same
  // time. Only the FRONT animal in a column (the lowest one) can shoot,
  // and each animal throws its OWN thing (milk, eggs, mud, bananas, ice).
  if (shotTimer > 0 && !boss) shotTimer--;
  if (!boss && shotTimer === 0 && shots.length < MAX_SHOTS) {
    const shooter = pickShooter();
    if (shooter) {
      const startY = shooter.y + CELL / 2;
      let vx;
      if (Math.random() < AIM_CHANCE) {
        // AIMED shot: work out the sideways drift needed to land where the
        // player is right now (how far across ÷ how long it takes to fall),
        // then cap it so the shot can't fly almost sideways.
        const fallTime = Math.max(1, (player.y - startY) / shotSpeed);
        vx = (player.x - shooter.x) / fallTime;
        vx = Math.max(-AIM_MAX, Math.min(AIM_MAX, vx));
      } else {
        // Stray shot: straight down, or a slight random angle.
        vx = Math.random() < 0.5 ? 0 : (Math.random() * 2 - 1) * SHOT_ANGLE;
      }
      shots.push({ x: shooter.x, y: startY, emoji: shooter.shot, vx: vx });
      // Reload a bit faster as the herd thins out — and faster each stage.
      shotTimer = Math.round(SHOT_RELOAD / speedScale * (0.4 + 0.6 * aliveCount / totalCount));
    }
  }
  // Move shots down (and sideways for angled ones); drop ones that leave the screen.
  for (const m of shots) {
    m.y += shotSpeed;
    m.x += m.vx;
  }
  shots = shots.filter((m) => m.y < H + 20 && m.x > -20 && m.x < W + 20);

  // --- COLLISIONS happen here ---

  // --- The beam guns: the RED LASER and the ELECTRIC ARC ---
  // While it burns, the beam is a column of light from the ship's nose
  // straight up and off the top of the screen, and it keeps going instead
  // of stopping at the first thing it touches — so it works on a whole
  // column of animals at once.
  //   Animals don't pop the instant it touches them, though: they have to
  // be HELD in it for `burn` frames before they go, and they cool off again
  // the moment you swing away. Together with the slow steering above, that's
  // what stops one burn wiping out the entire wave — you have to pick your
  // column and stay on it.
  //   The ELECTRIC ARC adds one thing: the current JUMPS out to the sides.
  // See just below for how hard, and how far.
  //   Their falling shots are flimsier and burn up on contact, and your own
  // bases are untouched: the beam passes right over your cover, so the most
  // powerful gun in the game can't make you lose by wrecking a shield.
  const beamGun = currentShip().beam;
  const beamOn = beamTimer > 0 && !!beamGun;
  const beamHalf = (beamGun ? beamGun.width : BEAM_WIDTH) / 2;
  // How close the beam has to be to catch something, measured from that
  // thing's own middle — so the BIG CHICK is caught anywhere across its body,
  // not just when you're lined up with its beak.
  const reachTo = (size) => size / 2 + beamHalf;
  const inBeam = (x, y, size) =>
    Math.abs(x - player.x) < reachTo(size === undefined ? CELL : size) && y < player.y;
  // The ELECTRIC ARC throws the current out sideways as well, and it WALKS
  // out: one animal is `arc` pixels, and each hop keeps only `jump` of the
  // punch the hop before it had. So the animals beside the beam take half, the
  // ones past them a quarter, and the ones past THOSE an eighth — the current
  // reaches deep into the herd but bites softer the further it goes.
  // hopOf() says how many hops out an animal is, or 0 for out of reach.
  const hopOf = (x, y) => {
    if (!beamOn || !beamGun.arc || y >= player.y) return 0;
    const hop = Math.ceil(Math.abs(x - player.x) / beamGun.arc);
    return hop <= beamGun.hops ? hop : 0;
  };
  bolts = [];                       // the jumps drawn this frame, if any
  let melted = 0;
  for (const inv of invaders) {
    if (!inv.alive) continue;
    const onIt = beamOn && inBeam(inv.x, inv.y, sizeOf(inv));
    const hop = onIt ? 0 : hopOf(inv.x, inv.y);
    if (onIt || hop > 0) {
      if (hop > 0) {
        // The current gutters, so `gutter` is how hard it bites THIS frame —
        // anywhere from nothing to twice its share. That's why no two animals
        // beside the beam ever go in the same order twice. The frames it
        // gutters out to nothing are the frames no bolt is drawn, so what you
        // see on the screen is exactly what the current is doing.
        const gutter = Math.random();
        inv.heat += gutter * 2 * Math.pow(beamGun.jump, hop);
        if (gutter > 0.12) bolts.push(jumpBolt(inv, hop, gutter));
      } else {
        inv.heat++;
      }
      // Held in it long enough, and the beam takes one animal's worth off it.
      // That's the whole of an ordinary animal, so they melt exactly as they
      // always did — but the BIG CHICK has sixty of them, so a beam has to be
      // held on it over and over to see it off.
      if (inv.heat >= beamGun.burn) {
        inv.heat = 0;
        inv.hp -= 1;
        if (inv.hp <= 0) {
          inv.alive = false;
          spawnExplosion(inv.x, inv.y, inv.boss ? 5 : 1);
          score += inv.boss ? BOSS_POINTS : 10;
          melted++;
        } else {
          spawnExplosion(inv.x, inv.y + sizeOf(inv) / 4, 0.5); // scorched, not beaten
        }
      }
    } else if (inv.heat > 0) {
      inv.heat--; // out of it — cool back down
    }
  }
  // ONE boom for the whole column, however many animals went up together —
  // a handful of overlapping explosions would just be noise.
  if (melted > 0) playExplosionSound();
  if (beamOn) {
    beamTimer--;
    // The crackle as it burns. The ARC crackles faster; it's a rougher gun.
    const tick = beamGun.jagged ? 4 : 6;
    if (beamTimer % tick === 0) playLaserSound(false, !!beamGun.jagged);
    shots = shots.filter((m) => !inBeam(m.x, m.y)); // their shots burn up
    if (beamTimer === 0) beamCooldown = beamGun.reload; // burnt out — now reload
  } else {
    // A gun with no beam can't be left holding a lit one, or the timer would
    // stick and the beam ships would never load again.
    if (!beamGun) beamTimer = 0;
    if (beamCooldown > 0) beamCooldown--;
  }

  // Your bullets hitting animals. A bullet takes its ship's `dmg` off the
  // animal's health — a full-strength one downs it outright, while the RAPID
  // FIRE ship's lighter bullets need two hits. A hit that isn't fatal throws
  // off a little spark, so you can see it landed.
  for (const b of bullets) {
    for (const inv of invaders) {
      if (inv.alive && hit(b.x, b.y, inv.x, inv.y, sizeOf(inv))) {
        // A BLAST CANNON shell doesn't poke one animal — it goes off, and
        // the bang does all the damage to everything standing near it.
        if (b.bomb) {
          bombBlast(b.x, b.y);
          b.y = -999;
          break;                    // one bang per shell
        }
        inv.hp -= b.dmg;
        b.y = -999;                 // send bullet off-screen so it's cleaned up
        if (inv.hp <= 0) {
          inv.alive = false;          // animal destroyed
          spawnExplosion(inv.x, inv.y, inv.boss ? 5 : 1); // BOOM!
          playExplosionSound(!!inv.boss);  // ...and the BOOM is heard
          score += inv.boss ? BOSS_POINTS : 10; // points!
        } else {
          // Winged it — just a spark, thrown where the bullet actually
          // struck, which on something the size of the boss matters.
          spawnExplosion(b.x, b.y, 0.3);
        }
      }
    }
    // Your bullets also chip away at the bases (don't shoot your own cover!).
    if (b.y > -20 && hitBase(b.x, b.y)) b.y = -999;
  }
  bullets = bullets.filter((b) => b.y > -20);

  // Animal shots crumbling the bases (your cover slowly wears down). An
  // ordinary shot chips off one block and stops there. The BIG CHICK's eggs
  // don't chip — they go OFF, and take a hole out of the base with them.
  for (const m of shots) {
    if (m.y > H + 20) continue;
    if (m.explodes) {
      // An egg lands on cover, or on the ground down at your level.
      if (hitBase(m.x, m.y, true) || m.y > player.y + CELL / 2) {
        eggBlast(m.x, m.y);
        m.y = H + 999;
      }
    } else if (hitBase(m.x, m.y)) {
      m.y = H + 999;
    }
  }

  // Count down the "safe" flashing time after being hit.
  if (invuln > 0) invuln--;

  // Shots hitting the player. While you're flashing (invuln) you're safe,
  // so one splash can't drain several lives at once. An egg that reaches you
  // goes off instead, which is worse: the blast is far wider than the egg.
  for (const m of shots) {
    if (m.y > H + 20) continue;
    if (invuln === 0 && hit(m.x, m.y, player.x, player.y, CELL)) {
      m.y = H + 999;       // remove this shot
      if (m.explodes) { eggBlast(m.x, m.y); continue; }
      lives--;             // lose a life
      invuln = SAFE_TIME;  // brief flashing safety so you can recover
      spawnExplosion(player.x, player.y, 2.5); // a BIG blast where you got hit
      playExplosionSound(true);                // ...and a big boom to match
      if (lives <= 0) state = "lost";
    }
  }
  shots = shots.filter((m) => m.y < H + 20);
